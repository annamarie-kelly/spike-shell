      border-bottom: 1px solid color-mix(in srgb, var(--mauve) 35%, transparent);
    }
    .md a.wikilink:hover { border-bottom-color: var(--mauve); }
    .md a.wikilink.broken {
      color: var(--ink-faint); border-bottom: 1px dashed var(--ink-ghost); cursor: help;
    }
    /* syntax highlighting — tokens mapped to the palette so it themes itself */
    .pvrender pre.hl code { font: inherit; color: var(--ink); }
    .hljs-comment, .hljs-quote { color: var(--ink-faint); font-style: italic; }
    .hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-type, .hljs-selector-tag, .hljs-doctag { color: var(--rose); }
    .hljs-string, .hljs-regexp, .hljs-addition, .hljs-meta-string { color: var(--sage); }
    .hljs-number, .hljs-symbol, .hljs-bullet, .hljs-link { color: var(--tan); }
    .hljs-title, .hljs-title.class_, .hljs-title.function_, .hljs-section, .hljs-name, .hljs-selector-id, .hljs-selector-class { color: var(--mauve); }
    .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-property, .hljs-params { color: var(--tan); }
    .hljs-meta, .hljs-deletion { color: var(--ink-ghost); }
    .hljs-emphasis { font-style: italic; }
    .hljs-strong { font-weight: 600; }
    /* markdown frontmatter rendered as an Obsidian-style properties block */
    .md .props {
      margin: 0 0 18px; border: 1px solid var(--edge); border-radius: 8px;
      overflow: hidden; font: 13px -apple-system, system-ui, sans-serif;
    }
    .md .props .prop { display: flex; gap: 12px; padding: 7px 12px; border-top: 1px solid var(--edge-soft); }
    .md .props .prop:first-child { border-top: none; }
    .md .props .k { flex: 0 0 130px; color: var(--ink-faint); }
    .md .props .v { color: var(--ink); min-width: 0; }
    .md .props .chip {
      display: inline-block; margin: 0 5px 3px 0; padding: 1px 8px; border-radius: 10px;
      background: color-mix(in srgb, var(--mauve) 16%, transparent); color: var(--mauve); font-size: 12px;
    }
    /* calm centered message for binary / too-large files */
    .pvrender .pvmsg {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--ink-faint); font: 13px -apple-system, system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    /* ── comment-to-agent ───────────────────────────────────────────
       Select text in the preview and a chip offers to leave a note for the
       session that owns the work. Chip + composer are themed to the surface
       so they read as part of Spike, not a bolt-on. Both anchor to .preview
       and rise above the selection point (.below flips them under it). */
    .cmchip, .cmtoast {
      position: absolute; z-index: 40; display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px 5px 8px; border-radius: 8px; white-space: nowrap;
      background: var(--elevated); color: var(--ink-soft);
      border: 1px solid var(--edge); box-shadow: 0 6px 20px rgba(var(--shadow), calc(.30 * var(--shadow-k)));
      font: 12px/1 -apple-system, system-ui, sans-serif;
      transform: translateX(-50%); transition: opacity .18s ease;
      animation: cmrise .13s cubic-bezier(.2,.8,.2,1) both;
    }
    .cmchip { cursor: pointer; border: none; }
    .cmchip:hover { color: var(--ink); box-shadow: 0 6px 22px rgba(var(--shadow), calc(.36 * var(--shadow-k))); }
    .cmchip svg { color: var(--accent); }
    .cmtoast svg { color: var(--sage); }
    /* vertical position is JS-computed (cmPlace) and clamped to the pane; the
       keyframe only fades + lifts a few px, keeping the horizontal centering. */
    @keyframes cmrise {
      from { opacity: 0; transform: translateX(-50%) translateY(4px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .cmpop {
      position: absolute; z-index: 41; width: 356px; max-width: calc(100% - 20px);
      /* --elevated (white in light, lifted charcoal in dark) reads as a floating
         popover — a smidge more contrast than the page, and matches the Note chip. */
      background: var(--elevated); border: 1px solid var(--edge); border-radius: 12px;
      box-shadow: 0 18px 50px rgba(var(--shadow), calc(.45 * var(--shadow-k))); overflow: hidden;
      transform: translateX(-50%);
      animation: cmrise .13s cubic-bezier(.2,.8,.2,1) both;
    }
    .cmpop .loc {
      padding: 9px 12px 7px; border-bottom: 1px solid var(--edge-soft);
      font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-faint);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cmpop .cmquote {
      margin: 9px 12px 2px; padding: 1px 0 1px 10px; color: var(--ink-faint);
      border-left: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
      font: 12px/1.45 -apple-system, system-ui, sans-serif;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .cmpop .cmta {
      display: block; box-sizing: border-box; width: calc(100% - 24px); margin: 8px 12px 0;
      border: none; outline: none; background: transparent; color: var(--ink); resize: none;
      min-height: 36px; max-height: 160px; overflow-x: hidden; overflow-y: hidden;
      font: 13px/1.5 -apple-system, system-ui, sans-serif; caret-color: var(--accent);
    }
    .cmpop .cmta::placeholder { color: var(--ink-ghost); }
    .cmpop .cmfoot { display: flex; align-items: center; gap: 6px; padding: 9px 12px 11px; }
    .cmpop .cmtarget {
      display: inline-flex; align-items: center; gap: 3px; max-width: 140px;
      padding: 2px 8px 2px 6px; border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font: 11px -apple-system, system-ui, sans-serif; color: var(--mauve);
      background: color-mix(in srgb, var(--mauve) 15%, transparent);
    }
    .cmpop .cmtarget svg { flex: 0 0 auto; }
    .cmpop .cmsend {
      border: none; cursor: pointer; padding: 5px 13px; border-radius: 7px;
      background: var(--accent); color: var(--bg); font: 600 12px -apple-system, system-ui, sans-serif;
      transition: filter .12s ease;
    }
    /* the action group sits right; the target chip holds the left */
    .cmpop .cmadd { margin-left: auto; }
    /* each button carries its own chord, faint, so the footer needs no
       separate hint line doubling the labels */
    .cmpop .cmadd .k, .cmpop .cmsend .k { margin-left: 5px; font-size: 10px; font-weight: 400; opacity: .55; }
    .cmpop .cmsend:hover { filter: brightness(1.07); }
    .cmpop .cmsend:disabled { opacity: .45; cursor: default; filter: none; }
    /* Add (escape hatch into batching): secondary weight next to Send */
    .cmpop .cmadd {
      border: 1px solid var(--edge); cursor: pointer; padding: 4px 11px; border-radius: 7px;
      background: transparent; color: var(--ink-soft); font: 600 12px -apple-system, system-ui, sans-serif;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .cmpop .cmadd:hover { background: var(--elevated); color: var(--ink); border-color: var(--accent); }
    .cmpop .cmadd:disabled { opacity: .4; cursor: default; background: transparent; color: var(--ink-soft); border-color: var(--edge); }
    /* persistent annotations — highlight + note that stick to a doc. Painted
       with the CSS Custom Highlight API (no DOM mutation, survives re-render);
       the note popover reuses the .cmpop shell. (These ::highlight rules also
       give the find feature's in-DOM matches their colour.) */
    /* annotation highlight — a real span so it styles richly + clears on delete.
       A soft marker wash, a thin accent underline, brighter on hover; the box
       decoration clones per line so multi-line highlights keep rounded ends. */
    .spike-annot {
      background-color: color-mix(in srgb, var(--accent) 12%, transparent);
      border-radius: 3px; cursor: pointer;
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--accent) 48%, transparent);
      text-decoration-thickness: 1.5px; text-underline-offset: 3px;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
      transition: background-color .12s ease;
    }
    .spike-annot:hover {
      background-color: color-mix(in srgb, var(--accent) 22%, transparent);
      text-decoration-color: var(--accent);
    }
    ::highlight(spike-find) { background-color: color-mix(in srgb, var(--accent) 32%, transparent); }
    ::highlight(spike-find-current) { background-color: color-mix(in srgb, var(--accent) 60%, transparent); }
    /* Highlight button — left of the agent group in the composer; reused as the
       Delete control in the annotation popover. margin-right:auto carves the gap,
       so the real Add button no longer needs its own auto-margin when present. */
    .cmpop .cmhl {
      margin-right: auto; border: 1px solid var(--edge); cursor: pointer;
      padding: 4px 11px; border-radius: 7px; background: transparent;
      color: var(--ink-soft); font: 600 12px -apple-system, system-ui, sans-serif;
      display: inline-flex; align-items: center; gap: 5px;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .cmpop .cmhl:hover { background: var(--elevated); color: var(--ink); }
    .cmpop .cmhl svg { color: var(--tan); }
    .cmpop .cmhl ~ .cmadd { margin-left: 0; }
    /* composer send targeting — the target chip (which agent), the accent Send,
       and the inline session picker it expands. */
    .cmpop .cmactions { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
    .cmpop .cmpick {
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      padding: 3px 7px; border-radius: 8px; border: 1px solid var(--edge); background: transparent;
      color: var(--ink-soft); font: 600 11px -apple-system, system-ui, sans-serif;
      max-width: 150px; transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .cmpop .cmpick:hover:not(.solo) { background: var(--elevated); color: var(--ink); border-color: color-mix(in srgb, var(--accent) 45%, var(--edge)); }
    .cmpop .cmpick.solo { cursor: default; }
    .cmpop .cmpick.open { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); color: var(--ink); }
    .cmpop .cmpick .cmpick-dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--mauve); }
    .cmpop .cmpick .cmpick-nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmpop .cmpick svg { flex: 0 0 auto; opacity: .55; }
    .cmpop .cmsendto {
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      padding: 4px 10px; border-radius: 7px; background: transparent;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--edge)); color: var(--accent);
      font: 600 12px -apple-system, system-ui, sans-serif; transition: background .12s ease;
    }
    .cmpop .cmsendto:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .cmpop .cmsendto .k { margin-left: 3px; font-size: 10px; font-weight: 400; opacity: .55; }
    .cmpop .cmsesslist {
      margin: 4px 12px 0; padding-top: 6px; border-top: 1px solid var(--edge-soft);
      display: flex; flex-direction: column; gap: 2px; max-height: 148px; overflow-y: auto;
    }
    .cmpop .cmsessrow {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: pointer;
      padding: 5px 8px; border-radius: 7px; border: none; background: transparent;
      color: var(--ink-soft); font: 12px -apple-system, system-ui, sans-serif;
    }
    .cmpop .cmsessrow:hover { background: var(--surface-soft); color: var(--ink); }
    .cmpop .cmsessrow.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--ink); }
    .cmpop .cmsessrow .cmsessdot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--mauve); }
    .cmpop .cmsessrow .cmsessnm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmpop .cmsessrow .cmsessyou {
      flex: 0 0 auto; font: 10px -apple-system, system-ui, sans-serif; color: var(--ink-faint);
      padding: 1px 6px; border-radius: 6px; background: var(--elevated);
    }
    /* in-app reader — a fetched external link rendered as a readable article in
       the preview. Quiet header over the sanitized prose; the body reuses .md
       typography (the wrap carries class "md webarticle"). */
    .webarticle .webhead {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;
      padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--edge);
    }
    .webarticle .webtitle { flex: 1 1 100%; font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.25; }
    .webarticle .webmeta { color: var(--ink-faint); font-size: 12px; }
    /* the header's right-aligned action group: Notes (primary, accent) + Open in browser */
    .webarticle .webactions { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
    .webarticle .webactions button {
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap;
      padding: 4px 11px; border-radius: 7px; border: 1px solid var(--edge); background: transparent;
      color: var(--ink-soft); font: 600 11.5px -apple-system, system-ui, sans-serif;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .webarticle .webactions button:hover { background: var(--elevated); color: var(--ink); }
    /* Notes is the primary doorway to your marginalia — give it the accent tint */
    .webarticle .webnotes {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--edge)) !important;
      color: var(--accent) !important;
    }
    .webarticle .webnotes svg { color: var(--accent); }
    .webarticle .webnotes:hover { background: color-mix(in srgb, var(--accent) 12%, transparent) !important; }
    /* a centred reading column — the single biggest "this is a reader" cue */
    .webarticle { max-width: 720px; margin: 0 auto; }
    /* low-confidence notice: calm, non-blocking, never hides the body */
    .webarticle .webnote {
      margin: -4px 0 20px; padding: 9px 13px; border-radius: 8px;
      background: color-mix(in srgb, var(--tan) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--tan) 30%, transparent);
      color: var(--ink-soft); font-size: 12.5px; line-height: 1.45;
    }
    /* article links read as quiet prose, not accent-pink buttons */
    .webarticle .webbody a {
      color: var(--ink); text-decoration: underline;
      text-decoration-color: var(--edge); text-underline-offset: 2px;
    }
    .webarticle .webbody a:hover { text-decoration-color: var(--ink-faint); }
    /* The pending tray — docked bottom-right, present only while the queue has
       notes. The glanceable "don't forget one" record: a row per queued note. */
    .cmtray {
      position: absolute; z-index: 42; right: 14px; bottom: 14px; width: 300px; max-width: calc(100% - 28px);
      background: var(--surface); border: 1px solid var(--edge); border-radius: 12px;
      box-shadow: 0 16px 44px rgba(var(--shadow), calc(.42 * var(--shadow-k))); overflow: hidden;
      animation: cmfade .15s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes cmfade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .cmtray .cmtraylist { max-height: 168px; overflow-y: auto; padding: 6px; }
    .cmtray .cmtrayrow {
      display: flex; align-items: baseline; gap: 8px; padding: 5px 6px 5px 8px; border-radius: 7px;
    }
    .cmtray .cmtrayrow:hover { background: var(--surface-soft); }
    .cmtray .cmtrayrow .loc {
      flex: 0 0 auto; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-faint);
    }
    .cmtray .cmtrayrow .tx {
      flex: 1 1 auto; min-width: 0; color: var(--ink-soft);
      font: 12px -apple-system, system-ui, sans-serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cmtray .cmtrayrow .del {
      flex: 0 0 auto; display: inline-flex; border: none; background: transparent; cursor: pointer;
      color: var(--ink-ghost); padding: 1px; border-radius: 4px; opacity: 0; transition: opacity .12s ease;
    }
    .cmtray .cmtrayrow:hover .del { opacity: 1; }
    .cmtray .cmtrayrow .del:hover { color: var(--ink); background: var(--edge); }
    .cmtray .cmtrayfoot {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px 10px; border-top: 1px solid var(--edge-soft);
    }
    .cmtray .cmtraycount { font: 12px -apple-system, system-ui, sans-serif; color: var(--ink-soft); }
    .cmtray .cmtrayfoot .cmsend {
      margin-left: auto; border: none; cursor: pointer; padding: 5px 13px; border-radius: 7px;
      background: var(--accent); color: var(--bg); font: 600 12px -apple-system, system-ui, sans-serif;
      transition: filter .12s ease;
    }
    .cmtray .cmtrayfoot .cmsend:hover { filter: brightness(1.07); }
    .cmtray .cmtrayfoot .cmsend:disabled { opacity: .45; cursor: default; filter: none; }
    /* ── notes drawer ───────────────────────────────────────────────────
       The pvhead toggle: a quiet ghost button carrying a count badge. Gains
       the accent tint once the doc has notes, and reads as "pressed" while the
       drawer is open. */
    .pvhead .pvnotesbtn {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 7px; border-radius: 5px; height: 24px;
      border: 1px solid transparent; background: transparent; cursor: pointer;
      color: var(--ink-faint); font: 600 11px -apple-system, system-ui, sans-serif;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .pvhead .pvnotesbtn svg { display: block; }
    .pvhead .pvnotesbtn:hover { background: var(--elevated); color: var(--ink); }
    .pvhead .pvnotesbtn.has { color: var(--accent); }
    .pvhead .pvnotesbtn.has svg { color: var(--accent); }
    .pvhead .pvnotesbtn.on { background: color-mix(in srgb, var(--accent) 14%, transparent);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--edge)); color: var(--accent); }
    .pvhead .pvnotesbtn .pvnotes-n {
      min-width: 15px; text-align: center; padding: 0 4px; border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent);
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    /* The drawer itself — docked to the right edge of .pvbody, sliding in over
       the render. A quiet surface with its own header, a scrollable card list,
       and a calm empty state. Overlays rather than reflows the doc, so it never
       fights the live-split geometry; jumping to a note scrolls its passage to
       center, which stays visible beside the 300px panel. */
    .pvbody .cmside {
      position: absolute; z-index: 30; top: 0; right: 0; bottom: 0; width: 300px; max-width: 78%;
      display: flex; flex-direction: column; background: var(--surface);
      border-left: 1px solid var(--edge); box-shadow: -12px 0 30px rgba(var(--shadow), calc(.22 * var(--shadow-k)));
      animation: cmsidein .16s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes cmsidein { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
    .cmside .cmside-hd {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--edge-soft);
    }
    .cmside .cmside-ttl { flex: 1 1 auto; color: var(--ink); font: 600 12.5px -apple-system, system-ui, sans-serif; letter-spacing: .01em; }
    .cmside .cmside-x {
      flex: 0 0 auto; display: inline-flex; border: none; background: transparent; cursor: pointer;
      color: var(--ink-ghost); padding: 3px; border-radius: 6px; transition: background .12s ease, color .12s ease;
    }
    .cmside .cmside-x:hover { background: var(--elevated); color: var(--ink); }
    .cmside .cmside-list { flex: 1 1 auto; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .cmside .cmside-empty {
      flex: 1 1 auto; display: flex; align-items: center; text-align: center;
      padding: 24px 22px; color: var(--ink-faint); font: 12.5px/1.55 -apple-system, system-ui, sans-serif;
    }
    /* one note = a card: the quoted passage (click to jump) over an inline,
       auto-growing note field; a delete control fades in on hover. */
    .cmside .cmside-card {
      position: relative; padding: 9px 10px 10px; border-radius: 9px;
      background: var(--surface-soft); border: 1px solid var(--edge-soft);
      transition: border-color .12s ease, background .12s ease;
    }
    .cmside .cmside-card:hover { border-color: var(--edge); }
    .cmside .cmside-q {
      cursor: pointer; padding-left: 8px; margin-bottom: 6px;
      border-left: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      color: var(--ink-soft); font: 12px/1.45 -apple-system, system-ui, sans-serif;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      transition: color .12s ease;
    }
    .cmside .cmside-q:hover { color: var(--ink); }
    .cmside .cmside-ta {
      display: block; box-sizing: border-box; width: 100%; border: none; outline: none; resize: none;
      background: transparent; color: var(--ink); overflow: hidden;
      font: 13px/1.5 -apple-system, system-ui, sans-serif; caret-color: var(--accent);
    }
    .cmside .cmside-ta::placeholder { color: var(--ink-ghost); }
    .cmside .cmside-del {
      position: absolute; top: 6px; right: 6px; display: inline-flex; border: none; background: transparent;
      cursor: pointer; color: var(--ink-ghost); padding: 2px; border-radius: 5px; opacity: 0;
      transition: opacity .12s ease, background .12s ease, color .12s ease;
    }
    .cmside .cmside-card:hover .cmside-del { opacity: 1; }
    .cmside .cmside-del:hover { background: var(--edge); color: var(--ink); }
    /* jump-to pulse: a brief brighten of the highlighted passage so the eye
       catches where the note lives after scrolling to it. */
    .spike-annot.flash {
      animation: annotflash 1.1s ease;
    }
    @keyframes annotflash {
      0%, 100% { background-color: color-mix(in srgb, var(--accent) 12%, transparent); }
      22% { background-color: color-mix(in srgb, var(--accent) 46%, transparent); }
    }
    /* ── markdown prose, themed for both modes ──────────────────────── */
    .md {
      /* cap the measure for readability and CENTER it in a wide pane (auto
         margins) — matches .webarticle. In a narrow split (pane < max-width)
         the column just fills, so this only visibly centers when full-screen. */
      padding: 18px 22px 40px; max-width: 760px; margin: 0 auto;
      color: var(--ink); font: 14px/1.65 -apple-system, system-ui, sans-serif;
    }
    .md h1, .md h2, .md h3, .md h4 { color: var(--ink); line-height: 1.3; font-weight: 600; }
    .md h1 { font-size: 1.7em; margin: .2em 0 .5em; }
    .md h2 { font-size: 1.35em; margin: 1.3em 0 .5em; padding-bottom: .25em; border-bottom: 1px solid var(--edge-soft); }
    .md h3 { font-size: 1.12em; margin: 1.2em 0 .4em; }
    .md h4 { font-size: 1em; margin: 1.1em 0 .4em; color: var(--ink-soft); }
    .md p { margin: .6em 0; }
    .md a { color: var(--accent); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md ul, .md ol { margin: .6em 0; padding-left: 1.5em; }
    .md li { margin: .25em 0; }
    /* task-list items carry their own checkbox — drop the list bullet so a
       checklist reads as checkboxes, not "• ☑" (both read + edit modes). */
    .md li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.15em; }
    .md li > input[type="checkbox"] { margin: 0 .5em 0 0; vertical-align: middle; accent-color: var(--accent); }
    .md blockquote {
      margin: .8em 0; padding: .2em 1em; color: var(--ink-soft);
      border-left: 3px solid var(--edge);
    }
    .md hr { border: none; border-top: 1px solid var(--edge); margin: 1.4em 0; }
    .md code {
      background: var(--surface); color: var(--ink-soft); border-radius: 4px;
      padding: .12em .35em; font: .88em ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .md pre {
      background: var(--surface); border: 1px solid var(--edge-soft); border-radius: 6px;
      padding: 12px 14px; overflow: auto; margin: .8em 0;
    }
    .md pre code { background: none; padding: 0; color: var(--ink); }
    .md table { border-collapse: collapse; margin: .8em 0; }
    .md th, .md td { border: 1px solid var(--edge); padding: 5px 10px; text-align: left; }
    .md th { background: var(--surface); color: var(--ink); }
    .md img { max-width: 100%; border-radius: 6px; }
    /* ![[note]] transclusions — a quiet quoted block; the title opens the note */
    .md .embed {
      display: block; margin: .6em 0; padding: 8px 12px;
      background: var(--surface-soft); border-left: 2px solid var(--edge);
      border-radius: 0 6px 6px 0;
    }
    .md .embed .embed-title {
      display: block; font-size: 11px; color: var(--ink-faint);
      margin-bottom: 2px; cursor: pointer; user-select: none;
    }
    .md .embed .embed-title:hover { color: var(--accent); }
    .md .embed .embed-body { display: block; }
    .md .embed .embed-body > p:first-child { margin-top: 0; }
    .md .embed .embed-body > p:last-child, .md .embed .embed-body > ul:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <div id="bar" data-tauri-drag-region>
    <button id="barNavOpen" class="baricon" data-tip="Show sidebar" aria-label="Show sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div id="barBrand" data-tauri-drag-region><span class="bmark"><img id="barBrandImg" alt="" /></span><span class="bwm">spike</span></div>
    <div id="barTitle" data-tauri-drag-region>
      <span data-tauri-drag-region>Spike</span>
      <span id="project" title="open a different project folder">
        <span class="nm">~/…</span><span class="car"></span>
      </span>
    </div>
    <span id="ctx" data-tauri-drag-region></span>
    <span id="status" data-tauri-drag-region></span>
    <button id="barSearch" class="baricon" data-tip="Search ⌘K" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
  </div>
  <div id="shell">
    <nav id="tree"><div id="sessionpanel" class="spanel"></div><div id="recentpanel" class="spanel rpanel"></div><div class="hint">no folder open</div></nav>
    <div id="treedivide" title="drag to resize"></div>
    <div id="wrap">
      <!-- #tileroot is the tiling mount. renderLayout() (app.ts) rebuilds the
           split/leaf scaffold inside it on every layout change, re-parenting the
           live #termcol and per-instance .preview nodes into the generated
           leaves so xterm canvases + editor state survive the move. -->
      <div id="tileroot">
      <div id="termcol">
        <div id="tabstrip">
          <div id="tabs"></div>
          <button id="tabmore-l" class="tabmore l" type="button" aria-label="scroll to hidden tabs on the left" hidden></button>
          <button id="tabmore-r" class="tabmore r" type="button" aria-label="scroll to hidden tabs on the right" hidden></button>
        </div>
        <div id="terms">
          <div id="welcome">
            <!-- src inlined as a data URI so the mark paints on the first HTML frame,

      <!-- Stamped per preview pane by makePreview() (app.ts): every preview
           the layout shows is a clone of this subtree, so several files can
           sit open side by side. Ids became classes when the singleton died;
           the instance id rides on data-preview-id. -->
      <template id="pvtemplate">
        <aside class="preview">
          <div class="pvhead">
            <span class="pvtabs"></span>
            <span class="pvsave" title="save (⌘S)"><span class="dot"></span><span class="lbl"></span></span>
            <!-- Notes drawer toggle — carries a count badge; opens the margin
                 panel that gathers every note for this doc. Sits just left of the
                 source/rendered segmented control. -->
            <!-- Right-hand control cluster. One group on purpose: notes, edit and
                 the view segment are all pane controls, so they share a single
                 tight rhythm instead of floating apart on the header's 8px gap. -->
            <span class="pvctl">
              <button class="pvnotesbtn" title="notes"></button>
              <!-- "Edit this page" — the discoverable way IN to WYSIWYG edit mode.
                   In the header beside the other controls rather than floating
                   over the prose, so the reading surface stays clean. -->
              <button class="pvpencil" type="button" title="Edit (⌘E)"></button>
              <span class="seg">
                <span class="opt pvsource" title="source"></span>
                <span class="opt pvrendered" title="rendered"></span>
              </span>
            </span>
          </div>
          <div class="pvbody">
            <div class="pveditwrap">
              <pre class="pvhl" aria-hidden="true"><code></code></pre>
              <textarea class="pveditor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
            </div>
            <!-- WYSIWYG formatting bar — only visible while editing a .md doc.
                 Buttons are populated in makePreview (icons + handlers). -->
            <div class="pvtoolbar" role="toolbar" aria-label="Formatting"></div>
            <div class="pvrender"></div>
          </div>
        </aside>
      </template>
    </div>
  </div>

  <!-- ─── Home / login landing (Cloudflare-OS shape, Spike-branded) ───────────
       Full-bleed view shown by showWelcome() before any project is open. Its own
       left nav + centered composer replace the welcome splash. Features not built
       yet carry a "Soon" chip and flash the #homeSoon toast on click; the real
       path in is [data-home-start] → pickProject(). -->
  <style>
    /* Newsreader (variable serif) — vendored woff2; used for the Home brand +
       hero heading, matching the spike.app landing type. */
    @font-face{font-family:"Newsreader";font-style:normal;font-weight:400 500;
      font-display:swap;src:url("/vendor/newsreader-latin.woff2") format("woff2")}
    #home{position:absolute;top:var(--barh);left:0;right:0;bottom:0;z-index:10;
      display:none;grid-template-columns:264px 1fr 0;grid-template-rows:minmax(0,1fr);background:var(--bg);color:var(--ink);
      font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      opacity:1;transition:opacity .28s ease}
    /* Keep the docked-terminal column from driving the grid ROW height off the
       xterm's intrinsic size (which mis-measures in the zoom context and left the
       app "cut in half"). The single row always fills; the terminal body clips. */
    #home .htdbg{min-height:0;overflow:hidden}
    #home.leaving{opacity:0;pointer-events:none}
    #home *{box-sizing:border-box}
    #home svg{display:block}
    /* On the Home landing the OS titlebar goes blank — only the traffic-light
       dots remain (the sidebar carries the brand + search). */
    html.home-open #barTitle, html.home-open #ctx, html.home-open #status,
    html.home-open #capbtn, html.home-open #kbtn{display:none}
    /* Bar icon buttons (nav-open + search) — the only chrome on the Home bar. */
    #bar .baricon{display:none;align-items:center;justify-content:center;width:30px;height:26px;border-radius:7px;
      border:1px solid transparent;background:none;color:var(--ink-faint);cursor:pointer;flex:0 0 auto}
    #bar .baricon:hover{color:var(--ink-soft);background:var(--elevated);border-color:var(--edge)}
    #bar .baricon svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
    /* Custom tooltip in the app's own palette (replaces the native title bubble). */
    #bar .baricon{position:relative}
    #bar .baricon::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);
      white-space:nowrap;background:var(--elevated);color:var(--ink-soft);border:1px solid var(--edge);
      border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:500;letter-spacing:.01em;
      box-shadow:0 2px 10px rgba(0,0,0,.16);opacity:0;transform:translateY(-3px);pointer-events:none;z-index:60;
      transition:opacity .12s ease .3s, transform .12s ease .3s}
    :root[data-theme="light"] #bar .baricon::after{box-shadow:0 2px 10px rgba(28,25,18,.14)}
    #bar #barSearch::after{right:0}
    #bar #barSettingsClose::after{right:0}
    #bar #barNavOpen::after{left:0}
    #bar .baricon:hover::after{opacity:1;transform:none}
    /* Settings open: the search icon steps aside; the close ✕ takes its far-right
       slot. #barSettingsClose is a .baricon, so it inherits size/hover/tooltip. */
    html.settings-open #bar #barSearch{display:none}
    html.settings-open #bar #barSettingsClose{display:inline-flex;margin-left:auto}
    /* Fullscreen: no traffic lights, so the bar's left is blank. Relocate the
       spike brand up into it and drop it from the sidebar (avoids the odd gap). */
    #barBrand{display:none;align-items:center;gap:8px}
    #barBrand .bmark img{width:18px;height:18px;display:block}
    :root[data-theme="light"] #barBrand .bmark img{filter:brightness(0)}
    :root[data-theme="dark"] #barBrand .bmark img{filter:none}
    #barBrand .bwm{font-family:"Newsreader","Iowan Old Style",Georgia,serif;font-size:18px;font-weight:500;letter-spacing:-.03em;color:var(--ink)}
    /* Fullscreen: drop the sidebar header entirely so the nav rides up to the
       top (Home first), and carry the brand + a collapse toggle up into the bar.
       Spike shows only while the sidebar is OPEN; collapsed, the bar keeps just
       the button to reopen it. */
    html.fullscreen.home-open #home .hbrand{display:none}
    html.fullscreen.home-open:not(.nav-collapsed) #barBrand{display:inline-flex}
    html.fullscreen.home-open #barNavOpen{display:inline-flex}
    /* Mirror the windowed sidebar header: spike on the LEFT, the open/close
       toggle on the RIGHT. barBrand's margin-right:auto shoves the toggle (and
       search) to the far edge; we drop barSearch's own auto so the two sit
       together rather than splitting the row. */
    html.fullscreen.home-open #barBrand{order:-1;margin-right:auto}
    html.fullscreen.home-open #bar #barNavOpen{order:1}
    html.fullscreen.home-open #bar #barSearch{order:2;margin-left:0}
    #bar #barSearch{margin-left:auto}          /* pin to the far right */
    html.home-open #barSearch{display:inline-flex}
    html.home-open.nav-collapsed #barNavOpen{display:inline-flex}
    /* Collapsed Home sidebar: the nav column animates to zero width and the
       content fades — a smooth slide, not a snap. (grid-template-columns is
       animatable in WebKit; the nav clips itself via overflow:hidden.) */
    /* --morph: the shared canvas-easing. Slow to start, accelerates through the
       middle, settles gently — an ease-in-out "quart" so the panes feel like
       they're fluidly reshaping, not snapping. Every track that moves when a doc
       opens/closes rides this same curve + duration so they travel as one. */
    #home{--morph:cubic-bezier(.76,0,.24,1);
      transition:opacity .3s ease, grid-template-columns .48s var(--morph)}
    #home .hnav{overflow:hidden;transition:opacity .3s ease}
    html.nav-collapsed #home{grid-template-columns:0 1fr 0}
    html.nav-collapsed #home .hnav{opacity:0;pointer-events:none}
    /* ── in-Home document preview ── */
    /* Opening a doc puts the DOCUMENT in focus, Cloudflare-style: the nav slides
       shut, the chat shrinks to a compact reading rail on the left, and the
       preview takes the rest — the calm two-pane shape. The preview lives in a
       THIRD track that is 0px wide at rest, so opening/closing just animates its
       width (grid-template-columns is animatable in WebKit) while the panel
       fades + slides in. Nav-aware: if you reopen the sidebar while reading, the
       nav track returns and the panes make room, rather than the nav vanishing. */
    #home.previewing{grid-template-columns:264px clamp(340px,34%,460px) minmax(0,1fr)}
    html.nav-collapsed #home.previewing{grid-template-columns:0 clamp(340px,34%,460px) minmax(0,1fr)}
    /* Debug raw-terminal column. Shares the third grid track with the preview,
       but on its own it takes a wider slice (a terminal needs the width). The
       xterm node is moved into #homeTermBody; FitAddon sizes the pty from that
       body, so the track width IS the pty width. */
    #home.dbgterm{grid-template-columns:264px minmax(0,1fr) clamp(360px,44%,760px)}
    html.nav-collapsed #home.dbgterm{grid-template-columns:0 minmax(0,1fr) clamp(360px,44%,760px)}
    #home .htdbg{grid-column:3;grid-row:1;z-index:2;border-left:1px solid var(--edge);background:var(--bg);
      display:none;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
    #home.dbgterm .htdbg{display:flex}
    #home .htdbg-head{display:flex;align-items:center;gap:9px;padding:11px 10px 10px 16px;border-bottom:1px solid var(--edge);flex:0 0 auto}
    #home .htdbg-title{font-size:11px;letter-spacing:.04em;font-weight:600;color:var(--ink-soft);flex:1;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #home .htdbg-x{appearance:none;background:none;border:0;cursor:pointer;color:var(--ink-faint);padding:3px;border-radius:5px;display:flex}
    #home .htdbg-x:hover{color:var(--ink);background:var(--surface)}
    #home .htdbg-body{flex:1;min-height:0;min-width:0;overflow:hidden;padding:6px 4px 6px 10px;position:relative}
    #home .htdbg-body .xterm{visibility:visible!important}
    /* ── Subagents panel: the native (Task/Agent) subagents of the Home session,
       surfaced beside the thread so spinning up helpers is VISIBLE again — the
       old pane had this watch-strip; the new Home dropped it. The data is already
       live on the session (chatPoll → pollNativeSubs); this only paints it, plus
       a click-in read-only transcript view. Shares grid track 3 with preview/
       dbgterm and yields to them (renderHomeSubs won't claim the track if either
       is open). Auto-shows the moment a subagent exists, hides when none remain. */
    #home.subs{grid-template-columns:264px minmax(0,1fr) clamp(248px,26%,344px)}
    html.nav-collapsed #home.subs{grid-template-columns:0 minmax(0,1fr) clamp(248px,26%,344px)}
    #home .hsubs{grid-column:3;grid-row:1;z-index:2;border-left:1px solid var(--edge-soft);background:var(--bg);
      display:none;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
    #home.subs .hsubs{display:flex}
    /* Header mirrors the sidebar's .hsec — an uppercase micro-label + ghost count
       — so the panel reads as the same system as Workstreams. In the click-in
       view it swaps to the subagent's name in sentence case beside a back chevron. */
    #home .hsubs-head{display:flex;align-items:center;gap:8px;padding:15px 14px 8px;flex:0 0 auto}
    #home .hsubs-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
    #home .hsubs-title .cnt{color:var(--ink-ghost);text-transform:none;letter-spacing:0;font-weight:600;margin-left:6px}
    #home .hsubs.viewing .hsubs-title{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink)}
    #home .hsubs-back{appearance:none;background:none;border:0;cursor:pointer;color:var(--ink-faint);padding:2px;border-radius:6px;
      display:none;align-items:center;flex:0 0 auto}
    #home .hsubs-back:hover{color:var(--ink);background:var(--surface)}
    #home .hsubs.viewing .hsubs-back{display:flex}
    #home .hsubs-body{flex:1;min-height:0;min-width:0;overflow-y:auto;padding:2px 8px 12px}
    /* A subagent row echoes .wrow: a status glyph + two quiet lines, rounded
       hover, no heavy slab. Explicitly left-aligned (override the button default). */
    #home .hsub{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;appearance:none;cursor:pointer;
      background:none;border:1px solid transparent;border-radius:9px;padding:8px 10px;margin:1px 0;color:var(--ink);font:inherit}
    #home .hsub:hover{background:var(--surface)}
    #home .hsub-ic{flex:0 0 auto;width:18px;height:18px;margin-top:1px;display:flex;align-items:center;justify-content:center}
    /* running: a calm pulsing accent dot — never red (red reads as an error). */
    #home .hsub.run .hsub-ic::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);
      animation:tabAttn 1.6s ease-in-out infinite}
    /* done: a soft accent-tinted disc holding a quiet check. */
    #home .hsub.done .hsub-ic{border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,transparent);
      color:var(--accent);font-size:11px;line-height:1;font-weight:700}
    #home .hsub-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
    #home .hsub-nm{max-width:100%;font-size:13.5px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #home .hsub.done .hsub-nm{color:var(--ink-soft)}
    #home .hsub-now{max-width:100%;font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* The panel is ALWAYS in the layout (in the 0-wide third track when closed),
       so open/close is one continuous motion: the track widens while the panel
       fades up and slides in from the right; closing reverses it. No display
       toggle — nothing to pop. */
    #home .hpv{border-left:1px solid var(--edge);background:var(--bg);display:flex;flex-direction:column;
      position:relative;min-width:0;min-height:0;overflow:hidden;
      opacity:0;transform:translateX(18px);
      transition:opacity .34s ease, transform .48s var(--morph)}
    #home.previewing .hpv{opacity:1;transform:none}
    #home .hpv-head{display:flex;align-items:center;gap:9px;padding:13px 12px 12px 18px;border-bottom:1px solid var(--edge);flex:0 0 auto}
    #home .hpv-kind{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--accent);
      border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:5px;padding:2px 6px;flex:0 0 auto}
    #home .hpv-kind:empty{display:none}
    #home .hpv-title{flex:0 1 auto;min-width:0;max-width:60%;font-size:13px;font-weight:600;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* a table title reads as clickable-to-rename on hover */
    #home .hpv-title.hpv-title-edit{cursor:text;border-radius:5px;padding:2px 5px;margin:-2px -5px}
    #home .hpv-title.hpv-title-edit:hover{background:color-mix(in srgb, var(--ink) 6%, transparent)}
    /* the table line-icon button, left of the title */
    #home .hpv-ticon{flex:0 0 auto;border:none;background:transparent;cursor:pointer;color:var(--ink-soft);line-height:0;
      padding:3px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
    #home .hpv-ticon:hover{background:color-mix(in srgb, var(--ink) 8%, transparent);color:var(--ink)}
    #home .hpv-ticon svg{display:block}
    /* inline title rename field — sizes to the name (via input.size), not the whole bar */
    #home .hpv-trename{flex:0 0 auto;width:auto;min-width:0;font:600 13px/1.3 -apple-system,system-ui,sans-serif;
      color:var(--ink);background:var(--elevated);border:1px solid var(--accent);border-radius:6px;padding:2px 8px;outline:none}
    /* icon picker popover (line icons, no emoji) */
    .hpv-iconpop{position:fixed;z-index:80;background:var(--elevated);border:1px solid var(--edge);border-radius:12px;
      box-shadow:0 12px 34px rgba(0,0,0,.2);padding:8px}
    .hpv-iconpop-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
    .hpv-iconopt{border:none;background:transparent;cursor:pointer;color:var(--ink-soft);line-height:0;width:32px;height:32px;
      border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
    .hpv-iconopt svg{display:block}
    .hpv-iconopt:hover{background:color-mix(in srgb, var(--ink) 8%, transparent);color:var(--ink)}
    .hpv-iconopt.sel{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent)}
    #home .hpv-gap{flex:1 1 auto}
    #home .hpv-head.editing .hpv-gap{display:none}
    /* the trailing icon buttons (pencil, close) — matched boxes, sitting close
       together so they read as one control cluster, not two stray glyphs. */
    #home .hpv-x{flex:0 0 auto;color:var(--ink-faint);display:flex;align-items:center;justify-content:center;
      width:28px;height:28px;padding:0;border-radius:7px;background:none;border:none;cursor:pointer}
    #home .hpv-x:hover{color:var(--ink);background:var(--surface)}
    #home .hpv-star{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
      width:26px;height:26px;padding:0;margin-left:2px;border:none;border-radius:6px;background:none;
      color:var(--ink-faint);cursor:pointer}
    #home .hpv-star:hover{color:var(--ink-soft);background:var(--surface)}
    #home .hpv-star svg{fill:none}
    #home .hpv-star.on{color:var(--accent)}
    #home .hpv-star.on svg{fill:var(--accent);stroke:var(--accent)}
    #home .hpv-head.editing .hpv-star{display:none}
    /* pinned sidebar rows reuse .wrow; show an unpin ✕ on hover */
    #home .wrow .wunpin{margin-left:auto;border:none;background:none;color:var(--ink-ghost);cursor:pointer;
      padding:2px 4px;border-radius:5px;opacity:0;display:inline-flex}
    #home .wrow:hover .wunpin{opacity:1}
    #home .wrow .wunpin:hover{color:var(--ink);background:var(--surface)}
    /* fullscreen the preview: collapse nav + chat, give the panel the whole width.
       !important so it wins over the previewing / nav-collapsed track rules
       regardless of which other state classes are also present. */
    #home.pv-max{grid-template-columns:0 0 minmax(0,1fr)!important}
    /* the collapsed nav + chat tracks are 0-wide; hide their overflow so no
       sliver of the composer / terminal label peeks past the panel edge */
    #home.pv-max>*:not(#homePreview){overflow:hidden;visibility:hidden}
    #home .hpv-expand .ic-in{display:none}
    #home.pv-max .hpv-expand .ic-out{display:none}
    #home.pv-max .hpv-expand .ic-in{display:block}
    #home .hpv-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:26px 30px 60px;
      font-size:15px;line-height:1.66;color:var(--ink)}
    #home .hpv-body.loading,#home .hpv-body.empty{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13.5px}
    /* HTML doc: the file renders itself, full-bleed, in a sandboxed frame — no
       reading-column padding, no prose styling wrapped around it. */
    #home .hpv-body.hpv-html{padding:0;overflow:hidden}
    #home .hpv-htmlframe{width:100%;height:100%;border:0;display:block;background:var(--elevated)}
    /* ── in-Home doc editing (pencil → in-place edit; Done → save) ─────────
       Mirrors the shell preview's one-row treatment: the pencil turns the doc
       editable (HTML edits happen inside the sandboxed frame over SPIKE_BRIDGE;
       markdown edits happen on the rendered prose), the formatting bar takes
       over the header, and Done commits + writes the file. */
    #home .hpv-edit{flex:0 0 auto;display:none;color:var(--ink-faint);align-items:center;justify-content:center;
      width:28px;height:28px;padding:0;border-radius:7px;background:none;border:none;cursor:pointer}
    #home .hpv-edit:hover{color:var(--ink);background:var(--surface)}
    #home .hpv-head.canedit .hpv-edit{display:flex}
    #home .hpv-head.editing .hpv-edit{display:none}
    #home .hpv-done{flex:0 0 auto;display:none;align-items:center;height:26px;padding:0 12px;border-radius:7px;
      border:1px solid var(--edge);background:var(--surface);color:var(--ink);cursor:pointer;font:600 12px -apple-system,system-ui,sans-serif}
    #home .hpv-head.editing .hpv-done{display:inline-flex}
    #home .hpv-done:hover{background:var(--edge)}
    #home .hpv-head.editing .hpv-kind,#home .hpv-head.editing .hpv-title{display:none}
    #home .hpv-toolbar{display:none;align-items:center;gap:3px;flex:1 1 auto;min-width:0;
      justify-content:safe center;overflow-x:auto;scrollbar-width:none;user-select:none}
    #home .hpv-toolbar::-webkit-scrollbar{height:0}
    #home .hpv-head.editing .hpv-toolbar{display:flex}
    #home .hpv-toolbar .tb{flex:none;width:28px;height:26px;border:none;border-radius:6px;background:transparent;
      color:var(--ink-soft);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
    #home .hpv-toolbar .tb:hover{background:var(--surface);color:var(--ink)}
    #home .hpv-toolbar .tb:active{background:var(--edge)}
    #home .hpv-toolbar .tbsep{flex:none;width:1px;height:18px;margin:0 4px;background:var(--edge)}
    #home .hpv-toolbar .tbhead{flex:none;height:26px;padding:0 6px 0 9px;border:none;border-radius:6px;display:inline-flex;
      align-items:center;gap:5px;background:transparent;color:var(--ink-soft);cursor:pointer;
      font:12px -apple-system,system-ui,sans-serif;white-space:nowrap}
    #home .hpv-toolbar .tbhead:hover,#home .hpv-toolbar .tbhead.open{background:var(--surface);color:var(--ink)}
    #home .hpv-toolbar .tbhead .lbl{min-width:52px;text-align:left}
    /* the H glyph is the compact fallback — hidden until the row is too narrow */
    #home .hpv-toolbar .tbhead .ic{display:none;align-items:center}
    /* Too narrow to fit the set: collapse the heading label to its glyph; if it
       STILL overflows, fade the trailing edge so "scroll for more" is visible.
       homeSyncToolbarOverflow sets .tight/.clipped. */
    #home .hpv-toolbar.tight .tbhead .ic{display:inline-flex}
    #home .hpv-toolbar.tight .tbhead .lbl{display:none}
    #home .hpv-toolbar.tight .tbhead{padding:0 4px}
    #home .hpv-toolbar.clipped{mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent 100%)}
    #home .hpv-body.hpv-html.editing .hpv-htmlframe{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:-3px}
    /* markdown edit: the rendered prose IS the editing surface. It must look
       byte-identical to the read view — clicking the pencil only makes the same
       prose typeable, it never re-skins the doc. So NO tint, NO reflow: the only
       edit cue is the header swapping to the toolbar + Done, plus the caret. */
    #home .hpv-body.hpv-mdedit{outline:none}
    #home .hpv-body.hpv-mdedit [contenteditable]{outline:none}
    #home .hpv-body.hpv-mdedit .md{outline:none;caret-color:var(--accent)}
    #home .hpv-body.hpv-mdedit .md:focus,#home .hpv-body.hpv-mdedit [contenteditable]:focus{outline:none;background:none}
    /* read mode: task checkboxes are live (wireHomeTaskboxes enables them) */
    #home .hpv-body input[type=checkbox]{cursor:pointer}
    #home .hpv-body.hpv-mdedit input[type=checkbox]{cursor:default}
    /* centered document column (read + edit look identical) */
    #home .hpv-doc{max-width:760px;margin:0 auto}
    /* ── selection-actions bar ────────────────────────────────────────────
       Highlight a passage in a doc → a floating pill appears beneath it: keep a
       note, or hand it to the agent (Explain/Improve/… or a typed instruction).
       A 36px pill wrapping 28px controls at a 4px inset, concentric radii. */
    #home .hsel{position:absolute;z-index:40;display:flex;align-items:center;gap:1px;height:36px;padding:4px;
      border-radius:999px;background:var(--elevated);border:1px solid var(--edge);
      box-shadow:0 10px 34px rgba(0,0,0,.20),0 2px 8px rgba(0,0,0,.10);
      transform:translateX(-50%);font:13px/1 -apple-system,system-ui,sans-serif;color:var(--ink);
      opacity:0;pointer-events:none;max-width:calc(100vw - 40px);white-space:nowrap;user-select:none}
    #home .hsel.show{opacity:1;pointer-events:auto;animation:hselpop .2s cubic-bezier(.23,1,.32,1) both}
    @keyframes hselpop{from{transform:translateX(-50%) translateY(-5px) scale(.96)}to{transform:translateX(-50%) translateY(0) scale(1)}}
    #home .hsel-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:0;border-radius:999px;
      background:transparent;color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap;
      transition:background-color .14s,transform .1s}
    #home .hsel-btn:hover{background:var(--surface)}
    #home .hsel-btn:active{transform:scale(.96)}
    #home .hsel-btn svg{color:var(--ink-soft);flex:0 0 auto}
    #home .hsel-ico{width:28px;height:28px;padding:0;justify-content:center}
    #home .hsel-sep{width:1px;height:16px;margin:0 4px;background:var(--edge);flex:0 0 auto}
    #home .hsel-input{height:28px;border:0;background:transparent;color:var(--ink);font:inherit;
      padding:0 6px 0 4px;min-width:132px;width:132px;outline:none}
    #home .hsel-input::placeholder{color:var(--ink-faint)}
    #home .hsel-presets{display:inline-flex;align-items:center;gap:1px}
    #home .hsel-more{display:none;align-items:center;gap:1px}
    #home .hsel.expanded .hsel-more{display:inline-flex}
    #home .hsel-chev svg{transition:transform .2s cubic-bezier(.23,1,.32,1)}
    #home .hsel.expanded .hsel-chev svg{transform:rotate(90deg)}
    #home .hsel-send{width:28px;height:28px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);
      display:none;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;margin-left:2px;
      transition:opacity .14s,transform .12s}
    #home .hsel-send:active{transform:scale(.94)}
    /* typing an instruction: the presets fold away, the send arrow appears */
    #home .hsel.typing .hsel-presets{display:none}
    #home .hsel.typing .hsel-send{display:inline-flex}
    /* note-mode: the bar becomes a single note field + save */
    #home .hsel.noting .hsel-presets,#home .hsel.noting .hsel-note{display:none}
    #home .hsel.noting .hsel-send{display:inline-flex}
    #home .hsel.noting .hsel-input{min-width:200px;width:200px}
    /* draft flavour: formatting on the left (the body is editable), then the
       "Ask for changes" field. Link mode reuses the same input. */
    #home .hsel.linking .hsel-presets,#home .hsel.linking .hsel-fmt{display:none}
    #home .hsel.linking .hsel-send{display:inline-flex}
    #home .hsel.linking .hsel-input{min-width:210px;width:210px}
    #home .hsel-block{padding:0 8px 0 10px;gap:3px;flex-direction:row-reverse}
    #home .hsel-blockmenu{position:absolute;top:calc(100% + 6px);left:6px;z-index:2;min-width:150px;
      padding:5px;border-radius:11px;background:var(--elevated);border:1px solid var(--edge);
      box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:1px}
    #home .hsel-blockit{appearance:none;border:0;background:none;cursor:pointer;text-align:left;
      padding:7px 9px;border-radius:7px;color:var(--ink);font:13px/1 -apple-system,system-ui,sans-serif}
    #home .hsel-blockit:hover{background:var(--surface)}
    /* saved-note highlight in the rendered prose */
    #home .hpv-body .hnote-hl{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:3px;
      text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 48%,transparent);

    #home .hpv-doc th,#home .hpv-doc td{border:1px solid var(--edge);padding:6px 11px;text-align:left}

    #home .hbrand{display:flex;align-items:center;gap:9px;padding:14px 16px 12px}

    /* the mark png is white; brightness(0) paints it solid black in light mode,
       leave it white in dark so the lockup always reads as the ink color. */
    #home .hmark img{width:23px;height:23px;display:block;filter:brightness(0)}
    @media (prefers-color-scheme:dark){#home .hmark img{filter:none}}
    :root[data-theme="light"] #home .hmark img{filter:brightness(0)}
    :root[data-theme="dark"] #home .hmark img{filter:none}
    #home .hbrand .hwm{font-family:"Newsreader","Iowan Old Style",Georgia,serif;font-size:24px;font-weight:500;letter-spacing:-.03em;flex:1}
    #home .hbrand button{color:var(--ink-faint);display:flex;padding:5px;border-radius:7px;background:none;border:none;cursor:pointer}
    #home .hbrand button:hover{color:var(--ink);background:var(--surface)}
    #home .hscroll{flex:1;overflow-y:auto;padding:6px 10px 10px}
    #home .hitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--ink-soft);
      cursor:pointer;font-size:14px;position:relative;border:1px solid transparent}
    #home .hitem:hover{background:var(--surface)}
    #home .hitem.on{background:var(--surface);color:var(--ink);font-weight:600}

    /* Home lights up while you're actually ON the launcher (blank composer), and
       goes quiet the moment you open a workstream (#home.chatting) — the active
       Workstream row carries the highlight then. Pure CSS off the .chatting flag
       so it can never desync. */
    #home:not(.chatting) #homeNavHome{background:var(--surface);color:var(--ink)}
    #home:not(.chatting) #homeNavHome .hi{color:var(--accent)}
    #home .hitem .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #home .soon{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent);
      border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:5px;padding:1px 5px}
    #home .hsec{display:flex;align-items:center;gap:7px;padding:16px 12px 6px;font-size:10.5px;letter-spacing:.05em;
      text-transform:uppercase;color:var(--ink-faint);font-weight:500}
    #home .hsec .cnt{color:var(--ink-ghost);font-weight:500}
    #home .hav{width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--edge);
      display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink-faint);flex:0 0 auto}
    #home .hmore{font-size:13px;color:var(--ink-faint);padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
    #home .hmore:hover{color:var(--ink)}
    /* Workstreams: open sessions as sidebar rows. .hsec gives the header its
       top gap (separates it from the nav); rows mirror .hitem so the list reads
       as one system with the nav above it. */
    #home .hwork[hidden]{display:none}
    /* Lighter than the nav rows: a small line-icon + label, no heavy pill. The
       icon says what kind of work it is — chat bubble for a conversation,
       checklist once it becomes a plan. The active row gets a faint accent tint
       (not a gray slab) + accent icon, so "which one am I in" reads at a glance
       without shouting. */
    #home .wrow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--ink-soft);
      cursor:pointer;font-size:14px;border:1px solid transparent}
    #home .wrow:hover{background:var(--surface)}
    /* The active-row highlight shows only while you're IN a workstream
       (#home.chatting), and matches Home's own highlight exactly — neutral
       --surface fill + accent icon. On the blank launcher, Home carries the
       highlight and the rows sit quiet — the two are never lit at once. */
    #home.chatting .wrow.on{color:var(--ink);background:var(--surface)}
    #home .wrow .wico{position:relative;display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;width:16px;height:16px;color:var(--ink-faint)}
    /* A workstream's glyph wears your accent even at rest — it's a live thing,
       not a file, and the colour is what makes the sidebar feel inhabited. The
       states differentiate by what's IN the bubble (.ready fills it, .needs
       swaps it for a light), never by draining its colour. Scoped to #homeWork
       so the Pinned list's file icons stay quiet. */
    #homeWork .wrow .wico{color:var(--accent)}
    #home.chatting .wrow.on .wico{color:var(--accent)}
    /* Long titles fade into the edge rather than clipping to a hard "…" — a
       softer truncation that reads as "there's more" without the noise. The
       mask only bites text that actually reaches the right edge; short labels
       end before the gradient and stay crisp. */
    #home .wrow .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;
      -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);
      mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
    /* Hover-reveal ⋮ kebab → the row's action menu (Rename / Close). Sits after
       the flex-1 label so it rides the row's right edge; fades in on row hover. */
    #home .wrow .wmore{flex:0 0 auto;width:20px;height:20px;border-radius:5px;opacity:0;padding:0;
      display:inline-flex;align-items:center;justify-content:center;color:var(--ink-faint);
      background:none;border:none;cursor:pointer;transition:opacity .15s ease}
    #home .wrow:hover .wmore{opacity:.5}
    #home .wrow .wmore:hover{opacity:1;background:var(--edge);color:var(--ink)}
    /* inline rename field, echoing the roster's .nmedit — an accent underline
       that flexes to the row width. Replaces .lb while editing. */
    #home .wrow .wnmedit{flex:1;min-width:0;width:100%;padding:0;margin:0;background:transparent;
      border:none;border-bottom:1px solid var(--accent);color:var(--ink);font:inherit;outline:none}
    /* ── The four things a row has to say, all in ONE slot: the glyph ──────
       Nothing else in the row moves, so ten open workstreams never turn the
       sidebar into a light show — and exactly one thing in the whole list ever
       pulses, which is why a pulse can mean only "answer me".
         working      · a thin arc turning slowly (rotation, never a blink)
         done, unread · the message drawn INSIDE the bubble
         done, read   · the empty accent bubble — the resting state
         needs you    · the message goes away, a light breathes in its place
       The two "done" states differ by whether you have LOOKED; the read one is
       just the row at rest. Mocked in docs/mocks/workstream-states.html. */

    /* DONE, UNREAD. Empty bubble = read, written bubble = unread — the
       difference MEANS something rather than just being brighter. The overlay
       carries the two inner strokes (see renderWorkstreams); the checklist
       glyph has no inside to write in, so it takes an accent wash instead.
       Dead still: an unread message doesn't wave at you. Cleared by opening
       the row (clearAttention), which is exactly what "read" means. */
    #home .wrow .wico svg{display:block}
    #home .wrow .wico .in{display:none;position:absolute;inset:0}
    #home .wrow.ready{color:var(--ink)}
    #home .wrow.ready .lb{font-weight:550}
    #home .wrow.ready .wico .in{display:block}
    #home .wrow.ready .wico.plan svg{fill:color-mix(in srgb,var(--accent) 32%,transparent)}
    /* WORKING — a turn is in flight (chatTurnLive, broker-backed). Dimmed
       accent, because work in progress is normal and not something you act on.
       Rotation only: it can never be confused with the needs-you pulse. */
    #home .wrow.working .wico svg{display:none}
    #home .wrow.working .wico::after{content:'';flex:0 0 auto;width:11px;height:11px;border-radius:50%;
      border:1.4px solid color-mix(in srgb,var(--accent) 22%,transparent);
      border-top-color:color-mix(in srgb,var(--accent) 75%,transparent);animation:wspin 2.4s linear infinite}
    @keyframes wspin{to{transform:rotate(360deg)}}
    /* NEEDS YOU — the agent is stopped until you answer (chatAwait/chatNotice).
       The message disappears and a light breathes in its place: the row stops
       looking like a conversation and starts looking like a doorbell. Unlike
       the unread cue this is LIVE state — it clears when you ANSWER, not when
       you glance. */
    #home .wrow.needs{color:var(--ink)}
    #home .wrow.needs .lb{font-weight:550}
    #home .wrow.needs .wico svg{display:none}
    #home .wrow.needs .wico::after{content:'';flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--accent);
      animation:wbeacon 2s ease-in-out infinite}
    @keyframes wbeacon{
      0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
      50%{opacity:.72;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 0%,transparent)}}
    /* Motion is the cue, not the meaning: with it off, the arc and the light
       still sit in the glyph's place and still read as their own states. */
    @media (prefers-reduced-motion:reduce){
      #home .wrow.needs .wico::after,#home .wrow.working .wico::after{animation:none}}
    #home .hfoot{position:relative;display:flex;align-items:center;gap:6px;padding:9px 12px 10px;border-top:1px solid var(--edge-soft)}
    #home .hacct{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;
      background:none;border:1px solid transparent;cursor:pointer;text-align:left}

    /* ── main ── */
    #home .hmain{position:relative;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px}
    #home .hmain > h1, #home .hmain > .hcomp, #home .hmain > .hgs{width:100%;max-width:680px}
    /* No morph on the greeting/options: the launcher just IS on screen. They used
       to transition (opacity/max-height/transform) which, on return from a chat,
       read as the heading + cards growing out of the composer — unwanted. The
       .chatting rules below still collapse them, now instantly. */
    /* ── conversation mode: landing content collapses, the thread takes over,
       the composer drops to the bottom — all inside the same Home surface, so
       the old chat/terminal chrome never appears. ── */
    #home.chatting .hmain{justify-content:flex-start;overflow:hidden;padding:20px 22px 16px}
    #home.chatting .hmain > h1{opacity:0;max-height:0;margin:0;transform:translateY(-8px);overflow:hidden;pointer-events:none}
    #home.chatting .hmain > .hgs{opacity:0;max-height:0;margin:0;overflow:hidden;pointer-events:none}

       + · input · mic — because the model is already chosen and the two-row
       "landing" affordance is no longer needed. .hcrow becomes display:contents
       so its + and send button join the composer's own flex row around the
       input; the model picker and spacer drop out. */
    #home.chatting .hcomp{order:1;margin-top:auto;padding:7px 9px 7px 15px;border-radius:24px;max-width:720px;
      display:flex;align-items:center;gap:8px}

    #home.chatting .hwave{order:2;flex:1;width:auto}
    #home.chatting .hcrow{display:contents;margin-top:0}
    #home.chatting .hcadd{order:1}
    #home.chatting .hcsp{display:none}
    #home.chatting .hcmodel{display:none}
    #home.chatting .hcsend{order:3}
    #home #homeThread{display:none}
    /* Full-bleed scroller: a negative right margin pulls the scroller out past
       .hmain's 22px inset to the pane's TRUE right edge, so the scrollbar pins to
       the divider (like the preview's) instead of floating 22px inside. The
       matching padding-right keeps the reading column exactly where it was. */
    #home.chatting #homeThread{display:flex;flex-direction:column;gap:15px;width:100%;flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 22px 20px 4px;margin-right:-22px;order:-1;animation:htfade .34s ease both}
    #home.chatting #homeThread > .ht-row{width:100%;max-width:720px;margin:0 auto;padding:0 4px}
    /* Thin + faint scrollbar to match the preview's subtle native overlay — a
       barely-there rail at rest, a touch darker on hover; never the heavy
       app-default bar (that read too dark next to the preview). */
    #home.chatting #homeThread{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 11%,transparent) transparent}
    #home.chatting #homeThread::-webkit-scrollbar{width:8px}
    /* Flush to the right edge like the preview bar: the thumb keeps a little left
       breathing room (border on the left only) but sits hard against the right. */
    #home.chatting #homeThread::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 12%,transparent);border-radius:8px;border:2px solid transparent;border-right-width:0;background-clip:padding-box}
    #home.chatting #homeThread::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--ink) 22%,transparent);background-clip:padding-box}
    @keyframes htfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
