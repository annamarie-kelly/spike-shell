    #home .ht-agent .ht-bubble strong{font-weight:650}
    #home .ht-agent .ht-bubble code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;background:var(--surface);border:1px solid var(--edge-soft);border-radius:5px;padding:1px 5px}
    #home .ht-agent .ht-bubble pre{background:var(--surface);border:1px solid var(--edge-soft);border-radius:11px;padding:12px 14px;overflow-x:auto;margin:0 0 10px}
    #home .ht-agent .ht-bubble pre code{background:none;border:0;padding:0;font-size:12.5px}
    /* Tables: calm horizontal rules (no heavy grid) — a firm header underline,
       faint row separators, and real column spacing so figures don't collide the
       way "2100 2100" did with no styling at all. */
    #home .ht-agent .ht-bubble table{border-collapse:collapse;font-size:13.5px;margin:4px 0 12px}
    #home .ht-agent .ht-bubble th,#home .ht-agent .ht-bubble td{padding:6px 20px 6px 0;text-align:left;
      vertical-align:top;border-bottom:1px solid var(--edge-soft);color:var(--ink-soft);white-space:nowrap}
    #home .ht-agent .ht-bubble thead th{color:var(--ink);font-weight:600;border-bottom:1px solid var(--edge)}
    #home .ht-agent .ht-bubble tbody tr:last-child td{border-bottom:0}
    /* Rich fenced code block (ported from the chat surface): a rounded container
       with a header — language label left, Copy right (the global .cw-code-copy
       handler wires it) — over hljs-highlighted code. */
    #home .ht-agent .ht-bubble .cw-code{margin:2px 0 12px;border:1px solid var(--edge-soft);
      border-radius:11px;background:var(--surface);overflow:hidden;width:100%;max-width:100%}
    #home .ht-agent .ht-bubble .cw-code-head{display:flex;align-items:center;justify-content:space-between;
      gap:8px;padding:5px 7px 5px 13px;border-bottom:1px solid var(--edge-soft);
      background:color-mix(in srgb,var(--ink) 3%,transparent)}
    #home .ht-agent .ht-bubble .cw-code-lang{font:11px/1 ui-monospace,"SF Mono",Menlo,monospace;
      color:var(--ink-faint);letter-spacing:.02em;text-transform:lowercase;white-space:nowrap}
    #home .ht-agent .ht-bubble .cw-code-copy{appearance:none;cursor:pointer;flex:none;display:inline-flex;
      align-items:center;gap:4px;padding:3px 9px;background:transparent;border:1px solid transparent;
      border-radius:7px;color:var(--ink-faint);font:11px/1 -apple-system,system-ui,sans-serif;
      transition:color .12s ease,background .12s ease,border-color .12s ease}
    #home .ht-agent .ht-bubble .cw-code-copy:hover{color:var(--ink);background:var(--elevated);border-color:var(--edge-soft)}
    #home .ht-agent .ht-bubble .cw-code-copy.done{color:var(--accent)}
    /* the <pre> inside the wrapper drops its own chrome — the wrapper provides it */
    #home .ht-agent .ht-bubble .cw-code pre{margin:0;border:0;border-radius:0;background:none;padding:11px 13px}
    #home .ht-agent .ht-bubble a{color:var(--accent);text-underline-offset:2px}
    #home .ht-li{margin:0 0 4px}
    /* ── draft card ────────────────────────────────────────────────────────
       Something the agent WROTE for you (an email, a message, a post) rendered
       as an object you can work on, not prose pasted into the chat: its own
       surface, an Edit pencil that makes the body contenteditable in place,
       copy, and a send-back that makes your version the current one. */
    #home .ht-part + .ht-draft,#home .ht-draft + .ht-part{margin-top:12px}
    #home .ht-draft{border:1px solid var(--edge-soft);border-radius:14px;background:var(--surface);
      overflow:hidden;margin:2px 0}
    #home .ht-draft:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge-soft))}
    #home .ht-draft-head{display:flex;align-items:center;gap:6px;padding:7px 9px;position:relative;
      border-bottom:1px solid var(--edge-soft)}
    #home .ht-draft-sp{flex:1}
    /* "Ask for changes" — instruct the AGENT. (Typing your own edits needs no
       button: the body below is always editable.) */
    #home .ht-draft-ask{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
      padding:4px 11px 4px 9px;border-radius:999px;border:1px solid var(--edge-soft);background:var(--bg);
      color:var(--ink-soft);font:12px/1 -apple-system,system-ui,sans-serif;
      transition:color .12s ease,background .12s ease,border-color .12s ease}
    #home .ht-draft-ask:hover{color:var(--ink);background:var(--elevated)}
    #home .ht-draft-askwrap{display:none;align-items:center;gap:4px;flex:1;min-width:0;
      padding:2px 3px 2px 11px;border-radius:999px;border:1px solid var(--edge-soft);background:var(--bg)}
    #home .ht-draft.asking .ht-draft-ask{display:none}
    #home .ht-draft.asking .ht-draft-askwrap{display:flex}
    #home .ht-draft.asking .ht-draft-sp{display:none}
    #home .ht-draft-askin{flex:1;min-width:0;height:24px;border:0;outline:none;background:transparent;
      color:var(--ink);font:12.5px/1 -apple-system,system-ui,sans-serif}
    #home .ht-draft-askin::placeholder{color:var(--ink-faint)}
    #home .ht-draft-askgo{appearance:none;cursor:pointer;flex:0 0 auto;width:24px;height:24px;padding:0;border:0;
      border-radius:999px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
    #home .ht-draft-askgo svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;
      stroke-linecap:round;stroke-linejoin:round;display:block}
    #home .ht-draft-ic{appearance:none;cursor:pointer;display:grid;place-items:center;width:26px;height:26px;
      padding:0;border:0;border-radius:8px;background:transparent;color:var(--ink-faint);
      transition:color .12s ease,background .12s ease}
    #home .ht-draft-ic:hover{color:var(--ink);background:var(--elevated)}
    #home .ht-draft-ic.done{color:var(--accent)}
    #home .ht-draft-ask svg,#home .ht-draft-ic svg{width:14px;height:14px;fill:none;stroke:currentColor;
      stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
    /* Always editable — click in and type. The caret is the only cue it needs. */
    #home .ht-draft-body{padding:11px 14px 13px;outline:none;caret-color:var(--accent);cursor:text}
    #home .ht-draft-body>*:first-child{margin-top:0}
    #home .ht-draft-body>*:last-child{margin-bottom:0}
    #home .ht-draft-body a{color:var(--accent)}
    #home .ht-draft-body blockquote{margin:8px 0;padding-left:12px;border-left:2px solid var(--edge)}
    /* A just-sent / queued message. NOT greyed-to-dead (that read as "unsent,
       unread" while the agent was actually working on it) — it's a full, real
       bubble with a small "Sent" caption under it, cleared once the transcript
       absorbs the message and the real turn renders in its place. */
    /* A queued / just-sent message reads as a NORMAL sent bubble — no "Sent"
       stamp (they piled into noise when several were queued), just a hair of
       transparency to hint it's still in flight. It's replaced seamlessly by the
       real transcript turn once absorbed. */
    #home .ht-pending .ht-bubble{opacity:.66}
    /* Sent image thumbnails inside a you-bubble (iMessage-style): a wrapped row
       above the text, so images PERSIST in the conversation. */
    #home .ht-bubble-atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    #home .ht-bubble-imgonly .ht-bubble-atts{margin-bottom:0}
    #home .ht-bubble-img{max-width:200px;max-height:200px;width:auto;height:auto;border-radius:11px;
      border:1px solid var(--edge-soft);object-fit:cover;display:block}
    /* Activity trail: the agent's tool actions between words, a quiet muted log
       mirroring the terminal's Read/Ran/Explore lines. */
    /* Tool calls as compact chip-rows: icon + bold label + a rounded detail chip. */
    #home .ht-acts{flex-direction:column;align-items:flex-start;gap:3px;margin:-1px 0 3px}
    #home .ht-act{display:flex;align-items:center;gap:8px;max-width:100%;min-width:0;height:26px}
    #home .ht-act-ic{display:inline-flex;flex:0 0 auto;color:var(--ink-faint)}
    #home .ht-act-ic svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
    #home .ht-act-lb{flex:0 0 auto;font-size:12.5px;font-weight:550;color:var(--ink);white-space:nowrap}
    #home .ht-act-chip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-size:11.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--edge-soft);
      border-radius:7px;padding:3px 8px;line-height:1.3}
    #home .ht-act-chip.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px}
    #home .ht-act-chip.open{cursor:pointer;transition:background .12s ease,color .12s ease}
    #home .ht-act-chip.open:hover{background:var(--elevated);color:var(--ink)}
    #home .ht-act-n{flex:0 0 auto;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-left:-2px}
    /* Collapsible tool-run (doc #3): a header over the call rows that tucks away
       when the turn is done and reopens on click; the diff-summary chips sit
       outside the collapse so "what changed" stays visible at rest. */
    /* Interstitial rows (run header + its diff chips) sit tight against the reply
       they belong to — the thread's 15px gap is too airy for these compact,
       secondary elements, so pull them in and let them recede. */
    #home .ht-run{flex-direction:column;align-items:flex-start;gap:0;margin:-8px 0 -4px}
    #home .ht-run-head{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      background:transparent;border:0;padding:2px 6px 2px 4px;border-radius:7px;color:var(--ink-faint);
      font-size:12px;transition:background .12s ease,color .12s ease}
    #home .ht-run-head:hover{color:var(--ink-soft)}
    #home .ht-run-head:hover{background:var(--elevated)}
    #home .ht-run-chev svg{width:12px;height:12px;fill:none;stroke:var(--ink-faint);stroke-width:2.2;
      stroke-linecap:round;stroke-linejoin:round;transform:rotate(-90deg);transition:transform .2s ease}
    #home .ht-run.open .ht-run-chev svg{transform:rotate(0deg)}
    #home .ht-run-label{font-variant-numeric:tabular-nums}
    #home .ht-run-body{display:grid;grid-template-rows:0fr;opacity:0;width:100%;
      transition:grid-template-rows .28s cubic-bezier(.23,1,.32,1),opacity .2s ease}
    #home .ht-run.open .ht-run-body{grid-template-rows:1fr;opacity:1}
    #home .ht-run-inner{overflow:hidden;min-height:0;display:flex;flex-direction:column;
      align-items:flex-start;gap:3px;padding:3px 0 2px 7px}
    #home .ht-act-wrap{width:100%;display:flex;flex-direction:column}
    #home .ht-act-wrap.has-detail .ht-act{cursor:pointer}
    #home .ht-act-caret{margin-left:1px;display:inline-flex;opacity:0;transition:opacity .12s ease}
    #home .ht-act-wrap.has-detail:hover .ht-act-caret,#home .ht-act-wrap.detail-open .ht-act-caret{opacity:1}
    #home .ht-act-caret svg{width:11px;height:11px;fill:none;stroke:var(--ink-faint);stroke-width:2.2;
      stroke-linecap:round;stroke-linejoin:round;transform:rotate(-90deg);transition:transform .18s ease}
    #home .ht-act-wrap.detail-open .ht-act-caret svg{transform:rotate(0deg)}
    #home .ht-act-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s cubic-bezier(.23,1,.32,1)}
    #home .ht-act-wrap.detail-open .ht-act-detail{grid-template-rows:1fr}
    #home .ht-act-detail-inner{overflow:hidden;min-height:0;margin:2px 0 4px 22px;
      border-left:1px solid var(--edge-soft);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:1px;
      font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;line-height:1.6}
    #home .ht-dl{white-space:pre-wrap;overflow-wrap:anywhere}
    #home .ht-dl.del{color:var(--red,#c0453a)}
    #home .ht-dl.add{color:var(--green,#3f9142)}
    #home .ht-dl.more{color:var(--ink-faint)}
    #home .ht-act-diff{flex:0 0 auto;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;font-variant-numeric:tabular-nums}
    #home .ht-act-diff .add{color:var(--green,#3f9142)}
    #home .ht-act-diff .del{color:var(--red,#c0453a)}
    /* End-of-run file-diff chips (doc #3): one clickable chip per edited file,
       filename + green adds + red dels. Opens the file on click. */
    #home .ht-diffs{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 -3px}
    #home .ht-diff-chip{display:inline-flex;align-items:center;gap:7px;height:27px;padding:0 10px;
      border:1px solid var(--edge-soft);border-radius:8px;background:var(--surface);cursor:pointer;
      font-size:11.5px;transition:background .12s ease,border-color .12s ease}
    #home .ht-diff-chip:hover{background:var(--elevated);border-color:var(--edge)}
    #home .ht-diff-name{color:var(--ink-soft);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #home .ht-diff-name.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
    #home .ht-diff-add{color:var(--green,#3f9142);font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
    #home .ht-diff-del{color:var(--red,#c0453a);font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
    #home .ht-act-more{color:var(--ink-ghost);padding-left:22px;font-size:12px}
    /* ── Steps: the plan as watchable rows ─────────────────────────────────
       A quiet card of steps, each a status badge + label that opens to the work
       it took. Structure comes from the badge gutter and a hover wash, so a
       stack of steps reads as one list, not a wall of cards. */
    #home .ht-steps{flex-direction:column;align-items:stretch;gap:0;align-self:stretch;
      max-width:640px;margin:4px 0;border:1px solid var(--edge);border-radius:14px;
      background:var(--surface-soft,var(--surface));padding:8px 10px 6px}
    #home .ht-steps-head{display:flex;align-items:baseline;gap:8px;padding:2px 4px 6px}
    #home .ht-steps-title{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
    #home .ht-steps-tally{font-size:12px;color:var(--ink-faint)}
    #home .ht-step{border-radius:10px}
    #home .ht-step-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
      background:none;border:0;border-radius:9px;padding:6px 6px;cursor:pointer;font:inherit;color:var(--ink);
      transition:background .12s ease}
    #home .ht-step-head:not(:disabled):hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
    #home .ht-step-head:disabled{cursor:default}
    #home .ht-step-badge{position:relative;flex:0 0 auto;width:18px;height:18px;border-radius:50%;
      display:inline-flex;align-items:center;justify-content:center;
      box-shadow:inset 0 0 0 1.5px var(--ink-faint);color:#fff}
    /* to-do: a hollow ring (the inset box-shadow above, no fill) */
    #home .ht-step[data-status="completed"] .ht-step-badge{background:var(--green,#3f9142);box-shadow:none}
    #home .ht-step[data-status="in_progress"] .ht-step-badge{box-shadow:none}
    #home .ht-step-spin{width:14px;height:14px;border-radius:50%;
      border:2px solid color-mix(in srgb,var(--accent,#6a7) 30%,transparent);
      border-top-color:var(--accent,#6a7);animation:ht-step-sp .7s linear infinite}
    @keyframes ht-step-sp{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){#home .ht-step-spin{animation:none}}
    #home .ht-step-label{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.35;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #home .ht-step[data-status="completed"] .ht-step-label{color:var(--ink-soft)}
    #home .ht-step[data-status="in_progress"] .ht-step-label{font-weight:600}
    #home .ht-step-count{flex:0 0 auto;font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
    #home .ht-step-chev{flex:0 0 auto;display:inline-flex;color:var(--ink-ghost);transition:transform .2s ease}
    #home .ht-step.open .ht-step-chev{transform:rotate(180deg)}
    /* detail: the tool calls under a step, behind a grid-rows fold */
    #home .ht-step-detail{display:none;flex-direction:column;gap:2px;
      padding:2px 6px 8px 33px;position:relative}
    #home .ht-step.open .ht-step-detail{display:flex}
    #home .ht-step-detail::before{content:"";position:absolute;left:14px;top:0;bottom:8px;width:1px;background:var(--edge)}
    #home .ht-step-act{display:flex;align-items:center;gap:8px;min-width:0;height:24px}
    /* older flat-line class, kept harmless */
    #home .ht-act-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    /* The blocker card: an inline permission / question pinned at the foot of the
       thread. Warm edge so it reads as "your move", answerable in place. */
    /* The blocker card — calm, not a salmon block. A thin warm accent bar on the
       left carries the "your move" cue; the buttons are quiet pills, the Allow
       primary a soft accent tint rather than a shouting fill. */
    /* Approval / question card — a clean elevated card (no shouty accent bar): a
       small tinted glyph in the header, the ask stated plainly, and a row of
       quiet pill buttons with ONE solid ink "Allow" as the clear primary. */
    /* Room to breathe — matched to the app's generous, calm aesthetic (the
       get-started cards, the roomy composer): more padding, bigger touch
       targets, and space between the question and its options. */
    #home .ht-ask{flex-direction:column;align-items:stretch;gap:13px;
      background:var(--elevated);border:1px solid var(--edge);
      border-radius:18px;max-width:600px;
      box-shadow:0 3px 12px -7px rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.05);
      animation:htaskin .3s cubic-bezier(.22,1,.36,1) both}
    /* The card arrives — it used to blink into existence mid-thread with no cue
       that the turn had just stopped on you. A short rise + fade, no bounce. */
    @keyframes htaskin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){#home .ht-ask{animation:none}}
    /* The card is a .ht-row, and `#home.chatting #homeThread > .ht-row{padding:0 4px}`
       is MORE specific — it was overriding the card's padding to 4px, which is why
       the text hugged the left border no matter what .ht-ask set. Match that
       specificity so the real inner padding wins. */
    #home.chatting #homeThread > .ht-row.ht-ask{padding:22px 26px}
    /* Same override bit the steps panel (also a bordered card on a .ht-row) — its
       content hugged the 4px edge. Restore real padding at matching specificity. */
    #home.chatting #homeThread > .ht-row.ht-steps{padding:11px 14px 9px}
    /* The header reads as a labelled badge, not a floating icon + words: the glyph
       sits in a soft accent chip so "Needs your OK" has the same weight as the
       eyebrow on an ask card. */
    #home .ht-ask-head{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;
      letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:-1px}
    #home .ht-ask-head svg{width:14px;height:14px;flex:0 0 auto;
      stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
    #home .ht-ask-head > svg{padding:5px;box-sizing:content-box;width:14px;height:14px;border-radius:9px;
      color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
    /* Permission body: what it wants to do, then the thing it wants to touch —
       the path/command in a monospace chip so it never reads as prose. */
    #home .ht-perm-what{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.45}
    #home .ht-perm-target{margin-top:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:12.5px;line-height:1.5;color:var(--ink-soft);background:var(--surface);
      border:1px solid var(--edge-soft);border-radius:9px;padding:7px 10px;
      overflow-wrap:anywhere;white-space:pre-wrap}
    #home .ht-ask-body{font-size:15.5px;color:var(--ink);overflow-wrap:anywhere;line-height:1.55}
    /* Multi-question body: each question stacked with its options, so the whole set is visible. */
    #home .ht-ask-q{display:flex;flex-direction:column;gap:1px}
    #home .ht-ask-q + .ht-ask-q{margin-top:10px}
    #home .ht-ask-qh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:9px}
    #home .ht-ask-qt{font-size:16px;font-weight:600;color:var(--ink);line-height:1.5}
    #home .ht-ask-qopts{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
    /* Paged ask card (doc #2): one question at a time — radio/check options, a
       pill-dot pager, and a circular send that lights up when the set is answered. */
    /* Options carry a description now, so they read as cards — matched to the
       homescreen get-started cards (gap 12-14, generous padding, 14.5/550 title,
       13px muted subline, hover = surface + soft edge). Room to breathe. */
    /* "Pick one" / "Pick any that apply" — the rule, stated before the options. */
    #home .ht-pask-hint{margin-top:7px;font-size:12px;letter-spacing:.02em;color:var(--ink-faint)}
    /* Pulled out by the plate's own padding so the markers line up with the
       question text rather than sitting indented under it. */
    #home .ht-pask-opts{display:flex;flex-direction:column;gap:4px;margin:10px -13px 0}
    /* An option is a real target now. It was a bare text row on a transparent
       background with a 19px ring — nothing said "click me", so a card of
       choices read as a printed list. Each row gets its own hoverable plate, and
       the chosen one is tinted + ringed in accent so the answer is unmistakable
       at a glance (the ring alone was easy to miss at the edge of the card). */
    #home .ht-pask-opt,#home .ht-pask-other{appearance:none;cursor:pointer;display:flex;align-items:flex-start;gap:12px;width:100%;
      text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;
      padding:11px 13px;margin:0;
      transition:background .14s ease,border-color .14s ease,transform .08s ease}
    #home .ht-pask-opt:hover,#home .ht-pask-other:hover{background:var(--surface);border-color:var(--edge-soft)}
    #home .ht-pask-opt:active,#home .ht-pask-other:active{transform:translateY(.5px)}
    #home .ht-pask-opt:hover .ht-pask-mk{box-shadow:inset 0 0 0 1.5px var(--ink-faint)}
    #home .ht-pask-opt:focus,#home .ht-pask-other:focus{outline:none}

    #home .ht-pask-other .ht-pask-lb{color:var(--ink-soft)}

    @keyframes hcRecPulse{0%,100%{box-shadow:0 1px 2px rgba(30,25,20,.22),0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}
      50%{box-shadow:0 1px 2px rgba(30,25,20,.22),0 0 0 5px color-mix(in srgb,var(--accent) 0%,transparent)}}
    #home .hcrow{display:flex;align-items:center;gap:10px;margin-top:12px}
    #home .hcadd{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;padding:6px;border-radius:8px;outline:none}
    #home .hcadd:hover,#home .hcadd:focus-visible{color:var(--ink);background:var(--surface)}
    /* Attach menu — mirrors .hmodelmenu: opens BELOW the row (like the model
       picker) on the launcher, and flips above in chat mode where the composer
       is pinned to the bottom of the screen. */
    #home .haddmenu{position:absolute;top:calc(100% + 10px);left:0;background:var(--elevated);border:1px solid var(--edge);border-radius:12px;box-shadow:0 12px 34px rgba(30,25,20,.2);padding:5px;min-width:210px;z-index:40}
    #home.chatting .haddmenu{top:auto;bottom:calc(100% + 10px)}
    /* Pinned root-folder chip, inline on the composer row beside the paperclip.
       Tinted with the accent edge so it reads as "the agent starts here", not a
       staged file. Hidden while empty and once the conversation is live (the cwd
       is fixed by then). */
    #home .hcfolder{display:none;align-items:center;gap:6px;max-width:230px;padding:4px 5px 4px 9px;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--edge));border-radius:9px;font-size:12.5px;color:var(--ink)}
    #home .hcfolder.on{display:inline-flex}
    #home.chatting .hcfolder{display:none}
    #home .hcfolder > svg{flex:0 0 auto;color:var(--ink-faint)}
    #home .hcfolder .hcf-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
    #home .hcfolder .hcf-x{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:18px;height:18px;padding:0;border:none;background:none;color:var(--ink-faint);cursor:pointer;border-radius:5px}
    #home .hcfolder .hcf-x:hover{color:var(--ink);background:var(--edge-soft)}
    #home .haddmenu-it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:13.5px;color:var(--ink);padding:9px 11px;border-radius:8px;border:none;background:none;cursor:pointer}
    #home .haddmenu-it:hover{background:var(--surface)}
    #home .haddmenu-it .hadd-ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:18px;height:18px;color:var(--ink-soft)}
    /* Staged-attachment tray — chips above the input, hidden until something's in it. */
    #home .hatt{display:none;flex-wrap:wrap;gap:7px;margin-bottom:2px}
    #home .hatt.on{display:flex}
    #home .hatt-chip{display:inline-flex;align-items:center;gap:6px;max-width:220px;padding:4px 5px 4px 4px;background:var(--surface);border:1px solid var(--edge);border-radius:9px;font-size:12.5px;color:var(--ink-soft)}
    #home .hatt-chip img{width:26px;height:26px;border-radius:5px;object-fit:cover;flex:0 0 auto;display:block}
    #home .hatt-chip.hatt-file{padding-left:9px}
    #home .hatt-chip.hatt-file svg{flex:0 0 auto;color:var(--ink-faint)}
    #home .hatt-root{border-color:color-mix(in srgb,var(--accent) 45%,var(--edge));color:var(--ink)}
    #home .hatt-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
    #home .hatt-x{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:18px;height:18px;padding:0;border:none;background:none;color:var(--ink-faint);cursor:pointer;border-radius:5px}
    #home .hatt-x:hover{color:var(--ink);background:var(--edge-soft)}
    #home .hcsp{flex:1}
    #home .hcmodel{display:flex;align-items:center;gap:6px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;padding:5px 8px;border-radius:8px}
    #home .hcmodel:hover{color:var(--ink);background:var(--surface)}
    #home .hcmodel{position:relative}
    #home .hmodelmenu{position:absolute;top:calc(100% + 10px);right:0;background:var(--elevated);border:1px solid var(--edge);border-radius:12px;box-shadow:0 12px 34px rgba(30,25,20,.2);padding:5px;min-width:210px;z-index:40}
    /* In chat mode the composer sits at the bottom of the window, so a downward
       menu spills off-screen — open it UPWARD there. On the launcher (composer
       mid-page) it stays downward. */
    #home.chatting .hmodelmenu{top:auto;bottom:calc(100% + 10px)}
    #home .hmodelmenu-it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:13.5px;color:var(--ink);padding:9px 11px;border-radius:8px;border:none;background:none;cursor:pointer}
    #home .hmodelmenu-it:hover{background:var(--surface)}
    #home .hmodelmenu-it .mm-ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:18px;height:18px}
    #home .hmodelmenu-it .mm-ic img{width:16px;height:16px;display:block;border-radius:3px}
    /* The Codex mark is solid black-on-transparent. It used to sit on a
       background:var(--ink) chip, which in LIGHT mode painted a dark square
       under a black glyph — a muddy blob next to the clean Claude marks. Treat
       it the way the rest of the app does (.cicon-codex): no chip, and flip the
       glyph to white only when the theme is actually dark. */
    #home .hmodelmenu-it .mm-codex img{filter:brightness(0) invert(1)}
    :root[data-theme="light"] #home .hmodelmenu-it .mm-codex img{filter:none}
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) #home .hmodelmenu-it .mm-codex img{filter:none}
    }
    /* Full accent circle; the glyph matches the page bg (--bg), so it reads like
       a cut-out: dark in dark mode, light in light mode. The Valence accents are
       light-toned, so the dark-mode dark glyph has strong contrast. */
    #home .hcsend{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;flex:0 0 auto;
      background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;
      box-shadow:0 1px 2px rgba(30,25,20,.18);transition:background .15s,transform .1s}
    #home .hcsend:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
    #home .hcsend:active{transform:scale(.94)}
    /* Mic when empty, send arrow once you type — icon swaps. */
    #home .hcsend .hcs-arrow{display:none}
    #home .hcomp.has-text .hcsend .hcs-mic{display:none}
    #home .hcomp.has-text .hcsend .hcs-arrow{display:block}
    /* Working → the send button is a STOP (interrupt). Wins over mic/arrow. */
    #home .hcomp.busy .hcsend .hcs-mic,#home .hcomp.busy .hcsend .hcs-arrow{display:none}
    #home .hcomp.busy .hcsend .hcs-stop{display:block}
    /* Stop stays in the accent — it's a neutral interrupt (Esc), not a
       destructive control, and a black puck read as an alarm it doesn't carry. */
    #home .hcomp.busy .hcsend{background:var(--accent)}
    #home .hcomp.busy .hcsend:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
    #home .hgs{margin-top:38px;display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}

    #home .hcard{display:flex;align-items:flex-start;gap:14px;padding:14px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}

    /* coming-soon toast */
    #home #homeSoon{position:absolute;bottom:26px;left:50%;transform:translateX(-50%) translateY(8px);
      background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;
      box-shadow:0 8px 24px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:5}

      transition:border-color .15s,box-shadow .15s,transform .15s}

    #playbooks .pbv-cico{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--edge);

    .wsv-card-nm{font-size:15px;font-weight:600;color:var(--ink);line-height:1.15}
    .wsv-card-cwd{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wsv-card-brief{font-size:12.5px;color:var(--ink-faint);line-height:1.45;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
    .wsv-empty{color:var(--ink-faint);font-size:13.5px;padding:30px 0;text-align:center}
    /* ── DETAIL ── */
    .wsv-head{display:flex;align-items:center;gap:13px;margin-bottom:4px}
    .wsv-dbadge{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
      color:#fff;font-weight:650;font-size:16px}
    .wsv-dtitle{font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0;line-height:1.1}
    .wsv-dcwd{font-size:12px;color:var(--ink-faint);margin-top:2px}
    .wsv-sec{margin-top:24px}
    .wsv-sec-h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
    .wsv-sec-h h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);
      font-weight:700;margin:0}
    .wsv-sec-h .hint{font-size:12px;color:var(--ink-faint);opacity:.75}
    .wsv-sec-h .act{margin-left:auto;font-size:12px;color:var(--ink-faint);cursor:pointer}
    .wsv-sec-h .act:hover{color:var(--accent)}
    /* brief */
    .wsv-brief{background:var(--surface);border:1px solid var(--edge);border-radius:11px;padding:13px 15px}
    .wsv-brief-text{font-size:13.5px;color:var(--ink);line-height:1.5;white-space:pre-wrap}
    .wsv-brief-text.empty{color:var(--ink-faint);font-style:italic}
    .wsv-brief textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13.5px;line-height:1.5;
      color:var(--ink);background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:10px;
      resize:vertical;min-height:80px;outline:none}
    .wsv-brief-row{display:flex;gap:8px;margin-top:9px}
    .wsv-btn{font:inherit;font-size:12.5px;font-weight:600;border-radius:8px;padding:6px 13px;cursor:pointer;border:1px solid var(--edge);background:var(--surface);color:var(--ink)}
    .wsv-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
    .wsv-btn:hover{filter:brightness(.97)}
    /* recently feed */
    .wsv-feed{display:flex;flex-direction:column}
    .wsv-fi{display:flex;align-items:center;gap:11px;padding:8px 2px;color:var(--ink);cursor:pointer;border-radius:6px}
    .wsv-fi:hover{background:var(--surface)}
    .wsv-fi + .wsv-fi{border-top:1px solid var(--edge)}
    .wsv-fdot{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--accent)}
    .wsv-fdot.edited{background:var(--accent)}
    .wsv-fi .ft{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wsv-fi .ft b{font-weight:600}
    .wsv-fi .fr{color:var(--ink-faint);font-size:11.5px;white-space:nowrap}
    .wsv-feed-empty{color:var(--ink-faint);font-size:12.5px;padding:6px 2px}
    /* scoped composer */
    .wsv-compose{margin-top:26px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
    .wsv-scopebar{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
    .wsv-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
      background:color-mix(in srgb,var(--accent) 12%,var(--surface));
      border:1px solid color-mix(in srgb,var(--accent) 34%,var(--edge));
      color:var(--accent);padding:5px 11px;border-radius:20px}
    .wsv-pill .hue{width:7px;height:7px;border-radius:50%}
    .wsv-scope-alt{font-size:12px;color:var(--ink-faint)}
    .wsv-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--edge);
      border-radius:24px;padding:9px 10px 9px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.05)}
    .wsv-box input{flex:1;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);outline:none}
    .wsv-box input::placeholder{color:var(--ink-faint)}
    .wsv-box .snd{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;border:0;
      display:grid;place-items:center;flex:none;cursor:pointer}
    .wsv-box .snd svg{width:16px;height:16px}
    @media (max-width:640px){.wsv-grid{grid-template-columns:1fr}}
  </style>
  <!-- [shell edition] Home is not part of Spike Shell. -->

  <div id="footer">
    <span class="ftog" id="toggleTree" title="toggle file tree (⌘B)"></span>
    <span class="ftog" id="toggleTerm" title="focus terminal (⌘\\)"></span>
    <span class="ftog" id="togglePreview" title="toggle preview panel (⌘J)"></span>
    <span class="ftog" id="toggleWeb" title="toggle web pane"></span>
    <span class="fgrow"></span>
    <!-- Hidden until the launch check finds a newer build; click installs and
         relaunches. Earned surface — nothing here when you're current. -->
    <button class="fupdate" id="footerUpdate" hidden></button>
    <span class="ftog" id="footerSettings" title="settings (⌘,)"></span>
  </div>

  <!-- Vendored locally (copied into dist-web/vendor by build-web.mjs) so the
       packaged app never depends on a runtime CDN fetch. See that file's note. -->
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-web-links.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <!-- Sanitizes marked() output before it is injected as innerHTML — a hostile
       .md/.html file must not be able to run script in this privileged webview. -->
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <!-- HTML→markdown for the WYSIWYG editor: turndown + GFM (tables/tasks/strike). -->
  <script src="/vendor/turndown.umd.js"></script>
  <script src="/vendor/turndown-plugin-gfm.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
