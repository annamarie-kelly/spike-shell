<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spike</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <!-- NOTE: this inline script is allow-listed in the Tauri CSP by its SHA-256
       hash (tauri.conf.json → app.security.csp, the script-src 'sha256-…').
       If you edit even one byte here, regenerate the hash or the script stops
       running in the packaged app (the top-bar inset silently breaks). -->
  <script>
    // Flag the runtime before first paint so CSS can inset the top bar past
    // the native traffic lights (Tauri) vs. plain web (Node server).
    if ('__TAURI_INTERNALS__' in window) document.documentElement.classList.add('tauri');
  </script>
  <style>
    /* ── theme ─────────────────────────────────────────────────────────
       Dark is the base (:root). Light wins when explicitly toggled
       (:root[data-theme="light"]) OR when the OS prefers light and no
       explicit toggle is set. So: explicit toggle wins; else follow OS.

       --shadow is an rgb TRIPLE (not a color) and --shadow-k scales every
       alpha, so call sites read rgba(var(--shadow), calc(.34 * var(--shadow-k))).
       Dark keeps k=1 and pure black, so its shadows are byte-identical to
       before; light swaps in a warm grey at ~half strength, because pure-black
       alphas over the warm #F4F0EA surface read as grey smudges.

       The two light blocks below are deliberate duplicates: plain CSS can't
       share a declaration list between a selector and a media query, and
       light-dark() is unusable here because app.ts reads these vars back with
       getPropertyValue() to build the xterm theme, which returns the unresolved
       token stream. Edit both together. */
    :root {
      color-scheme: dark;
      --bg:#1C1A18; --surface:#2A2826; --surface-soft:#211F1D; --elevated:#322F2D;
      --edge:#3A3836; --edge-soft:#2F2D2B;
      --ink:#F2EEE9; --ink-soft:#CFC9C2; --ink-faint:#7D7872; --ink-ghost:#6B655E;
      --rose:#E2A299; --rose-deep:#D4928A; --mauve:#B898A8; --mauve-deep:#7D6872;
      --sage:#A8BDA8; --sage-deep:#8A9D8A; --tan:#C7B97F; --tan-deep:#A89968;
      --blue:#8FA8C4; --blue-deep:#7A9BB0;
      --accent:#8AAAB0;   /* default: Valence "Ocean" (dark) */
      --shadow:0,0,0; --shadow-k:1;
      /* modal backdrop. NOT --shadow: a scrim has to dim the app behind it, so
         it can't ride --shadow-k down to a wash in light mode. */
      --scrim:rgba(0,0,0,.42);
      /* the Spike mark ships as a WHITE png, so it vanishes on a light surface.
         0/1 drives an invert() filter instead of duplicating a rule per theme. */
      --mark-invert:0;
      /* Group colours are DATA (user-picked, persisted per group), not palette
         tokens, so they can't be swapped per theme. They're pastels chosen
         against the dark base; the same hex on the light surface is nearly
         invisible. So the stored hex rides in as --gc and each theme derives
         its own wash + ink strength from it. Dark keeps the pastel as its own
         ink (100% = unmixed), which is exactly the old look. */
      --gc-wash-k:13%; --gc-wash-on-k:23%; --gc-ink-k:100%;
      /* the sidebar group card carries its own, gentler wash than the strip
         chip (--gc-wash-k). Dark keeps ~9% (cool hues need it to register at
         all); light runs lower so the warm pastels don't read hot on cream. */
      --gc-card-k:9%;
      --scroll-thumb:#4A4744; --scroll-thumb-hover:#605C58;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg:#F4F0EA; --surface:#EAE5DD; --surface-soft:#ECE7DF; --elevated:#FFFFFF;
      --edge:#D6CFC4; --edge-soft:#DFD8CE;
      --ink:#1A1816; --ink-soft:#3D3935; --ink-faint:#8E867E; --ink-ghost:#9E9891;
      --rose:#B85F4E; --rose-deep:#8E4537; --mauve:#6F4E61; --mauve-deep:#4F3645;
      --sage:#5C7A5C; --sage-deep:#3F5A3F; --tan:#8B6F2A; --tan-deep:#65501C;
      --blue:#3F6E92; --blue-deep:#2E5473;
      --accent:#7A9AA0;   /* default: Valence "Ocean" (light) */
      --shadow:82,68,52; --shadow-k:.45;
      --scrim:rgba(46,38,30,.34); --mark-invert:1;
      /* Light needs a stronger wash to register at all, and the pastel must be
         pulled toward --ink to become readable text rather than a pale smear. */
      --gc-wash-k:30%; --gc-wash-on-k:45%; --gc-ink-k:55%; --gc-card-k:13%;
      --scroll-thumb:#DED7CC; --scroll-thumb-hover:#CFC6B9;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg:#F4F0EA; --surface:#EAE5DD; --surface-soft:#ECE7DF; --elevated:#FFFFFF;
        --edge:#D6CFC4; --edge-soft:#DFD8CE;
        --ink:#1A1816; --ink-soft:#3D3935; --ink-faint:#8E867E; --ink-ghost:#9E9891;
        --rose:#B85F4E; --rose-deep:#8E4537; --mauve:#6F4E61; --mauve-deep:#4F3645;
        --sage:#5C7A5C; --sage-deep:#3F5A3F; --tan:#8B6F2A; --tan-deep:#65501C;
        --blue:#3F6E92; --blue-deep:#2E5473;
        --accent:#7A9AA0;   /* default: Valence "Ocean" (light) */
        --shadow:82,68,52; --shadow-k:.45;
        --scrim:rgba(46,38,30,.34); --mark-invert:1;
      /* Light needs a stronger wash to register at all, and the pastel must be
         pulled toward --ink to become readable text rather than a pale smear. */
      --gc-wash-k:30%; --gc-wash-on-k:45%; --gc-ink-k:55%; --gc-card-k:13%;
        --scroll-thumb:#DED7CC; --scroll-thumb-hover:#CFC6B9;
      }
    }
    /* ── Valence accents (from oasis-web). A named accent resolves to a
       light/dark pair, mirroring the token blocks above: the dark value sits on
       the dark-default :root, the light value overrides at the light selectors.
       `data-accent` is set on <html> by applyAccent(); absent = Spike's built-in
       --accent. Edit alongside the ACCENTS map in app.ts. ── */
    :root[data-accent="coral"]{--accent:#D4698A}
    :root[data-accent="sage"]{--accent:#9BAA9B}
    :root[data-accent="terracotta"]{--accent:#D4948A}
    :root[data-accent="ocean"]{--accent:#8AAAB0}
    :root[data-accent="teal"]{--accent:#7FAAA0}
    :root[data-accent="plum"]{--accent:#AA8A9B}
    :root[data-accent="graphite"]{--accent:#B6B3AE}
    :root[data-theme="light"][data-accent="coral"]{--accent:#E0848C}
    :root[data-theme="light"][data-accent="sage"]{--accent:#8B9A8B}
    :root[data-theme="light"][data-accent="terracotta"]{--accent:#C4847A}
    :root[data-theme="light"][data-accent="ocean"]{--accent:#7A9AA0}
    :root[data-theme="light"][data-accent="teal"]{--accent:#5F8E86}
    :root[data-theme="light"][data-accent="graphite"]{--accent:#6B6966}
    :root[data-theme="light"][data-accent="plum"]{--accent:#9A7A8B}
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"])[data-accent="coral"]{--accent:#E0848C}
      :root:not([data-theme="dark"])[data-accent="sage"]{--accent:#8B9A8B}
      :root:not([data-theme="dark"])[data-accent="terracotta"]{--accent:#C4847A}
      :root:not([data-theme="dark"])[data-accent="ocean"]{--accent:#7A9AA0}
      :root:not([data-theme="dark"])[data-accent="teal"]{--accent:#5F8E86}
      :root:not([data-theme="dark"])[data-accent="graphite"]{--accent:#6B6966}
      :root:not([data-theme="dark"])[data-accent="plum"]{--accent:#9A7A8B}
    }
    html, body { margin: 0; height: 100%; background: var(--bg); font-family: -apple-system, system-ui, sans-serif; }
    /* UI scaling lives on <body> (set in JS), which is sized to
       viewport/factor and transformed back to the viewport. html clips rounding;
       body anchors its absolute children and never scrolls. #termlayer is a
       sibling under <html>, deliberately OUTSIDE this scaling. */
    html { overflow: hidden; }
    body { position: relative; overflow: hidden; transform-origin: 0 0; }
    /* Scrollbars: the native macOS thumb is near-black and reads as a bar of
       chrome in light mode. --scroll-thumb sits just off the paper tone so it
       reads as a raised edge, not a stripe, and firms up only on hover.
       Unscoped on purpose: #termlayer and #toplayer are siblings of <body>, so a
       body-scoped rule would miss menus and the command tray. The id-specific
       #termlayer rule further down still wins and keeps the terminal's hidden. */
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 6px; border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }
    ::-webkit-scrollbar-corner { background: transparent; }
    /* transitions on only during a theme flip (class toggled in JS) so the chrome
       fades between light/dark instead of snapping. */
    /* Theme flip is INSTANT — everything snaps in the same frame. A partial fade
       (text/logo snapping while surfaces cross-fade) left elements visibly out of
       sync, which read as lag. Uniform snap is crisp with nothing trailing.
       (`theming` still brackets the flip for the terminal repaint in retheme.) */
    html.theming, html.theming *, html.theming *::before, html.theming *::after {
      transition: none !important;
    }
    /* A little chrome so it reads like a native panel, not a webpage. */
    :root { --barh: 34px; }
    #bar {
      position: relative;
      height: var(--barh); display: flex; align-items: center; gap: 8px;
      padding: 0 14px; color: var(--ink-soft); font: 12px -apple-system, system-ui, sans-serif;
      background: var(--surface); border-bottom: 1px solid var(--edge); user-select: none;
    }
    /* Title + project picker, pinned left after the traffic-light inset. */
    #barTitle {
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    /* Under Tauri the native traffic lights overlay the bar's top-left
       (titleBarStyle Overlay + hiddenTitle), so inset past them and run the
       bar a touch taller so the lights center on it (trafficLightPosition y
       in tauri.conf.json = (--barh - 12px button) / 2); the bar IS the
       titlebar there (data-tauri-drag-region). */
    html.tauri { --barh: 38px; }
    /* Reserve clear space for the native traffic lights. The cluster's right
       edge sits ~78px in (inset ~14–19px + three buttons), so 78px left it
       touching the title — 92px guarantees a gap so "Spike" never overlaps. */
    html.tauri #bar { padding-left: 92px; }
    /* Fullscreen hides the traffic lights (class synced from the window state
       in ipc.ts) — reclaim their inset. */
    html.tauri.fullscreen #bar { padding-left: 14px; }
    /* Preview focus hides #bar entirely (see html.preview-focus below), so
       .pvhead becomes the topmost strip and inherits the problem: the lights
       land on the first doc pill and eat its name. Same inset, same fullscreen
       reclaim — keep these four rules in sync. */
    html.tauri.preview-focus .pvhead { padding-left: 92px; }
    html.tauri.preview-focus.fullscreen .pvhead { padding-left: 8px; }
    /* While browsing a live URL, .pvhead is hidden and the browser's livebar is
       the topmost strip — so it inherits the traffic-light inset instead. Only
       the browser's bar (.topline); the local-HTML livebar keeps .pvhead above
       it, so it must not be shoved right. Keep in sync with the two rules above. */
    html.tauri.preview-focus .livechrome.topline .livebar { padding-left: 92px; }
    html.tauri.preview-focus.fullscreen .livechrome.topline .livebar { padding-left: 8px; }
    /* The open-project button: shows the current project, click to re-root. */
    #project {
      display: inline-flex; align-items: center; gap: 6px; margin-left: 6px;
      padding: 3px 9px; border-radius: 5px; background: var(--surface-soft);
      border: 1px solid var(--edge); color: var(--ink-soft); cursor: pointer;
      font: 12px -apple-system, system-ui, sans-serif;
    }
    #project:hover { background: var(--elevated); color: var(--ink); }
    #project .car { color: var(--ink-ghost); display: inline-flex; align-items: center; }
    /* Inline path input that replaces the button while picking a project. */
    #projectInput {
      margin-left: 6px; width: 320px; padding: 3px 9px; border-radius: 5px;
      background: var(--bg); border: 1px solid var(--accent); color: var(--ink);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; outline: none;
    }
    #status { margin-left: auto; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
    /* Active-work auto-context (branch · gh#PR). Quiet, left of #status's
       auto-margin so it sits beside the project name; empty when unresolved. */
    #ctx {
      margin-left: 10px; color: var(--ink-faint); opacity: 0.9;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #ctx:empty { display: none; }
    /* worktree glyph — one accent tee before the branch; the lane reads as
       "split off the trunk" without a label. Inherits #ctx's monospace. */
    #ctx .wt { color: var(--accent); opacity: 1; margin-right: 1px; cursor: default; }
    /* the PR is a link, not decoration — quiet until hover, then it lights up and
       underlines so it reads as clickable rather than floating text. */
    #ctx .pr { cursor: pointer; text-decoration: none; }
    #ctx .pr:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
    /* the ⌘K signpost — one quiet glyph at the bar's right edge; the only
       persistent chrome the command palette adds. Built in app.ts (no
       drag-region attribute, so clicking it opens the palette, not a drag). */
    #kbtn {
      margin-left: 10px; padding: 1px 5px; border-radius: 4px; user-select: none;
      color: var(--ink-ghost); font: 10.5px -apple-system, system-ui, sans-serif;
      border: 1px solid transparent;
    }
    #kbtn:hover { color: var(--ink-soft); background: var(--elevated); border-color: var(--edge); }
    /* the capture glyph — a second quiet signpost beside ⌘K, since a new note is
       a global quick-action (⌘⇧N from anywhere), not a panel toggle. Same
       treatment as #kbtn; the pencil reads a touch larger so it isn't mistaken
       for a keycap. Built in app.ts, no drag-region so the click stays a click. */
    #capbtn {
      /* inline-flex + fixed height centers the icon on the bar's midline, level
         with #kbtn beside it. (It also fixed the old '✎' character's tall
         bounding box, which sat high on the text baseline and floated above ⌘K.
         The icon is an svg now, but the centering stays honest either way.) */
      display: inline-flex; align-items: center; justify-content: center; height: 18px;
      margin-left: 10px; padding: 0 4px; border-radius: 4px; user-select: none; cursor: pointer;
      color: var(--ink-ghost); line-height: 1;
      border: 1px solid transparent;
    }
    /* the glyph inherits colour from #capbtn, so hover lights icon + pill together */
    #capbtn svg { display: block; }
    #capbtn:hover { color: var(--ink-soft); background: var(--elevated); border-color: var(--edge); }
    /* ...and when the two sit together they read as ONE signpost pair, not two
       separate controls: #kbtn's 10px lead is the gap from #ctx, which the
       pencil now owns instead. Between them, only enough air to keep the hover
       pills from touching. Measured in the harness: 18px between the boxes → 10px,
       which is 30px of glyph-to-⌘K daylight → 19px. */
    #capbtn + #kbtn { margin-left: 2px; }

    /* the sign-in hold — what the pane shows while the top-level Google window
       is up. It sits in the space the native child webview normally covers, so
       it only becomes visible because syncLiveBoard hides that webview for the
       duration. Centred, quiet, and carrying the way out: without the button a
       closed sign-in window would strand the pane here. */
    .livehold {
      position: absolute; left: 0; right: 0; bottom: 0; top: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 0 44px; text-align: center; z-index: 3;
      background: var(--surface); color: var(--ink-faint);
    }
    .livehold-t { font-size: 14px; font-weight: 500; color: var(--ink); }
    .livehold-s { font-size: 12px; line-height: 1.55; max-width: 420px; }
    .livehold-b {
      margin-top: 6px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
      font: 12px -apple-system, system-ui, sans-serif;
      color: var(--ink-soft); background: var(--elevated);
      border: 1px solid var(--edge);
    }
    .livehold-b:hover { color: var(--ink); border-color: var(--ink-ghost); }

    /* ── footer status bar ─────────────────────────────────────────────
       A thin bar pinned to the bottom (Zed-style), holding dock toggles that
       show / hide the file tree and the preview panel. Icons follow the theme
       via currentColor; the lit (.on) state means that dock is visible. */
    #footer {
      position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
      display: flex; align-items: center; gap: 2px; padding: 0 8px;
      background: var(--surface); border-top: 1px solid var(--edge);
      color: var(--ink-faint); user-select: none; z-index: 6;
    }
    #footer .ftog {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 20px; border-radius: 6px; color: var(--ink-ghost); cursor: pointer;
      /* siblings slide to open the gap during a footer reorder-drag; the grabbed
         chip suppresses its own transition so it tracks the cursor 1:1 */
      transition: transform .12s ease;
    }
    #footer .ftog.fdragging {
      transition: none; z-index: 8; position: relative; cursor: grabbing;
      background: color-mix(in srgb, var(--elevated) 85%, var(--surface));
      color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge-soft);
    }
    /* thinner strokes than the app-wide 2 — reads lighter in the slim bar */
    #footer .ftog svg { display: block; stroke-width: 1.5; }
    /* hover: a whisper of the surface lifting, no hard edge */
    #footer .ftog:hover { background: color-mix(in srgb, var(--elevated) 55%, var(--surface)); color: var(--ink-soft); }
    /* open = an intentional soft pill: a toned-down fill (not the stark pure-white
       --elevated) ringed by a subtle inset edge, so an active dock reads as a
       deliberate highlight rather than an accidental contrast box. */
    #footer .ftog.on {
      background: color-mix(in srgb, var(--elevated) 72%, var(--surface));
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--edge-soft);
    }
    #footer .ftog.on:hover { background: color-mix(in srgb, var(--elevated) 85%, var(--surface)); }
    /* a dock with nothing to show (preview, no file open) reads as unavailable */
    #footer .ftog.disabled { color: var(--ink-ghost); cursor: default; }
    #footer .ftog.disabled:hover { background: transparent; color: var(--ink-ghost); }
    #footer .fsep { width: 1px; height: 14px; background: var(--edge); margin: 0 6px; }
    /* Visual order is pinned with `order`, not DOM sequence: the dock toggles
       sit left, then a growing spacer, then the update pill, then the gear.
       Explicit order also means the pill's markup position can't accidentally
       land it in the left group. */
    #footer .ftog { order: 1; }
    #footer .fgrow { order: 2; flex: 1 1 auto; }
    #footer .fupdate { order: 3; }
    #footer #footerSettings { order: 4; }   /* gear rides to the right of the pill */
    /* Update pill: hidden until an update is pending (earned surface, no nag).
       Accent-filled so it's the one lit thing in an otherwise ghost-grey bar —
       unmissable, but only present when there's actually something to do. */
    #footer .fupdate {
      display: inline-flex; align-items: center; gap: 4px;
      height: 18px; padding: 0 8px; margin-right: 4px;
      font: inherit; font-size: 11px; font-weight: 500; line-height: 1;
      color: var(--bg); background: var(--accent);
      border: 0; border-radius: 9px; cursor: pointer; white-space: nowrap;
    }
    #footer .fupdate[hidden] { display: none; }
    #footer .fupdate:hover { filter: brightness(1.08); }
    #footer .fupdate:active { filter: brightness(0.94); }

    /* two-panel shell: file tree rail + terminal. Sits between the top bar
       (34px) and the footer status bar (26px), so its box is inset both ends. */
    #shell { position: absolute; top: var(--barh); left: 0; right: 0; bottom: 26px; display: flex; }
    /* Preview focus mode is presentation-only: app.ts renders just the chosen
       preview while preserving the user's full tiling layout underneath. */
    html.preview-focus #bar, html.preview-focus #footer,
    html.preview-focus #tree, html.preview-focus #treedivide { display: none !important; }
    html.preview-focus #shell { top: 0; bottom: 0; }
    /* sidebar docks to either edge (right-click the tree → Pin sidebar): DOM
       order positions it, this just flips which edge carries the border. */
    #shell.tree-right #tree { border-right: none; border-left: 1px solid var(--edge); }
    #shell.tree-right #treedivide { margin-left: 0; margin-right: -3px; }
    #tree {
      width: 264px; flex: 0 0 264px; overflow-y: auto; overscroll-behavior: contain; background: var(--surface-soft);
      border-right: 1px solid var(--edge); padding: 8px 4px 24px;
      font: 12px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
      user-select: none;
    }
    /* Vertical session roster, pinned above the file tree. A second view over the
       same session/group model that the horizontal strip renders — clicking a
       row activates that session, and the same attention dot the strip shows
       (agent paused / turn ended) lights here too. Sticky so it stays put while
       the tree scrolls under it. */
    .spanel {
      display: none; position: sticky; top: -8px; z-index: 3;
      margin: -8px -4px 6px; padding: 8px 6px 6px;
      background: var(--surface-soft); border-bottom: 1px solid var(--edge);
    }
    .spanel.show { display: block; }
    /* docked below the tree rows instead of above: stick to the bottom edge. */
    .spanel.bottom { position: sticky; top: auto; bottom: -8px; margin: 6px -4px -8px; border-bottom: none; border-top: 1px solid var(--edge); }
    /* collapsed → header only, no bottom rule needed between it and the tree. */
    .spanel.collapsed { border-bottom-width: 0; padding-bottom: 8px; }
    .spanel.collapsed.bottom { border-top-width: 1px; }
    .spanel .shdr {
      display: flex; align-items: center; gap: 5px; padding: 0 2px 6px 4px; cursor: default;
      color: var(--ink-faint); font-size: 11px; letter-spacing: .02em;
    }
    .spanel.collapsed .shdr { padding-bottom: 0; }
    .spanel .shdr:hover { color: var(--ink-soft); }
    .spanel .shdr .schev { display: inline-flex; align-items: center; color: var(--ink-ghost); margin-left: -2px; }
    .spanel .shdr .slbl { flex: 0 0 auto; }
    /* right inset 6px (.spanel) + 2px (.shdr) = 8px, matching the tree root's +
       — the two headers' plus signs share one vertical line. */
    .spanel .shdr .sadd {
      margin-left: auto; width: 18px; height: 18px; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-faint); cursor: default;
    }
    .spanel .shdr .sadd:hover { background: var(--edge); color: var(--ink); }
    /* the whole group is a tinted card — the sidebar echo of the strip's group
       card (#tabs .group) — so its colour reads at a glance. --gc is set inline
       per group, so a theme flip restyles every card with no re-render. */
    .spanel .grp {
      margin-bottom: 7px; padding: 3px; border-radius: 8px;
      background: color-mix(in srgb, var(--gc) var(--gc-card-k), transparent);
    }
    /* header rides the card's own wash rather than stacking a second one on top
       (that double-mix read hot on the warm groups). The chevron + colour-mixed
       ink label carry the "this is the header" affordance; hover lifts it a step.
       Single-click collapses (chevron flips), double-click renames. */
    .spanel .grphdr {
      display: flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 6px;
      cursor: default; font-size: 11px; font-weight: 600; letter-spacing: .01em;
      background: transparent;
      color: color-mix(in srgb, var(--gc) var(--gc-ink-k), var(--ink));
    }
    .spanel .grphdr:hover { background: color-mix(in srgb, var(--gc) calc(var(--gc-card-k) * 1.9), transparent); }
    .spanel .grphdr .gchev { display: inline-flex; align-items: center; margin-left: -1px; opacity: .75; }
    .spanel .grphdr .gnm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .spanel .grphdr .gcount { margin-left: auto; font-weight: 400; opacity: .7; font-variant-numeric: tabular-nums; }
    /* members sit inside the card, indented under the header label. */
    .spanel .grpmem { margin: 3px 2px 1px; }
    .spanel .grpmem .srow { margin-left: 0; }
    /* a subagent row in the roster indents under its parent row, the vertical
       echo of the strip's rail. */
    .spanel .srow.subrow { margin-left: 16px; opacity: .85; }
    .spanel .srow {
      display: flex; align-items: center; gap: 8px; padding: 5px 7px; margin: 1px 0;
      border-radius: 6px; cursor: default; color: var(--ink-soft); position: relative;
    }
    /* Context-occupancy ring: a small donut in the far-right slot that fills
       clockwise as the session's chat context fills. It shares the slot with the
       × close button — the ring shows at rest, and on row-hover it fades out as
       the × fades in (see the hover rules on .sx below). Unpainted until .has,
       so shell tabs and not-yet-run sessions show nothing. The sweep rides a
       --pct custom prop set per-row in applyCtxRing; the fill is a quiet grey
       that escalates amber (≥75%) → red (≥90%) as the window nears full. */
    .spanel .srow .sring {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 12px; height: 12px; border-radius: 50%; pointer-events: none;
      opacity: 0; transition: opacity .18s ease;
      background: conic-gradient(
        var(--ring-fill, color-mix(in srgb, var(--ink) 34%, transparent)) var(--pct, 0%),
        color-mix(in srgb, var(--ink) 11%, transparent) 0);
      -webkit-mask: radial-gradient(closest-side, transparent 58%, #000 59%);
              mask: radial-gradient(closest-side, transparent 58%, #000 59%);
    }
    .spanel .srow .sring.has { opacity: 1; }
    .spanel .srow .sring.warn { --ring-fill: var(--warn, #d99a2b); }
    .spanel .srow .sring.crit { --ring-fill: var(--danger, #d0492b); }
    /* on hover the ring yields the slot to the × */
    .spanel .srow:hover .sring { opacity: 0; }
    .spanel .srow:hover { background: var(--elevated); }
    /* active row: a softened accent ring (mixed toward the surface so it frames
       rather than clamps) + a faint accent-tinted fill, so the engine mark has
       breathing room inside it instead of butting against a hard border. */
    .spanel .srow.active {
      background: color-mix(in srgb, var(--accent) 8%, var(--elevated)); color: var(--ink);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent);
    }
    /* the agent's engine mark stands in for the row's icon. Dimmed a touch when
       the row isn't the column's active session so the active one keeps its pop.
       It never animates: identity is not a state, so the mark says WHICH engine
       and the state dot beside it says what the lane needs. */
    .spanel .srow .seng {
      width: 14px; height: 14px; flex: 0 0 auto; opacity: .7;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-soft); transition: opacity .2s ease;
    }
    .spanel .srow.active .seng { opacity: 1; color: var(--ink); }
    .spanel .srow .seng img, .spanel .srow .seng svg { width: 13px; height: 13px; display: block; }
    .spanel .srow.attn .seng, .spanel .srow.unread .seng,
    .spanel .srow.working .seng, .spanel .srow.needs .seng { opacity: 1; }
    /* The roster's state slot — the same vocabulary as the strip's .dot and the
       launcher's glyph (working = turning arc, unread = still dot, needs you =
       a breathing light). Collapsed to zero width when the lane has nothing to
       say, so a quiet roster stays a plain list of names. */
    .spanel .srow .sdot {
      display: inline-block; width: 0; height: 7px; border-radius: 50%; flex: 0 0 auto;
      background: var(--accent); opacity: 0; margin-left: -6px;
      transition: width .28s ease, margin-left .28s ease;
    }
    .spanel .srow.attn .sdot, .spanel .srow.unread .sdot {
      width: 7px; margin-left: 0; animation: tabAttnIn .3s ease-out forwards;
    }
    .spanel .srow.needs .sdot {
      width: 8px; height: 8px; margin-left: 0; opacity: 1;
      animation: wbeacon 2s ease-in-out infinite;
    }
    .spanel .srow.working .sdot {
      width: 11px; height: 11px; margin-left: 0; opacity: 1; background: transparent;
      border: 1.4px solid color-mix(in srgb, var(--accent) 22%, transparent);
      border-top-color: color-mix(in srgb, var(--accent) 75%, transparent);
      animation: wspin 2.4s linear infinite;
    }
    .spanel .srow.needs .snm, .spanel .srow.unread .snm { color: var(--ink); }
    @media (prefers-reduced-motion: reduce) {
      .spanel .srow .sdot, #tabs .tab .dot { animation: none !important; }
    }
    .spanel .srow .snm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* inline rename, in the roster this time — same warm-accent field as the
       strip tab's, but it flexes to the sidebar width instead of a fixed 110px */
    .spanel .nmedit, .spanel .gnmedit {
      flex: 1 1 auto; min-width: 0; width: 100%; padding: 0; margin: 0; background: transparent;
      border: none; border-bottom: 1px solid var(--accent); color: var(--ink);
      font: inherit; outline: none;
    }
    .spanel .srow .spop { flex: 0 0 auto; color: var(--ink-ghost); display: inline-flex; }
    .spanel .srow .sx {
      flex: 0 0 auto; width: 16px; height: 16px; border-radius: 4px; opacity: 0;
      display: inline-flex; align-items: center; justify-content: center; color: var(--ink-faint);
    }
    .spanel .srow:hover .sx { opacity: .55; }
    .spanel .srow .sx:hover { opacity: 1; background: var(--edge); color: var(--ink); }
    /* ── Recently touched panel ─────────────────────────────────────────
       A second .spanel (so it inherits the header/collapse chrome), but its
       rows are files, not sessions. Docked just above the file tree (below the
       session roster) as a primary MRU jump surface. Its rows echo the file-tree
       row (icon tint + name), plus a leading marker that tells an agent/disk
       EDIT (accent dot) from a plain OPEN (hollow).
       Unlike the roster it flows in place (static) rather than sticking to the
       viewport top — the roster owns the sticky top slot, and the tree's root
       row sticks below it; a second sticky panel here would fight both. */
    .rpanel { position: static; z-index: auto; margin: 0 -4px 6px; }
    .rpanel .rrow {
      display: flex; align-items: center; gap: 6px; padding: 2px 4px;
      margin: 0 2px; border-radius: 5px; cursor: default; white-space: nowrap;
      color: var(--ink-soft); font-size: 12px; line-height: 1.7;
    }
    .rpanel .rrow:hover { background: var(--elevated); }
    /* the tell: FILL = edited vs opened (a solid dot was written to, a hollow
       ring was only opened), HUE = the workspace that touched it (set inline in
       JS from the group color). No workspace → neutral grey ring / accent dot.
       Sits where the tree's chevron would. */
    .rpanel .rrow .rdot {
      flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%;
      background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-ghost);
    }
    .rpanel .rrow.edited .rdot { background: var(--accent); box-shadow: none; }
    .rpanel .rrow .ric {
      width: 15px; flex: 0 0 15px; color: var(--ink-faint);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .rpanel .rrow .ric.ic-doc   { color: var(--mauve); }
    .rpanel .rrow .ric.ic-code  { color: var(--accent); }
    .rpanel .rrow .ric.ic-img   { color: var(--sage); }
    .rpanel .rrow .ric.ic-data  { color: var(--tan); }
    .rpanel .rrow .ric.ic-media { color: var(--ink-soft); }
    /* filter field: slides in (max-height + opacity) once the list is long
       enough to warrant it, so it appears rather than popping. */
    .rpanel .rsearch-wrap { max-height: 0; opacity: 0; overflow: hidden; margin: 0 2px; transition: max-height .22s ease, opacity .16s ease, margin .22s ease; }
    .rpanel .rsearch-wrap.show { max-height: 30px; opacity: 1; margin: 1px 2px 5px; }
    .rpanel .rsearch {
      width: 100%; box-sizing: border-box; padding: 3px 8px; font: inherit; font-size: 12px;
      color: var(--ink); background: var(--elevated); border: 1px solid var(--edge);
      border-radius: 6px; outline: none;
    }
    .rpanel .rsearch:focus { border-color: var(--ink-ghost); }
    .rpanel .rsearch::placeholder { color: var(--ink-ghost); }
    .rpanel .rrow .rnm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
    /* dimmed parent-folder tail so two like-named files stay distinguishable */
    .rpanel .rrow .rdir { flex: 0 0 auto; color: var(--ink-ghost); font-size: 11px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
    .rpanel .rempty { padding: 3px 6px 2px; color: var(--ink-ghost); font-size: 11px; }
    /* The project root row is the file tree's header, and it's built to mirror
       the roster's (.shdr): same chevron-label-+ shape, same insets, so the two
       headers stack as one column instead of two near-misses.
         left:  10px + chevron's -2px = 8px, same as .shdr
         right: -4px margin puts the row edge on the border, 12px padding pulls
                back in, the +'s -4px margin lands it at 8px — same as .sadd.
       Sticky so the folder name and its + stay reachable while rows scroll:
       --spanel-h is the roster's measured height (0 when it's docked at the
       bottom and isn't above us), -8px cancels #tree's top padding. */
    #tree .root {
      display: flex; align-items: center; gap: 5px; cursor: default;
      position: sticky; top: calc(var(--spanel-h, 0px) - 8px); z-index: 2;
      margin: 0 -4px; padding: 2px 12px 8px 10px; background: var(--surface-soft);
      color: var(--ink-faint); font-size: 11px; letter-spacing: .02em;
    }
    #tree .root:hover { color: var(--ink-soft); }
    #tree .root .rootchev { display: inline-flex; align-items: center; color: var(--ink-ghost); margin-left: -2px; }
    #tree .root .rootname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* same right-edge treatment as the folder-row + (see .ract) so it lines up with the counts */
    #tree .rootadd { margin-left: auto; width: 18px; height: 18px; margin-right: -4px; border-radius: 4px; color: var(--ink-faint); display: inline-flex; align-items: center; justify-content: center; cursor: default; }
    #tree .rootadd:hover { background: var(--edge); color: var(--ink); }
    /* collapsed → the header row survives, the file rows go. The roster is a
       child of #tree too and is NOT a file row, so it's excluded by name. */
    #tree.rows-collapsed > :not(.root):not(.spanel) { display: none; }
    #tree .row {
      display: flex; align-items: center; gap: 5px; padding: 2px 8px;
      border-radius: 5px; cursor: default; white-space: nowrap; line-height: 1.75;
    }
    #tree .row:hover { background: var(--elevated); }
    #tree .row.dir { color: var(--ink); }
    #tree .row.file { color: var(--ink-soft); }
    #tree .tw {
      width: 12px; flex: 0 0 12px; color: var(--ink-ghost);
      display: inline-flex; align-items: center; justify-content: center;
    }
    /* chevron rotates from closed to open (90deg) via the .open container */
    #tree .tw svg { transition: transform .12s ease; }
    #tree .open > .row > .tw svg { transform: rotate(90deg); }
    #tree .ic {
      width: 15px; flex: 0 0 15px; color: var(--ink-faint);
      display: inline-flex; align-items: center; justify-content: center;
    }
    /* file-type tints — subtle, theme-aware via currentColor on the .ic */
    #tree .ic.ic-doc   { color: var(--mauve); }
    #tree .ic.ic-code  { color: var(--accent); }
    #tree .ic.ic-img   { color: var(--sage); }
    #tree .ic.ic-data  { color: var(--tan); }
    #tree .ic.ic-media { color: var(--ink-soft); }
    #tree .nm { overflow: hidden; text-overflow: ellipsis; }
    #tree .children { display: none; }
    #tree .open > .children { display: block; }
    #tree .count { margin-left: auto; color: var(--ink-ghost); font-variant-numeric: tabular-nums; padding-left: 10px; }

    /* right panel: a tab strip stacked above the terminal area, with an
       optional preview surface to its right (laid out by #termcol/.preview below) */
    #wrap { flex: 1 1 auto; min-width: 0; display: flex; position: relative; }
    /* shown only when every panel in the tile area is hidden (terminal off + no
       preview) — a faint way to summon one back, never persistent chrome. */
    #emptyhint {
      position: absolute; inset: 0; z-index: 1; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      color: var(--ink-ghost); font: 12px -apple-system, system-ui, sans-serif;
      user-select: none; pointer-events: none;
    }
    /* a ghost-level Spike mark — a calm "home" cue, never a glaring logo */
    #emptyhint .emptymark {
      width: 52px; height: 52px; object-fit: contain; opacity: .28;
      filter: invert(var(--mark-invert));
    }
    #emptyhint .emptyrow { display: flex; gap: 36px; letter-spacing: .02em; }
    #emptyhint b { color: var(--ink-faint); font-weight: 600; font-variant-numeric: tabular-nums; }
    /* wrapper so the "+N hidden" badges can pin to the strip's edges,
       unaffected by how far the strip has scrolled */
    #tabstrip { position: relative; }
    /* the hidden-count badge: pinned over the fading edge, so the cue never
       lands on a blank gap between tabs the way a bare fade could. Shows the
       exact number off that side; click scrolls a page toward them. */
    .tabmore {
      position: absolute; top: 6px; bottom: 0; z-index: 4;
      display: inline-flex; align-items: center; height: 22px; margin: auto 0;
      padding: 0 7px; border: none; border-radius: 999px; cursor: pointer;
      background: var(--elevated); color: var(--ink-soft);
      font: 600 10.5px -apple-system, system-ui, sans-serif; letter-spacing: .02em;
      font-variant-numeric: tabular-nums; line-height: 1;
      box-shadow: 0 1px 4px rgba(var(--shadow), calc(.5 * var(--shadow-k)));
      transition: background-color .16s ease, color .16s ease, opacity .16s ease;
    }
    .tabmore[hidden] { display: none; }
    .tabmore:hover { background: var(--accent); color: #fff; }
    .tabmore.l { left: 4px; }
    .tabmore.r { right: 4px; }
    .tabmore .car { display: inline-flex; }
    .tabmore.l .car { margin-right: 2px; }
    .tabmore.r .car { margin-left: 2px; }
    .tabmore svg { display: block; width: 9px; height: 9px; }

    #tabs {
      display: flex; align-items: flex-end; gap: 4px; height: 34px;
      padding: 6px 8px 0; background: var(--surface-soft); border-bottom: 1px solid var(--edge);
      font: 12px -apple-system, system-ui, sans-serif; user-select: none;
      overflow-x: auto; overflow-y: hidden;
    }
    #tabs::-webkit-scrollbar { height: 0; }
    /* Overflow affordance: the scrollbar is hidden, so a soft fade on whichever
       edge has hidden tabs is the "there's more this way" cue. Classes are
       toggled by updateTabsOverflow() on scroll/resize/render; the mask only
       bites where a class is present, so a strip that fits shows no fade. */
    #tabs.ovl { -webkit-mask-image: linear-gradient(to right, transparent, #000 24px); }
    #tabs.ovr { -webkit-mask-image: linear-gradient(to left, transparent, #000 24px); }
    #tabs.ovl.ovr {
      -webkit-mask-image: linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent);
    }
    /* ── pill language ──────────────────────────────────────────────────
       One container shape for every tab-like control: terminal tabs, preview
       doc pills, leaf stack pills. Geometry/type/hover/active live HERE;
       containers adjust only height, spacing and odd affordances (drag
       cursor, attention dot). The grouped-terminal tint card + chip are the
       reference vibe and keep their own colorway. */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      height: 24px; padding: 0 6px 0 11px; border-radius: 6px;
      border: 1px solid transparent; max-width: 200px;
      color: var(--ink-faint); cursor: default; white-space: nowrap;
      font: 12px -apple-system, system-ui, sans-serif;
      transition: background-color .2s ease, color .2s ease, border-color .2s ease;
    }
    .pill:hover { background: var(--elevated); color: var(--ink-soft); }
    .pill.active, .pill.on { background: var(--elevated); color: var(--ink); border-color: var(--edge); }
    .pill .nm { overflow: hidden; text-overflow: ellipsis; }
    .pill.active .nm, .pill.on .nm { font-weight: 500; }   /* active reads a touch heavier */
    /* hover-revealed controls (× / group-dots / pin). The 15px box is always
       reserved so a reveal never shifts neighboring pills; only the glyph
       eases in/out, mirroring the attention dot's scale-up entrance. */
    .pill .ctl {
      width: 15px; height: 15px; border-radius: 4px; color: var(--ink-ghost);
      flex: 0 0 15px; display: inline-flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(.55);
      transition: opacity .16s ease, transform .16s ease, background-color .2s ease, color .2s ease;
    }
    .pill:hover .ctl { opacity: 1; transform: scale(1); }
    .pill.active .ctl.x, .pill.on .ctl.x { opacity: 1; transform: scale(1); }   /* the active pill keeps its × */
    .pill .ctl:hover { background: var(--edge); color: var(--ink); }
    .pill .ctl svg { display: block; }
    /* terminal tabs: pills floating in the strip, centered on the grouped-tab
       axis (24px + 5px bottom inset lands the same midline as a 22px tab in a
       28px card with 3px inset). */
    /* ungrouped tabs share the grouped pill's exact bottom edge. A grouped pill
       is 24px (22 + 2px transparent border, content-box) centered in the 28px
       card (margin-bottom 3), so its bottom sits 3 + (28-24)/2 = 5px up — match
       it, so grouped and ungrouped read as one row. */
    /* flex: none so a crowded strip SCROLLS (the strip is overflow-x:auto)
       instead of squeezing every pill until short names like "Agent" ellipsize
       down to "Ag…". Pills keep their natural width up to max-width. */
    #tabs .tab { flex: none; max-width: 190px; height: 22px; margin-bottom: 5px; }
    /* engine badge: a 12px mark (Claude spark / Codex hexagon / terminal chevron)
       left of the name. Hidden by default — only #tabs.mixed-engines reveals it,
       so single-engine strips stay clean. flex:none keeps it from squeezing under
       a long name; the small right margin sets it off from the label. */
    #tabs .tab .eng {
      display: none; align-items: center; flex: 0 0 auto; margin-right: 3px;
      /* dim on inactive tabs so the active tab's mark keeps its pop; the active
         tab restores full strength below. */
      opacity: .5; transition: opacity .2s ease;
    }
    #tabs .tab.active .eng { opacity: 1; }
    #tabs.mixed-engines .tab .eng { display: inline-flex; }
    #tabs .tab .eng img, #tabs .tab .eng svg { width: 12px; height: 12px; display: block; }
    /* attention dot: lit when Claude finished on a backgrounded tab. Hidden
       until then so it doesn't reserve space or read as decoration. A slow
       pulse catches the eye without nagging; an unlooked-at tab also brightens.
       Same single dot for both turn-end and question-pause — the broker
       distinguishes them internally but the badge is one shape. */
    #tabs .tab .dot {
      display: inline-block; width: 0; height: 7px; border-radius: 50%;
      flex: 0 0 auto; background: var(--accent); opacity: 0;
      margin-left: -6px;   /* cancel the flex gap while collapsed so the name doesn't indent */
      transition: width .28s ease, margin-left .28s ease;
    }
    /* The dot is a STATE SLOT, not an alert: it carries the same four-state
       vocabulary the Home launcher's glyph does (see #home .wrow), so a tab, a
       roster row and a workstream row all say the same things the same way.
         working  · a thin arc turning slowly — rotation, never a blink
         unread   · a still accent dot ("something landed, you haven't looked")
         needs    · a light breathing in place — the ONE thing that pulses
       .attn is the byte-stream fallback for a lane with no broker state (a
       plain shell), and reads as unread. Nothing else in the strip moves, so a
       pulse anywhere in Spike means exactly one thing: answer me. */
    #tabs .tab.attn .dot, #tabs .tab.unread .dot {
      width: 7px; margin-left: 0; animation: tabAttnIn .3s ease-out forwards;
    }
    #tabs .tab.needs .dot {
      width: 8px; height: 8px; margin-left: 0; opacity: 1;
      animation: wbeacon 2s ease-in-out infinite;
    }
    #tabs .tab.working .dot {
      width: 11px; height: 11px; margin-left: 0; opacity: 1; background: transparent;
      border: 1.4px solid color-mix(in srgb, var(--accent) 22%, transparent);
      border-top-color: color-mix(in srgb, var(--accent) 75%, transparent);
      animation: wspin 2.4s linear infinite;
    }
    #tabs .tab.attn:not(.active), #tabs .tab.unread:not(.active), #tabs .tab.needs:not(.active) { color: var(--ink-soft); }
    /* On a mixed-engine strip the engine mark stays put and simply brightens —
       it says WHICH engine, and the dot beside it says what that lane needs.
       The mark used to pulse instead, which spent motion on identity. */
    #tabs.mixed-engines .tab.attn .eng, #tabs.mixed-engines .tab.unread .eng,
    #tabs.mixed-engines .tab.working .eng, #tabs.mixed-engines .tab.needs .eng { opacity: 1; }
    /* (popped-out sessions have NO strip tab — a pane is a real separation;
       the pane's pill is that session's tab until it rejoins the strip.) */
    @keyframes tabAttnIn { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
    /* inline rename of a tab label — same warm-accent field as elsewhere */
    #tabs .tab .nmedit {
      width: 110px; padding: 0; margin: 0; background: transparent;
      border: none; border-bottom: 1px solid var(--accent); color: var(--ink);
      font: 12px -apple-system, system-ui, sans-serif; outline: none;
    }
    /* (the × and group-dots are .pill .ctl spans — see the pill family above) */

    /* Chrome-style group: chip + member tabs ride on a soft tinted shape (no
       hard outline) so they read as one bound unit. Color set inline per group. */
    /* The group is a floating tinted card: chip + member tabs centered inside,
       with equal breathing room above the name and below the card. The 3px top
       inset (group 28 − chip 22, halved) is mirrored by margin-bottom: 3px so
       the terminal doesn't clip the card's bottom edge. Color set inline. */
    #tabs .group {
      display: inline-flex; align-items: center; gap: 4px; height: 28px;
      flex: none;   /* don't squeeze a group card either — scroll the strip */
      padding: 0 4px; border-radius: 7px; margin-bottom: 3px;
      /* the soft shape that binds a group's members; --gc set inline */
      background: color-mix(in srgb, var(--gc) var(--gc-wash-k), transparent);
    }
    /* reorder-by-drag: the lifted item (a group card OR an ungrouped tab)
       tracks the cursor (no transition so it doesn't lag), riding above its
       neighbors with a soft shadow. Neighbors carry a transition so they slide
       aside; the drop FLIP sets its own inline transition, so these only govern
       the live drag. .popping marks an ungrouped tab being dragged off the
       strip to pop into a pane — it fades to say "this is leaving". */
    #tabs .group.dragging, #tabs .tab.dragging {
      position: relative; z-index: 30; cursor: grabbing;
      box-shadow: 0 6px 16px rgba(var(--shadow), calc(.34 * var(--shadow-k))); transition: none;
    }
    #tabs .group.sliding, #tabs .tab.sliding { transition: transform .18s ease; }
    #tabs .group.popping, #tabs .tab.popping { opacity: .5; }
    /* grouped tabs are pills riding inside the card; the card centers them, so
       the strip-level bottom inset must go. A selected one fills with --bg (not
       --elevated) so it cuts through the tint and reads bound to the group. */
    #tabs .tab.grouped { height: 22px; margin-bottom: 0; }
    /* Popped-pane tabs carry their group's tint; .gon is the active one. In the
       strip the wash lives on the group card that binds the pills; a lone popped
       pill has no card, so it wears the card's own colour at the card's own
       strengths — same hue, same alphas, so leaving the strip never looks like
       leaving the group. The .ttab half is load-bearing: buildLeafTabs builds
       `ttab pill grouped`, never `tab`, so a `.tab.grouped` rule alone matched
       nothing and every popped pane came out grey. */
    .tab.grouped[style*="--gc"], .tile-tabs .ttab.grouped[style*="--gc"] {
      background: color-mix(in srgb, var(--gc) var(--gc-wash-k), transparent);
    }
    .tab.grouped.gon[style*="--gc"], .tile-tabs .ttab.grouped.gon[style*="--gc"] {
      background: color-mix(in srgb, var(--gc) var(--gc-wash-on-k), transparent);
    }
    #tabs .tab.grouped.active { background: var(--bg); }
    /* subagent subtree — a parent lane with its children riding just to its
       right, bound by a faint rail the way a group card binds its members.
       The wrapper inherits the parent's slot in the strip's drag order. */
    #tabs .subtree { display: inline-flex; align-items: center; gap: 3px; }
    #tabs .subtree .tab.child {
      height: 20px; margin-bottom: 5px; opacity: .82;
      /* a hairline rail on the left ties each child back to its parent */
      border-left: 2px solid color-mix(in srgb, var(--ink) 24%, transparent);
      border-top-left-radius: 3px; border-bottom-left-radius: 3px;
    }
    #tabs .subtree .tab.child .nm { font-size: 11px; }
    #tabs .subtree .tab.child.active { opacity: 1; }
    /* the fold pill a parent carries: caret + how many subagents hang off it.
       Click toggles the subtree; it sits between the name and the ctl icons. */
    #tabs .tab .kids {
      display: inline-flex; align-items: center; gap: 1px; margin: 0 3px 0 4px;
      padding: 0 4px; height: 15px; border-radius: 8px; cursor: pointer;
      font-size: 10px; font-weight: 600; line-height: 1;
      background: color-mix(in srgb, var(--ink) 13%, transparent);
      color: var(--ink-soft);
    }
    #tabs .tab .kids:hover { background: color-mix(in srgb, var(--ink) 22%, transparent); }
    #tabs .tab .kids .kcaret { display: inline-flex; }
    #tabs .tab .kids svg { width: 11px; height: 11px; display: block; }
    /* group header chip — the pill that names + collapses the group */
    #tabs .chip {
      display: inline-flex; align-items: center; gap: 6px; height: 22px;
      padding: 0 9px; border-radius: 6px; cursor: grab;
      white-space: nowrap; font-size: 11px; font-weight: 500; letter-spacing: .01em;
      /* --gc is the group's stored colour, set inline in buildChip. Deriving
         the wash and ink here (rather than baking hex+alpha in JS) means a
         theme flip restyles every existing group with no re-render. */
      background: color-mix(in srgb, var(--gc) var(--gc-wash-k), transparent);
      color: color-mix(in srgb, var(--gc) var(--gc-ink-k), var(--ink));
    }
    #tabs .group.dragging .chip { cursor: grabbing; }
    #tabs .chip .gnm { overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
    #tabs .chip .gcount {
      font-variant-numeric: tabular-nums; opacity: .7; padding-left: 1px;
    }
    #tabs .chip .gnmedit {
      width: 90px; padding: 0; margin: 0; background: transparent;
      border: none; border-bottom: 1px solid currentColor; color: inherit;
      font: 11px -apple-system, system-ui, sans-serif; outline: none;
    }
    /* sized + bottom-inset to match .group exactly so the + reads as a sibling
       of the group card: same 28px height and 3px margin-bottom means their
       centers and top/bottom edges line up under align-items: flex-end. */
    #tabs .add {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 7px; color: var(--ink-faint); font-size: 15px;
      cursor: default; flex: 0 0 28px; margin-bottom: 3px;
    }
    #tabs .add svg { display: block; }
    #tabs .add:hover { background: var(--elevated); color: var(--accent); }
    /* inline name field shown while creating a session — pill-shaped so it
       previews the tab it's about to become */
    #tabs .newname {
      width: 130px; height: 24px; box-sizing: border-box; padding: 0 8px;
      border-radius: 6px; margin-bottom: 5px;
      background: var(--bg); border: 1px solid var(--accent);
      color: var(--ink); font: 12px -apple-system, system-ui, sans-serif; outline: none;
    }

    /* + launcher — floats under the + button; what (Claude/Terminal), which
       workspace, where, and a name. Quiet labels, no accent-colored chrome:
       selection reads as raised buttons / the group's own color, not the rose. */
    #launcher {
      position: absolute; z-index: 60; width: 276px; box-sizing: border-box; padding: 12px;
      background: var(--surface); border: 1px solid var(--edge); border-radius: 10px;
      box-shadow: 0 10px 30px rgba(var(--shadow), calc(.4 * var(--shadow-k)));
      display: flex; flex-direction: column; gap: 10px;
      font: 12px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
    }
    /* Agent-handoff preview/confirm sheet — a centered modal over a backdrop.
       Reuses the launcher's .lab / .modes / .mode vocabulary for the engine
       picker so the two spawn surfaces read as one system. */
    #handoff-overlay {
      position: fixed; inset: 0; z-index: 95; display: flex;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    #handoff {
      width: 420px; max-width: calc(100vw - 40px); max-height: calc(100vh - 60px);
      overflow-y: auto; box-sizing: border-box; padding: 16px;
      background: var(--surface); border: 1px solid var(--edge); border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0,0,0,.5);
      display: flex; flex-direction: column; gap: 12px;
      font: 12px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
    }
    #handoff .htitle { font-size: 13px; font-weight: 600; color: var(--ink); }
    #handoff .hsub { font-size: 11px; color: var(--ink-faint); margin-top: -6px; }
    #handoff .lab {
      font-size: 9px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
      color: var(--ink-ghost); margin-bottom: 4px; user-select: none;
    }
    #handoff .modes { display: flex; gap: 3px; padding: 3px; border-radius: 8px; background: var(--bg); border: 1px solid var(--edge-soft); }
    #handoff .mode { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 26px; border-radius: 6px; cursor: default; color: var(--ink-faint); }
    #handoff .mode:hover { color: var(--ink-soft); }
    #handoff .mode.on { background: var(--elevated); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    #handoff .mode.disabled { opacity: .35; cursor: not-allowed; }
    #handoff .mode .cicon { display: inline-flex; color: #D97757; }
    #handoff textarea {
      width: 100%; box-sizing: border-box; min-height: 68px; resize: vertical;
      background: var(--bg); border: 1px solid var(--edge-soft); border-radius: 8px;
      padding: 8px; color: var(--ink); font: 12px ui-monospace, Menlo, monospace;
    }
    #handoff .toggles { display: flex; flex-direction: column; gap: 2px; }
    #handoff .tog { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
    #handoff .tog:hover { background: var(--bg); }
    #handoff .tog input { margin: 0; accent-color: var(--accent); }
    #handoff .tog .tname { color: var(--ink); }
    #handoff .tog .tnote { color: var(--ink-faint); font-size: 11px; margin-left: auto; }
    #handoff .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
    #handoff button {
      height: 28px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--edge);
      background: var(--elevated); color: var(--ink); font: 12px -apple-system, system-ui, sans-serif; cursor: pointer;
    }
    #handoff button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    #handoff button:hover { filter: brightness(1.08); }
    #launcher .lab {
      font-size: 9px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
      color: var(--ink-ghost); margin-bottom: 4px; user-select: none;
    }
    /* segmented what-picker: a recessed track; the chosen mode is a raised button */
    #launcher .modes {
      display: flex; gap: 3px; padding: 3px; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--edge-soft);
    }
    #launcher .mode {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 26px; border-radius: 6px; cursor: default; color: var(--ink-faint);
    }
    #launcher .mode:hover { color: var(--ink-soft); }
    #launcher .mode.on { background: var(--elevated); color: var(--ink); box-shadow: 0 1px 3px rgba(var(--shadow), calc(.3 * var(--shadow-k))); }
    #launcher .mode svg { display: block; }
    #launcher .mode .cicon { display: inline-flex; color: #D97757; }  /* Claude spark keeps its coral */
    /* engine chip for an engine NOT detected on this machine: muted, not
       clickable, tooltip explains. Pre-empts "Codex tab that's actually a
       bare shell because codex isn't installed." */
    #launcher .mode.disabled { opacity: .35; cursor: not-allowed; }
    #launcher .mode.disabled:hover { color: var(--ink-faint); }
    /* OpenAI Codex mark is solid black-on-transparent. On the dark base theme
       force it pure white; only flip back to black when the theme is actively
       light. The previous rule used :not([data-theme="dark"]) standalone, which
       matched when no theme attribute was set at all (the default boot state)
       and broke the dark-mode render. */
    .cicon-codex img { filter: brightness(0) invert(1); }
    :root[data-theme="light"] .cicon-codex img { filter: none; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .cicon-codex img { filter: none; }
    }
    /* workspace chips — the selected one borders in its group's color (set inline) */
    #launcher .gchips { display: flex; flex-wrap: wrap; gap: 4px; }
    #launcher .gchip {
      display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px;
      border-radius: 11px; background: var(--bg); border: 1px solid var(--edge-soft);
      color: var(--ink-faint); cursor: default; font-size: 11px;
    }
    #launcher .gchip:hover { background: var(--elevated); color: var(--ink-soft); }
    #launcher .gchip.on { background: var(--elevated); border-color: var(--edge); color: var(--ink); }
    /* the + chip reads quieter than real workspaces — a doorway, not a choice */
    #launcher .gchip.add { color: var(--ink-ghost); padding: 0 9px; }
    #launcher .gchip.add:hover { color: var(--ink); }
    #launcher .gchip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    /* the chosen workspace's description — appears only when there is one */
    #launcher .gdesc {
      font-size: 10.5px; color: var(--ink-ghost); line-height: 1.35; margin-top: 5px;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    #launcher input {
      width: 100%; height: 28px; box-sizing: border-box; padding: 0 8px; border-radius: 7px;
      background: var(--bg); border: 1px solid var(--edge-soft); color: var(--ink);
      font: 12px -apple-system, system-ui, sans-serif; outline: none;
    }
    #launcher input:focus { border-color: var(--ink-faint); }
    #launcher input.where { font: 11px ui-monospace, Menlo, monospace; color: var(--ink-soft); }
    /* folder-launched "spawn in" chip: a read-only folder pill echoing the tree */
    #launcher .lwhere {
      display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
      border-radius: 7px; background: var(--bg); border: 1px solid var(--edge-soft);
      color: var(--ink-soft); font-size: 12px; max-width: 100%;
    }
    #launcher .lwhere svg { flex: 0 0 auto; color: var(--ink-faint); }
    #launcher .lwhere span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #launcher .hint { color: var(--ink-faint); font-size: 11px; padding-left: 2px; }

    /* (The first-run engine modal has been retired. The chip picker is now
       inline on the welcome surface — see #welcome .engine-pick above. The
       welcome screen owns "starting from zero" and the engine choice is one
       more thing settled there, not a popup that hides it.) */

    /* group/session context menu — floats over everything, native-feeling.
       Hosted in #toplayer (pointer-events:none) so it paints above #termlayer;
       re-enable hits on the menu itself or every item is unclickable. */
    #gmenu {
      position: absolute; z-index: 50; min-width: 168px; padding: 4px; pointer-events: auto;
      background: var(--surface); border: 1px solid var(--edge); border-radius: 6px;
      box-shadow: 0 6px 22px rgba(var(--shadow), calc(.45 * var(--shadow-k)));
      font: 12px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
      user-select: none;
    }
    #gmenu .item {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      border-radius: 4px; cursor: default; white-space: nowrap;
    }
    #gmenu .item:hover { background: var(--elevated); color: var(--ink); }
    #gmenu .sep { height: 1px; margin: 4px 6px; background: var(--edge); }
    /* gesture twin on a menu item ("double-click", "drag tab out") — dim and
       right-aligned, so the menu quietly teaches its own shortcuts */
    #gmenu .item .kbd { margin-left: auto; padding-left: 14px; color: var(--ink-ghost); font-size: 10px; }
    #gmenu .item .sw { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
    #gmenu .item.dim { color: var(--ink-faint); }
    /* wrap so the full-wheel palette stays a compact grid (~6 per row) */
    #gmenu .swrow { display: flex; flex-wrap: wrap; gap: 7px; padding: 7px 9px 5px; max-width: 176px; }
    #gmenu .swatch {
      width: 16px; height: 16px; border-radius: 50%; cursor: default;
      border: 2px solid transparent; box-sizing: content-box;
    }
    #gmenu .swatch:hover { border-color: var(--ink-ghost); }
    #gmenu .swatch.on { border-color: var(--ink); }

    /* ── worktree close prompt ─────────────────────────────────────────
       Shown when a finished auto-worktree can't settle itself (merge
       conflict, uncommitted changes, or the "always ask" policy). Built in
       JS (like #gmenu / #launcher); offers merge / keep branch / discard.
       Esc dismisses without touching anything — the branch and worktree
       stay on disk for git to handle by hand. */
    #wtask {
      position: fixed; inset: 0; z-index: 90; display: flex;
      align-items: center; justify-content: center; background: var(--scrim);
    }
    #wtask .panel {
      width: 440px; background: var(--surface); border: 1px solid var(--edge);
      border-radius: 10px; box-shadow: 0 18px 60px rgba(var(--shadow), calc(.5 * var(--shadow-k))); padding: 16px 18px;
      font: 13px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
    }
    #wtask .t { font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    #wtask .why { font-size: 12px; color: var(--ink-faint); line-height: 1.5; margin-bottom: 10px; }
    #wtask .meta {
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-faint);
      background: var(--bg); border: 1px solid var(--edge-soft); border-radius: 6px;
      padding: 7px 10px; margin-bottom: 14px; line-height: 1.6;
    }
    #wtask .meta b { color: var(--ink-soft); font-weight: 500; }
    #wtask .row { display: flex; gap: 8px; justify-content: flex-end; }
    #wtask button {
      font: 12px -apple-system, system-ui, sans-serif; padding: 6px 12px; border-radius: 7px;
      border: 1px solid var(--edge); background: var(--surface); color: var(--ink-soft); cursor: pointer;
    }
    #wtask button:hover { background: var(--elevated); color: var(--ink); }
    #wtask button.primary { border-color: var(--accent); color: var(--accent); }
    #wtask button.primary:hover { background: var(--accent); color: var(--bg); }
    #wtask button.danger { color: var(--rose); }
    #wtask button.danger:hover { background: var(--rose); border-color: var(--rose); color: var(--bg); }
    #wtask .out { font-size: 11.5px; color: var(--rose); margin-top: 10px; min-height: 14px; }

    /* Learn-the-voice proposal. Non-blocking: no scrim (the user keeps working),
       a card docked bottom-center that slides up when Spike has distilled a new
       DO/DON'T from how they edit. Confirm merges into the workspace voice; Not
       now records a dismissal so it won't re-propose. */
    #voiceask {
      position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 160%);
      z-index: 92; width: 460px; max-width: calc(100vw - 32px);
      background: var(--surface); border: 1px solid var(--edge); border-radius: 12px;
      box-shadow: 0 20px 60px rgba(var(--shadow), calc(.55 * var(--shadow-k)));
      padding: 16px 18px 15px; font: 13px -apple-system, system-ui, sans-serif;
      color: var(--ink-soft); transition: transform .42s cubic-bezier(.2,.8,.2,1);
      pointer-events: auto;
    }
    #voiceask.show { transform: translate(-50%, 0); }
    #voiceask .tag {
      font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
      color: var(--tan-deep); font-weight: 700; margin-bottom: 8px;
    }
    #voiceask .t { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px; }
    #voiceask .items { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    #voiceask .vi { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; line-height: 1.4; color: var(--ink-soft); }
    #voiceask .vi .k {
      flex: 0 0 auto; width: 34px; text-align: center; font-size: 9.5px; font-weight: 700;
      letter-spacing: .06em; padding: 2px 0; border-radius: 5px; margin-top: 1px;
    }
    #voiceask .vi .k.do { color: var(--sage-deep); background: color-mix(in srgb, var(--sage) 22%, transparent); }
    #voiceask .vi .k.dont { color: var(--rose-deep); background: color-mix(in srgb, var(--rose) 20%, transparent); }
    #voiceask .row { display: flex; gap: 8px; justify-content: flex-end; }
    #voiceask button {
      font: 12px -apple-system, system-ui, sans-serif; padding: 6px 14px; border-radius: 7px;
      border: 1px solid var(--edge); background: var(--surface); color: var(--ink-soft); cursor: pointer;
    }
    #voiceask button:hover { background: var(--elevated); color: var(--ink); }
    #voiceask button.primary { border-color: var(--accent); color: var(--accent); }
    #voiceask button.primary:hover { background: var(--accent); color: var(--bg); }

    /* Install gate (template marketplace). The trust surface: every import is
       reviewed here before anything applies. Risk-tiered — declarative safe,
       executable opt-in, high-risk off by default with the exact command shown. */
    #gate {
      position: fixed; inset: 0; z-index: 90; display: flex;
      align-items: center; justify-content: center; background: var(--scrim);
    }
    #gate .panel {
      width: 540px; max-height: 80vh; overflow: auto; background: var(--surface);
      border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 18px 60px rgba(var(--shadow), calc(.5 * var(--shadow-k)));
      padding: 16px 18px; font: 13px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
    }
    #gate .t { font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    #gate .sub { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 10px; }
    #gate .scope {
      display: inline-block; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 1px 7px; border-radius: 5px; border: 1px solid var(--edge-soft);
      color: var(--ink-soft); background: var(--bg);
    }
    #gate .scope.global { color: var(--rose); border-color: var(--rose); }
    #gate .reject {
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--rose);
      background: var(--bg); border: 1px solid var(--rose); border-radius: 6px;
      padding: 8px 10px; margin-bottom: 12px; line-height: 1.6; white-space: pre-wrap;
    }
    #gate .tier { border: 1px solid var(--edge-soft); border-radius: 7px; padding: 8px 10px; margin-bottom: 10px; }
    #gate .tier > header {
      display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .04em;
      text-transform: uppercase; color: var(--ink-faint); cursor: pointer; user-select: none;
    }
    #gate .tier.risk > header { color: var(--rose); }
    #gate .tier .items { margin-top: 6px; }
    #gate .tier .item { padding: 4px 0; border-top: 1px solid var(--edge-soft); }
    #gate .tier .item:first-child { border-top: none; }
    #gate .tier .item .lbl { color: var(--ink); }
    #gate .tier .item .det {
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-faint);
      word-break: break-all; margin-top: 2px;
    }
    #gate .note { font-size: 11px; color: var(--ink-faint); font-style: italic; margin: 2px 0 8px; }
    #gate .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    #gate button {
      font: 12px -apple-system, system-ui, sans-serif; padding: 6px 12px; border-radius: 7px;
      border: 1px solid var(--edge); background: var(--surface); color: var(--ink-soft); cursor: pointer;
    }
    #gate button:hover { background: var(--elevated); color: var(--ink); }
    #gate button.primary { border-color: var(--accent); color: var(--accent); }
    #gate button.primary:hover { background: var(--accent); color: var(--bg); }
    #gate button:disabled { opacity: .4; cursor: default; }
    #gate .out { font-size: 11.5px; color: var(--rose); margin-top: 8px; min-height: 14px; }

    /* terminal area: every session's xterm stacks here, only one shown */
    #terms { flex: 1 1 auto; position: relative; min-height: 0; background: var(--bg); }
    /* the column's empty state (every session popped into its own pane):
       a quiet explanation instead of bare background, with the one-click
       way home. Toggled by syncColActive. */
    #colEmpty {
      position: absolute; inset: 0; z-index: 1; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 7px;
      padding: 0 28px; text-align: center; user-select: none;
      color: var(--ink-faint); font: 12.5px -apple-system, system-ui, sans-serif;
    }
    #colEmpty.show { display: flex; }
    #colEmpty .hint { color: var(--ink-ghost); font-size: 11px; }
    #colEmpty .back { margin-top: 6px; color: var(--accent); font-size: 11.5px; cursor: pointer; }
    #colEmpty .back:hover { text-decoration: underline; }
    /* hide the xterm viewport scrollbar — scrollback still works by wheel/keys */
    #termlayer ::-webkit-scrollbar { width: 0; height: 0; }
    #termlayer .xterm-viewport { scrollbar-width: none; }

    /* ── terminal overlay layer ──────────────────────────────────────────
       #termlayer is a sibling of <body> under <html>, so it escapes the chrome's
       CSS zoom: every xterm renders at true 1.0 scale (sharp text, honest mouse
       coords, scrollable to the true bottom) and is sized only by its fontSize.
       Panes float here and are positioned over the layout's `.termslot` boxes by
       syncTermLayer(); the layer is click-through except where a pane sits. */
    #termlayer { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0; transition: opacity .18s ease; }
    /* revealed by syncTermLayer once the first pane is positioned + fitted, so the
       terminal fades in at its correct size instead of flashing/jumping on boot. */
    #termlayer.ready { opacity: 1; }
    #termlayer .pane {
      position: absolute; pointer-events: auto; box-sizing: border-box;
      display: none;   /* shown + placed by syncTermLayer */
      /* No padding here on purpose: FitAddon measures this element's height but
         only subtracts the *terminal's own* padding, so padding on .pane is
         double-counted — it sizes xterm ~1.5 rows too tall and the last line
         hides behind the footer. The breathing room is applied as a geometry
         inset in syncTermLayer() instead (PANE_INSET), handing FitAddon a
         padding-free box. */
    }
    /* image drag hovering over the terminal — soft inset accent ring */
    #termlayer .pane.dropping { box-shadow: inset 0 0 0 2px var(--blue); border-radius: 6px; }
    /* #termlayer paints above <body>, so a body-level covering overlay (palette,
       settings, context menu) would be occluded by it — drop the layer while one
       is open. And during a splitter drag, let the drag-shield capture through. */
    html.overlay-open #termlayer { visibility: hidden; }
    html.dragging #termlayer .pane { pointer-events: none; }
    /* Popup-menu host: a body sibling appended AFTER #termlayer, so its menus
       paint above the terminal (which itself out-stacks the zoomed body). The
       layer is click-through; only the menu inside it (pointer-events:auto by
       default) catches clicks. This is what lets a right-click menu show over
       the terminal without hiding it. */
    #toplayer { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
    /* placeholders the panes track; transparent — the floating pane covers them.
       Tile slots carry .tile-leaf-body too and flex-fill their leaf; the shared
       column's slot fills #terms (which is position:relative). */
    .termslot { background: transparent; }
    #terms > .termslot { position: absolute; inset: 0; }

    /* ── welcome / empty state ─────────────────────────────────────────
       Fills the terminal area before any project is open. Calm and warm,
       on var(--bg); the "choose folder" button is the one bright accent. */
    #welcome {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0;
      background: var(--bg); z-index: 5; user-select: none;
    }
    /* the bare app glyph (transparent PNG, no badge box) paired with the
       wordmark as a logo lockup. A touch under full white so it doesn't glare.
       During project load (`#welcome.loading`) the mark rotates continuously
       as a hand-rolled spinner — same affordance as the landing-page hover
       (rotate(90deg) on hover), looped. */
    #welcome #welcomeLogo {
      width: 44px; height: 44px; object-fit: contain; margin-bottom: 16px; opacity: .94;
      filter: invert(var(--mark-invert));
      transition: transform 700ms cubic-bezier(0.2, 0.6, 0.2, 1);
      transform-origin: center;
    }
    @keyframes spike-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    #welcome.loading #welcomeLogo {
      animation: spike-spin 1.4s linear infinite;
      transition: none;   /* the loop owns transform; clear the static transition */
    }
    /* during load, keep the brand readable but dim the interactive bits so the
       page doesn't look re-clickable while we're already opening. */
    #welcome.loading .engine-pick,
    #welcome.loading .choose { opacity: .45; pointer-events: none; }
    #welcome .mark {
      font: 400 34px ui-serif, Georgia, "Times New Roman", serif;
      letter-spacing: -.01em; color: var(--ink); margin-bottom: 10px;
    }
    /* slogan reads as the wordmark's subtitle (tight above), with a clear,
       intentional gap below before the action */
    #welcome .tag {
      font: 13px -apple-system, system-ui, sans-serif; color: var(--ink-faint);
      letter-spacing: .08em; margin-bottom: 32px;
    }
    /* first-run engine picker on welcome: reuses the launcher's chip language
       (.modes / .mode) so this isn't a new visual vocabulary — same recessed
       track, raised selected chip. Shown only when both engines are detected
       and the user hasn't picked yet (app.ts toggles display). */
    #welcome .engine-pick {
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      margin-bottom: 22px; user-select: none;
    }
    #welcome .engine-pick .hint {
      font: 600 9px -apple-system, system-ui, sans-serif;
      letter-spacing: .09em; text-transform: uppercase; color: var(--ink-ghost);
    }
    #welcome .engine-pick .modes {
      display: flex; gap: 4px; padding: 4px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--edge-soft);
    }
    #welcome .engine-pick .mode {
      display: flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 16px; border-radius: 7px;
      cursor: default; color: var(--ink-faint);
      font: 13px -apple-system, system-ui, sans-serif;
      transition: background .12s, color .12s;
    }
    #welcome .engine-pick .mode:hover { color: var(--ink); }
    #welcome .engine-pick .mode.on { background: var(--elevated); color: var(--ink); box-shadow: 0 1px 3px rgba(var(--shadow), calc(.3 * var(--shadow-k))); }
    #welcome .engine-pick .mode .cicon { display: inline-flex; color: #D97757; }
    /* "no engines detected" hint — shown when neither Claude nor Codex is on
       PATH. Calm, informational, not alarming; never blocks the action. */
    #welcome .no-engines {
      max-width: 320px; text-align: center; margin-bottom: 22px;
      color: var(--ink-faint); font: 12px -apple-system, system-ui, sans-serif; line-height: 1.5;
    }
    #welcome .no-engines .hint-sub {
      display: block; margin-top: 6px; font-size: 11px; color: var(--ink-ghost);
    }
    #welcome .no-engines a { color: var(--ink-soft); border-bottom: 1px solid var(--edge-soft); }
    #welcome .no-engines a:hover { color: var(--ink); border-color: var(--edge); }
    /* primary action: text only — no background, no border. The chip picker
       above is the page's one "container" element; the button shouldn't
       compete for chrome. The arrow gives "go" affordance; hover slides it
       a hair right and brightens the ink so it reads as actionable. */
    #welcome .choose {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 4px; border: none; background: transparent; cursor: pointer;
      color: var(--ink-soft);
