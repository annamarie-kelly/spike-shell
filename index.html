      font: 500 14px -apple-system, system-ui, sans-serif;
      transition: color .12s;
    }
    #welcome .choose::after {
      content: '→'; color: var(--ink-faint); transition: transform .15s, color .12s;
      font-weight: 400;
    }
    #welcome .choose:hover { color: var(--ink); }
    #welcome .choose:hover::after { color: var(--ink-soft); transform: translateX(3px); }
    /* faint hint in the empty tree rail before a project is chosen */
    #tree .hint { color: var(--ink-ghost); padding: 8px 10px; font-size: 11px; }
    /* a clicked file row reads as selected — same warm lift as hover, held. */
    #tree .row.file.selected { background: var(--elevated); color: var(--ink); }
    #tree .row.sel { background: var(--elevated); box-shadow: inset 0 0 0 1px var(--accent); }
    /* the row being renamed / created shows a single accent ring — the input
       itself is borderless so there's no box-in-box. */
    #tree .row.creating { background: var(--elevated); box-shadow: inset 0 0 0 1px var(--accent); }
    #tree .row:focus { outline: none; }
    #tree .renamebox {
      flex: 1; min-width: 0; font: inherit; color: var(--ink); line-height: inherit;
      background: transparent; border: none; border-radius: 0;
      padding: 0; margin: 0; outline: none;
    }
    /* single + on a folder row: opens the new file/folder menu. Hidden until the
       row is hovered or selected; the file-count yields room when shown. */
    #tree .rowact { margin-left: auto; display: none; align-items: center; }
    #tree .row:hover .rowact, #tree .row.sel .rowact { display: inline-flex; }
    #tree .row:hover .count, #tree .row.sel .count { display: none; }
    /* the + (cropped glyph, so the hover box hugs it and the right edge lines up
       with the row counts — no overflow). */
    #tree .ract {
      width: 18px; height: 18px; margin-right: -4px; border-radius: 4px; color: var(--ink-faint);
      display: inline-flex; align-items: center; justify-content: center; cursor: default;
    }
    #tree .ract:hover { background: var(--edge); color: var(--ink); }
    /* drop target while dragging a tree item onto a folder / the root */
    #tree .dropinto { background: var(--elevated); box-shadow: inset 0 0 0 1px var(--accent); }
    /* tree menus (the + create menu and the right-click menu) — same look as the
       tab-group menu (#gmenu) for uniformity. */
    .spikemenu {
      /* hosted in #toplayer (pointer-events:none) — re-enable hits on the menu
         itself, else items inherit none and clicks fall through (dead menu). */
      pointer-events: auto;
      position: absolute; z-index: 50; min-width: 168px; padding: 4px;
      background: var(--surface); border: 1px solid var(--edge); border-radius: 6px;
      box-shadow: 0 6px 22px rgba(var(--shadow), calc(.45 * var(--shadow-k)));
      font: 12px -apple-system, system-ui, sans-serif; color: var(--ink-soft); user-select: none;
    }
    .spikemenu .item {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      border-radius: 4px; cursor: default; white-space: nowrap;
    }
    .spikemenu .item:hover { background: var(--elevated); color: var(--ink); }
    .spikemenu .item.danger { color: var(--rose); }
    .spikemenu .item.danger:hover { background: var(--rose); color: #fff; }
    .spikemenu .sep { height: 1px; margin: 4px 6px; background: var(--edge); }

    /* ── preview / editor panel ────────────────────────────────────────
       A third surface on the right of #wrap: tree | terminals | preview.
       Hidden until a file is clicked. A thin divider lets it be dragged.
       Everything reads from theme vars so it works in light + dark. */
    /* ── tiling layout ──────────────────────────────────────────────────
       #tileroot holds the generated split/leaf scaffold (see renderLayout in
       app.ts). A split is a flex row/col of cells; a leaf is a column holding
       one surface (the terminal column #termcol, or the preview). Cell sizes
       ride on each child's inline flex-grow (fractional weights); a splitter
       drags those weights. Every box carries min-width/height:0 so a wide
       xterm can't blow out the flex track. */
    #tileroot { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; }
    .tile-split { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; }
    .tile-split.row { flex-direction: row; }
    .tile-split.col { flex-direction: column; }
    .tile-leaf { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .tile-leaf > #termcol, .tile-leaf > .preview { flex: 1 1 auto; min-width: 0; min-height: 0; }
    /* a splitter between two cells; 5px on the parent split's main axis. The
       resize cursor follows the split direction (row split → drag horizontally). */
    .tile-splitter { flex: 0 0 5px; background: var(--edge); z-index: 2; }
    .tile-splitter.row { cursor: col-resize; }
    .tile-splitter.col { cursor: row-resize; }
    .tile-splitter:hover { background: var(--accent); }
    /* drag-to-dock: leaves anchor the drop highlight; popped session panes get
       a positioned body box (panes are position:absolute, see #terms .pane). */
    .tile-leaf { position: relative; }
    .tile-leaf-body { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; }
    .tile-leaf-body > .pane { display: block; position: absolute; inset: 0; padding: 12px 14px 10px; }
    /* per-leaf tab bar: shown on stacks and popped-out terminals. Each tab
       switches the stack; dragging one re-docks that surface elsewhere.
       Its geometry is #tabs', to the pixel — 34px content + 6px top pad + 1px
       border, pills aligned flex-end. A pane dragged out of the strip is the
       same tab it always was, so its bar sits on the same horizontal line as
       the strip it left; at 28px and centered it rode visibly high and the two
       read as two different kinds of thing. Keep the two rules in step. */
    .tile-tabs {
      flex: 0 0 34px; display: flex; align-items: flex-end; gap: 4px; padding: 6px 8px 0;
      background: var(--surface-soft); border-bottom: 1px solid var(--edge);
      user-select: none;
    }
    /* leaf pills share the .pill family wholesale, at the strip tab's exact
       height and bottom inset. Drag-cursor because every one is a re-dock
       handle. The trailing × (close split / close preview) tightens the right
       padding; .pill.on .ctl.x keeps it visible on the active pill so a popped
       pane always shows its way out. */
    .tile-tabs .ttab {
      height: 22px; margin-bottom: 5px; padding: 0 6px 0 11px;
      max-width: 220px; cursor: grab;
    }
    /* drop-zone highlight (inside the hovered leaf) + the label chasing the cursor */
    .dockhl {
      position: absolute; z-index: 60; pointer-events: none; border-radius: 4px;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      border: 1.5px solid var(--accent);
      transition: left .07s ease, right .07s ease, top .07s ease, bottom .07s ease;
    }
    .dockghost {
      position: fixed; z-index: 10001; pointer-events: none;
      padding: 3px 10px; border-radius: 5px;
      background: var(--elevated); border: 1px solid var(--edge); color: var(--ink);
      font: 11px -apple-system, system-ui, sans-serif;
      box-shadow: 0 4px 14px rgba(var(--shadow), calc(.25 * var(--shadow-k)));
    }

    #termcol { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    /* resizer between the file tree and the terminal area (always present) */
    #treedivide {
      flex: 0 0 5px; width: 5px; cursor: col-resize; background: transparent;
      margin-left: -3px; z-index: 2;
    }
    #treedivide:hover { background: var(--accent); }
    /* covers the viewport during a divider drag so iframes/terminal can't
       swallow the mouseup (which left the divider stuck to the cursor). The
       cursor is set inline per drag (col- or row-resize). */
    .dragshield { position: fixed; inset: 0; z-index: 9999; cursor: col-resize; }
    .preview {
      display: none; position: relative;   /* anchors the comment chip/composer */
      flex-direction: column; min-height: 0;
      background: var(--surface-soft);
      opacity: 0; transition: opacity .15s ease;   /* fade in/out (see .shown) */
    }
    .preview.open { display: flex; }
    .preview.shown { opacity: 1; }
    /* height matches #tabs total (34 + 6 top-pad + 1 border) so the bottom line
       aligns with the terminal tab strip's. --surface-soft, not --surface, for
       the same reason: it shares that row with #tabs. --surface is for the
       window's own chrome bands (#bar, #footer) and floating cards; every
       in-pane strip (#tree, .spanel, #tabs, .tile-tabs) is soft, so a --surface
       .pvhead read as a lighter patch spliced into the strip. */
    .pvhead {
      display: flex; align-items: center; gap: 8px; height: 40px; flex: 0 0 40px;
      padding: 0 8px; background: var(--surface-soft); border-bottom: 1px solid var(--edge);
      font: 12px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
      /* -webkit- prefix too: this WebKit build still word-selects a tab label on
         double-click without it (→ native Look Up menu). */
      -webkit-user-select: none; user-select: none;
    }
    /* Browsing a live URL: the file-tab strip gives way entirely — the browser's
       livebar becomes the pane's top line, and the open docs fold behind its 📄
       toggle. (Only for real URLs; a local .html in browser mode keeps its tab.) */
    .pvhead.browsing { display: none; }
    .pvhead .pvname {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--ink); flex: 0 1 auto; min-width: 0;
    }
    /* source / rendered toggle: bare icon buttons — no box, a little gap, so
       it reads breathable.
       margin-left:auto keeps it (and the save flag) right of the doc pills. */
    /* The pane's control cluster, pinned right: notes / edit / view-segment read
       as one group at the segment's own 2px rhythm. The header's 8px gap applies
       BETWEEN groups (tabs, save pill, this) — not inside this one. */
    .pvhead .pvctl { display: inline-flex; align-items: center; flex: 0 0 auto; margin-left: auto; gap: 2px; }
    .pvhead .seg { display: inline-flex; flex: 0 0 auto; gap: 2px; }
    .pvhead .seg .opt {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 24px; border-radius: 5px; color: var(--ink-faint); cursor: pointer;
    }
    .pvhead .seg .opt svg { display: block; }
    .pvhead .seg .opt:hover { background: var(--elevated); color: var(--ink); }
    .pvhead .seg .opt.on { background: var(--elevated); color: var(--ink); }
    .pvhead .pvsave {
      display: none; align-items: center; gap: 5px; flex: 0 0 auto;
      color: var(--ink-faint); font-size: 11px; font-variant-numeric: tabular-nums;
      cursor: default;
    }
    .pvhead .pvsave.show { display: inline-flex; }   /* only while dirty / just-saved */
    .pvhead .pvsave .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      display: none;
    }
    .pvhead .pvsave.dirty { color: var(--ink-soft); }
    .pvhead .pvsave.dirty .dot { display: inline-block; }
    .pvhead .pvsave:hover { color: var(--ink); }
    /* Doc pills — every doc renders as a .pill, the single-file case included,
       so the header IS the tab bar (no separate name + × mode). flex 0 1 auto
       lets a crowded strip squeeze pills before scrolling. */
    .pvhead .pvtabs { display: flex; align-items: center; gap: 4px; flex: 1 1 auto; min-width: 0; overflow-x: auto; }
    .pvhead .pvtabs::-webkit-scrollbar { height: 0; }
    /* Names ellipsize only when they genuinely don't fit. Dropping the old
       fixed 220px cap is the point: a lone doc now gets the whole strip, so the
       common case reads in full. Crowding is still handled by flex shrink
       (basis is content width, so longer pills give up more), which is the
       "we have to" case. Full name is always on the pill's title tooltip
       (makeTabChip, app.ts). Deliberately NOT floored with min-width — that
       applies unconditionally and would pad short names out to the floor.
       `max-width: none` is load-bearing: .pill sets a 200px cap of its own, so
       merely dropping this rule's cap leaves the pill stuck at ~219px. */
    .pvhead .pvtab { flex: 0 1 auto; min-width: 0; max-width: none; }
    /* the lone ephemeral (recyclable) tab reads italic, like an editor preview
       tab; pinning it (the hover pin .ctl) promotes it to a held doc. */
    .pvhead .pvtab.ephemeral .nm { font-style: italic; }
    /* dirty marker: its own flex item (makeTabChip), so a squeezed .nm ellipsizes
       the name without taking the dot down with it. */
    .pvhead .pvtab .dirt { flex: none; margin-left: -2px; color: var(--accent); }
    /* Lane ownership: a doc opened by an agent lane wears its group's color the
       SAME way the terminal group chip does (app.ts renderGroup: a soft wash of
       the color, ~13% alpha), so a preview reads as kin to its lane's tab group
       rather than a louder solid accent. User-opened / claimed docs have no
       --lane and stay neutral. */
    .pvhead .pvtab.lane { background: color-mix(in srgb, var(--lane) 13%, transparent); }
    .pvhead .pvtab.lane:hover { background: color-mix(in srgb, var(--lane) 20%, transparent); }
    .pvhead .pvtab.lane.active { background: color-mix(in srgb, var(--lane) 22%, transparent);
                                 border-color: color-mix(in srgb, var(--lane) 42%, transparent); color: var(--ink); }
    /* The owning lane's tab closed: the doc dims but stays readable until the
       user moves on and it evicts. */
    .pvhead .pvtab.orphaned { opacity: 0.5; }
    .pvhead .pvtab.orphaned:hover { opacity: 0.75; }
    /* Coalesced orphans from one closed lane — a single quiet pill ("N from
       <lane>") that expands to its members on click. */
    .pvhead .pvtab.cluster { font-style: italic; cursor: pointer; }

    /* the body swaps between the highlighted editor and the rendered view */
    .pvbody { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
    /* Highlighted editor: a colored <pre> backdrop with a transparent textarea
       on top. They share identical metrics so the caret lands on the glyphs.
       Editing stays colored because the backdrop re-highlights on every input. */
    .pveditwrap { position: absolute; inset: 0; display: none; background: var(--bg); }
    .pveditwrap.show { display: block; }
    .pvhl, .pveditor {
      margin: 0; box-sizing: border-box; padding: 16px 26px;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      tab-size: 2; white-space: pre; word-wrap: normal;
      position: absolute; inset: 0; overflow: auto;
      /* keep the wheel gesture latched to this scroller — under CSS zoom,
         chaining to the non-scrolling body is what makes scroll "stick". */
      overscroll-behavior: contain;
    }
    .pvhl { color: var(--ink); pointer-events: none; z-index: 0; }
    .pvhl code { font: inherit; }
    .pveditor {
      resize: none; border: none; outline: none; background: transparent;
      color: transparent; -webkit-text-fill-color: transparent;
      caret-color: var(--accent); z-index: 1;
    }
    .pveditor::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
    .pvrender {
      position: absolute; inset: 0; display: none; overflow: auto;
      background: var(--bg); color: var(--ink);
      overscroll-behavior: contain;
    }
    .pvrender.show { display: block; }

    /* ── WYSIWYG markdown editing ─────────────────────────────────────────
       Entering edit mode (the floating pencil, or ⌘E) makes .pvrender itself
       contenteditable and merges the formatting tools INTO the pane header — one
       row, not a second strip. Finish by clicking the 👁 (rendered) toggle that
       already lives in that row, or ⌘E. On exit the DOM is serialized back to
       markdown (turndown) and the box repaints read-only. Highlights use the
       range-based Custom Highlight API, so they survive editing untouched. */
    .pvtoolbar {
      display: none; align-items: center; gap: 3px; flex: 1 1 auto; min-width: 0;
      /* `safe center`: centered when the tools fit, but falls back to start-aligned
         (scrollable) when the pane is narrow — so the ends never clip off-screen. */
      justify-content: safe center; overflow-x: auto; scrollbar-width: none;
      user-select: none;
    }
    .pvtoolbar::-webkit-scrollbar { height: 0; }
    /* The set is sized to fit, but a pane can be dragged narrower than anything
       we planned for. When it genuinely overflows (syncToolbarOverflow measures),
       fade the trailing edge — a row that clips with no scrollbar and no fade is
       a row that lies about what it holds, which is how eight of these buttons
       stayed invisible. */
    .pvtoolbar.clipped { mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent 100%); }
    /* shown only in edit mode; the header holds it (see enterEdit relocation) */
    .pvhead.editing .pvtoolbar { display: flex; }
    /* Editing is a focused, one-doc mode: collapse the tab strip to just the doc
       you're editing (hide the other pills) so it stops pushing the tools over.
       The others come back the moment you finish.
       The lopsided shrink factor decides who loses when the row is tight, and it
       has to be the filename: a name that ellipsizes is still a name, while a
       tool pushed past the edge is simply gone. min-width keeps enough pill to
       stay clickable and show the dirty dot. */
    .pvhead.editing .pvtabs { flex: 0 200 auto; min-width: 96px; }
    .pvhead.editing .pvtabs .pvtab:not(.active) { display: none; }
    /* Explicit "Done" — a quiet exit sitting right by the saved/unsaved indicator
       (where you look to finish). Commits + returns to reading; ⌘E and 👁 also
       exit. Deliberately understated (not an accent blob) so it reads as chrome. */
    .pvhead .pvdone {
      display: none; align-items: center; gap: 5px; flex: 0 0 auto;
      height: 26px; padding: 0 11px; border-radius: 7px;
      border: 1px solid var(--edge); background: var(--surface-soft); color: var(--ink);
      cursor: pointer; font: 500 12px -apple-system, system-ui, sans-serif;
    }
    .pvhead.editing .pvdone { display: inline-flex; }
    .pvhead .pvdone:hover { background: var(--elevated); }
    .pvhead .pvdone svg { color: var(--accent); }
    /* The glyph doubles as the save state: a check when the doc is clean, an
       accent dot when it isn't. Same 14px box either way, so the button never
       reflows as you type. Swapped with opacity + an absolutely-placed dot, NOT
       `display:none` — icon() writes an inline `style="display:block"` on every
       svg it builds, and an inline style beats any selector we could write. */
    .pvhead .pvdone .mark {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px;
    }
    .pvhead .pvdone.dirty .mark svg { opacity: 0; }
    .pvhead .pvdone.dirty .mark::after {
      content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    }
    /* tool button — bare icon, lights on hover like the header segment */
    .pvtoolbar .tb {
      flex: none; width: 28px; height: 26px; border: none; border-radius: 6px;
      background: transparent; color: var(--ink-soft); cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font: 12px -apple-system, system-ui, sans-serif;
    }
    .pvtoolbar .tb:hover { background: var(--elevated); color: var(--ink); }
    .pvtoolbar .tb:active { background: var(--edge); }
    .pvtoolbar .tb.on { background: var(--elevated); color: var(--ink); }
    .pvtoolbar .tbsep { flex: none; width: 1px; height: 18px; margin: 0 4px; background: var(--edge); }
    /* heading picker: a custom button (system <select> menus can't be themed),
       label + chevron; opens .tbpop.tbmenu below it. */
    .pvtoolbar .tbhead {
      flex: none; height: 26px; padding: 0 6px 0 9px; border: none; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent; color: var(--ink-soft); cursor: pointer;
      font: 12px -apple-system, system-ui, sans-serif; white-space: nowrap;
    }
    .pvtoolbar .tbhead:hover, .pvtoolbar .tbhead.open { background: var(--elevated); color: var(--ink); }
    .pvtoolbar .tbhead .lbl { min-width: 58px; text-align: left; }
    /* The picker names the current block ("Text", "Heading 2") when the row can
       afford 58px of label, and collapses to an H icon when it can't — which is
       what buys the last ~43px in a narrow pane and keeps every tool reachable
       instead of scrolled off the end. syncToolbarOverflow sets .tight. */
    .pvtoolbar .tbhead .ic { display: none; align-items: center; }
    .pvtoolbar.tight .tbhead .ic { display: inline-flex; }
    .pvtoolbar.tight .tbhead .lbl { display: none; }
    .pvtoolbar.tight .tbhead { padding: 0 4px 0 6px; }
    .pvtoolbar .tbhead svg { opacity: 0.7; }

    /* Shared floating popover for toolbar controls (heading menu, table grid,
       link input). Anchored under its button inside .pvbody; themed with the
       overlay tokens (--ink/--edge on --surface), pointer-events on. */
    .tbpop {
      position: absolute; z-index: 6; pointer-events: auto;
      background: var(--surface); border: 1px solid var(--edge); border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.28); padding: 5px;
      font: 13px -apple-system, system-ui, sans-serif; color: var(--ink);
    }
    .tbmenu { min-width: 150px; }
    .tbmenu .row {
      display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px;
      border-radius: 6px; cursor: pointer; color: var(--ink);
    }
    .tbmenu .row:hover { background: var(--elevated); }
    .tbmenu .row .tick { width: 14px; color: var(--accent); opacity: 0; }
    .tbmenu .row.sel .tick { opacity: 1; }
    .tbmenu .row .h1 { font-size: 17px; font-weight: 700; }
    .tbmenu .row .h2 { font-size: 15px; font-weight: 700; }
    .tbmenu .row .h3 { font-size: 13px; font-weight: 700; }
    /* Insert menu (the + button). Icon, label, and the markdown that produces the
       same block — the hint is the point: it teaches the input rule that makes
       the menu unnecessary, so the surface trains you out of needing it. */
    .tbinsert { min-width: 218px; }
    .tbinsert .row .ic { display: inline-flex; width: 15px; color: var(--ink-soft); }
    .tbinsert .row .lbl { flex: 1 1 auto; }
    .tbinsert .row .hint {
      flex: 0 0 auto; color: var(--ink-faint); font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--elevated); border-radius: 4px; padding: 3px 5px; white-space: pre;
    }
    .tbinsert .row:hover .hint { color: var(--ink-soft); }
    .tbinsert .row:hover .ic { color: var(--ink); }
    .tbmenusep { height: 1px; margin: 5px 9px; background: var(--edge); }

    /* Table size picker — hover to light an N×M block, click to insert. Roomy
       gaps so the cells read as a grid you're pointing into, not a filled block. */
    .tbgrid { display: grid; grid-template-columns: repeat(8, 16px); gap: 6px; padding: 5px 5px 3px; }
    .tbgrid .cell {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1px solid var(--edge); background: var(--bg); cursor: pointer;
      transition: background .06s ease, border-color .06s ease;
    }
    .tbgrid .cell.hot { background: color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
    .tbgridlabel { text-align: center; color: var(--ink-soft); font-size: 11px; padding: 6px 0 2px; }

    /* Link input popover — a URL field + Add. Enter applies, Esc dismisses. */
    .tblinkpop { display: flex; align-items: center; gap: 6px; }
    .tblinkpop input {
      width: 220px; height: 28px; padding: 0 9px; border-radius: 7px;
      border: 1px solid var(--edge); background: var(--bg); color: var(--ink);
      font: 13px -apple-system, system-ui, sans-serif; outline: none;
    }
    .tblinkpop input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
    .tblinkpop .go {
      height: 28px; padding: 0 12px; border: none; border-radius: 7px; cursor: pointer;
      background: var(--accent); color: var(--bg); font: 600 12px -apple-system, system-ui, sans-serif;
    }

    /* the editable prose surface: a real caret, no focus ring, comfortable gutter */
    .pvrender.editing { outline: none; cursor: text; }
    .pvrender.editing .md { caret-color: var(--accent); }
    .pvrender.editing .md:focus { outline: none; }
    /* tables get visible cell edges while editing so structure is legible */
    .pvrender.editing table td, .pvrender.editing table th {
      border: 1px solid var(--edge); padding: 5px 9px; min-width: 40px;
    }
    /* Add-column / add-row controls — floating "+" buttons that hug the right
       and bottom edge of whichever table the cursor is over. They live OUTSIDE
       the contenteditable (in .pvbody) so they never serialize into markdown. */
    .tbtablectl {
      position: absolute; z-index: 6; display: none; align-items: center; justify-content: center;
      border: 1px solid var(--edge); background: var(--surface); color: var(--ink-soft);
      cursor: pointer; border-radius: 6px; padding: 0; line-height: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18); transition: background .1s ease, color .1s ease;
    }
    .tbtablectl.show { display: inline-flex; }
    .tbtablectl:hover { background: var(--accent); color: var(--bg); border-color: transparent; }
    .tbtablectl.col { width: 20px; }   /* height set inline to match the table */
    .tbtablectl.row { height: 20px; }   /* width set inline to match the table */

    /* "Edit this page" pencil — a quiet ghost button in the pane header, matching
       the notes toggle beside it. It used to float over the prose top-right; it
       sits in the header now so the reading surface carries no chrome of its own.
       Shown only for rendered markdown (.canedit), and hidden in edit mode, where
       the header becomes the formatting bar and Done/👁 are the way out. */
    .pvhead .pvpencil {
      flex: 0 0 auto; display: none; align-items: center; justify-content: center;
      width: 28px; height: 24px; padding: 0; border-radius: 5px;
      border: 1px solid transparent; background: transparent; color: var(--ink-faint);
      cursor: pointer; transition: background .12s ease, color .12s ease;
    }
    .pvhead .pvpencil svg { display: block; }
    .pvhead.canedit .pvpencil,
    .pvhead.canedithtml .pvpencil { display: inline-flex; }   /* HTML in-place edit shares this pencil */
    .pvhead .pvpencil:hover { background: var(--elevated); color: var(--ink); }
    .pvhead.editing .pvpencil { display: none; }

    /* in-pane browser chrome strip: back/fwd/reload + address bar + open-in-
       browser. Drawn at the top of the rendered pane; the native child webview
       is inset below it (height must match LIVE_STRIP_H in app.ts) so this DOM
       strip stays visible and clickable above the page the webview paints.
       --surface-soft like every other in-pane strip (see .pvhead) — --surface is
       for the window's own chrome bands (#bar, #footer) and floating cards. */
    /* --live-strip is the chrome-strip height, shared by the bar and the files
       dropdown that sits directly below it. Bumped when the preview is expanded
       (full-window) so the bar has room to breathe in the larger frame. */
    /* 40px so the nav bar's bottom border lands on the SAME horizontal line as a
       neighboring pane's tab strip (#tabs / .pvhead are 40px + 1px border) — a
       shorter bar left the divider misaligned across a side-by-side split. */
    .pvrender { --live-strip: 40px; }
    html.tauri.preview-focus .pvrender { --live-strip: 46px; }
    /* The browser's top chrome — nav bar + bookmarks bar + open-docs dropdown —
       stacked in one absolutely-positioned flow container. The native webview
       insets below its full height (syncLiveBoard), so every row pushes the page
       down and stays live. renderHtmlBrowser uses a bare .livebar (kept absolute
       by the base rule below); only .livechrome flips its child bar to flow. */
    .livechrome { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
    .livechrome .livebar { position: static; }
    .livebar {
      position: absolute; top: 0; left: 0; right: 0; height: var(--live-strip); z-index: 2;
      display: flex; align-items: center; gap: 2px; padding: 0 8px; box-sizing: border-box;
      background: var(--surface-soft); border-bottom: 1px solid var(--edge);
      user-select: none; -webkit-app-region: no-drag;
    }
    /* Bookmarks bar: a chip row below the nav bar, hidden when empty. */
    .bmbar {
      display: none; align-items: center; gap: 3px; padding: 4px 8px; box-sizing: border-box;
      background: var(--surface-soft); border-bottom: 1px solid var(--edge);
      overflow-x: auto; overflow-y: hidden; white-space: nowrap;
    }
    .bmbar::-webkit-scrollbar { display: none; }
    .bmchip {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px;
      max-width: 180px; height: 24px; padding: 0 9px; border: none; border-radius: 6px;
      background: transparent; color: var(--ink-soft); cursor: pointer;
      font: 12px -apple-system, system-ui, sans-serif; -webkit-app-region: no-drag;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bmchip:hover { background: var(--elevated); color: var(--ink); }
    .bmchip .lbl { overflow: hidden; text-overflow: ellipsis; }
    .bmchip.folder svg:last-child { color: var(--ink-faint); }
    .bmchip.editing { padding: 0; background: transparent; }
    .bmedit {
      height: 24px; width: 130px; padding: 0 8px; box-sizing: border-box;
      border: 1px solid var(--accent); border-radius: 6px; background: var(--bg);
      color: var(--ink); font: 12px -apple-system, system-ui, sans-serif; outline: none;
    }
    .livebar .livebtn.on { color: var(--accent); }
    /* Expanded: give the controls more air to match the roomier strip. */
    html.tauri.preview-focus .livebar { gap: 5px; padding: 0 16px; }
    html.tauri.preview-focus .livebar .liveaddr { height: 30px; }
    /* Open-documents dropdown: an in-pane strip below the bar. The native webview
       insets below it (syncLiveBoard), so the page slides down and stays live —
       no blackout. Only real docs list here; the website itself is excluded. */
    .livefiles {
      display: none; padding: 5px; box-sizing: border-box; max-height: 45vh; overflow-y: auto;
      background: var(--surface-soft); border-bottom: 1px solid var(--edge);
    }
    .livefiles.open { display: block; }
    .livefiles .lfitem {
      padding: 7px 12px; border-radius: 7px; color: var(--ink); cursor: pointer;
      font: 12px -apple-system, system-ui, sans-serif;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .livefiles .lfitem:hover { background: var(--elevated); }
    .livefiles .lfitem.active { color: var(--accent); }
    .livefiles .lfitem.empty { color: var(--ink-faint); cursor: default; }
    .livefiles .lfitem.empty:hover { background: transparent; }
    .livebar .livebtn {
      flex: none; width: 28px; height: 26px; border: none; border-radius: 6px;
      background: transparent; color: var(--ink-soft); cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      -webkit-app-region: no-drag; transition: background .12s ease, color .12s ease;
    }
    .livebar .livebtn:hover { background: var(--elevated); color: var(--ink); }
    .livebar .livebtn:active { background: var(--edge); }
    .livebar .livebtn:disabled { color: var(--ink-ghost); cursor: default; background: transparent; }
    /* a hairline divider between the nav cluster and the address bar */
    .livebar .liveaddr {
      flex: 1 1 auto; min-width: 0; height: 26px; padding: 0 11px; margin: 0 6px;
      border: 1px solid var(--edge); border-radius: 7px; background: var(--bg);
      color: var(--ink); font: 12px -apple-system, system-ui, sans-serif;
      outline: none; -webkit-app-region: no-drag;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    .livebar .liveaddr::selection { background: var(--accent); color: var(--bg); }
    .livebar .liveaddr:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
    /* live mode (opt-in via the third seg button): editor and rendered share
       the body 50/50 and the rendered half re-renders as you type — the split
       view the landing page mockup shows. Neither half moves; they just
       stop overlapping. Default is left/right; .vsplit stacks them top/bottom
       (editor on top), toggled by re-clicking the live button. */
    .pvbody.live .pveditwrap.show { right: 50%; }
    .pvbody.live .pvrender.show { left: 50%; border-left: 1px solid var(--edge); }
    .pvbody.live.vsplit .pveditwrap.show { right: 0; bottom: 50%; }
    .pvbody.live.vsplit .pvrender.show { left: 0; top: 50%; border-left: none; border-top: 1px solid var(--edge); }
    /* read-only code/text view inside the rendered pane */
    .pvrender pre.raw {
      margin: 0; padding: 14px 16px; white-space: pre; overflow: auto;
      color: var(--ink); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    /* iframe view for html files fills the pane */
    .pvrender iframe.htmlframe {
      width: 100%; height: 100%; border: none; background: var(--elevated);
    }
    /* a live URL (spike open http://…) renders in a native child webview pinned
       over this box (see live_webview.rs / syncLiveBoard) — not an iframe, which
       underfills a width=device-width page in WebKit. The box itself stays empty;
       its background shows only for the instant before the webview paints. */
    /* ── HTML preview floating controls (zoom · find · back) ──────────────
       All three anchor to .pvbody (position:relative) and only appear when
       relevant — no persistent browser chrome. Shared surface/edge language so
       they read as Spike, not a bolt-on. */
    .htmlzoom, .htmlnav {
      position: absolute; z-index: 12; display: none; align-items: center; gap: 2px;
      padding: 3px; border-radius: 9px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--edge); box-shadow: 0 6px 20px rgba(var(--shadow), calc(.28 * var(--shadow-k)));
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font: 12px -apple-system, system-ui, sans-serif; opacity: 0;
      transition: opacity .14s ease;
    }
    .htmlzoom.show, .htmlnav.show { display: inline-flex; opacity: 1; }
    .htmlzoom { right: 12px; bottom: 12px; }
    /* Focus mode is not HTML-specific — any open doc can be expanded, markdown
       included. Zooming still is (it scales an iframe), so a doc with no frame
       shows the pill carrying only the ⤢. */
    .htmlzoom.zoomless .zi[data-z="in"],
    .htmlzoom.zoomless .zi[data-z="out"],
    .htmlzoom.zoomless .htmlzoom-pct { display: none; }
    .htmlnav { left: 12px; top: 12px; }
    /* HTML in-place text edit no longer floats a pill over the prose — the way in
       is the header .pvpencil (shared with markdown; see .pvhead.canedithtml). */
    /* static file-name label in the browser-mode strip: an address bar that
       isn't editable (a local file has no URL to type), so no focus affordance. */
    .livebar .liveaddr.livelocal {
      display: flex; align-items: center; cursor: default;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--ink-soft);
    }
    .htmlzoom .htmlzoom-pct {
      min-width: 38px; text-align: center; color: var(--ink-soft);
      font-variant-numeric: tabular-nums; user-select: none;
    }
    .htmlzoom .zi, .htmlnav .ni {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 24px; height: 24px; padding: 0 7px; border: none; border-radius: 6px;
      background: transparent; color: var(--ink-soft); cursor: pointer;
      font: inherit; line-height: 1;
    }
    .htmlzoom .zi { font-size: 14px; }
    .htmlzoom .zi:hover, .htmlnav .ni:hover { background: var(--elevated); color: var(--ink); }
    .htmlnav .ni { gap: 3px; font-weight: 500; }
    /* find-in-page bar — top-right, revealed by ⌘F. Two rows: find always, and
       replace only when asked for (⌥⌘F or the › toggle), so the common case
       stays a single quiet line. */
    .pvfind {
      position: absolute; z-index: 12; top: 12px; right: 12px; display: none;
      flex-direction: column; align-items: stretch; gap: 3px;
      padding: 4px; border-radius: 9px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid var(--edge); box-shadow: 0 6px 20px rgba(var(--shadow), calc(.28 * var(--shadow-k)));
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .pvfind.show { display: inline-flex; }
    .pvfind .pvfind-row { display: flex; align-items: center; gap: 4px; }
    /* the replace row is present but collapsed until .replacing */
    .pvfind .pvfind-rep { display: none; }
    .pvfind.replacing .pvfind-rep { display: flex; }
    /* › rotates to ⌄ when the replace row is open */
    .pvfind .pvfind-toggle { transition: transform .12s ease; }
    .pvfind.replacing .pvfind-toggle { transform: rotate(90deg); }
    /* replace is source-text only: hidden outright when the pane can't offer it */
    .pvfind.noreplace .pvfind-toggle { display: none; }
    .pvfind .pvfind-in, .pvfind .pvfind-rep-in {
      width: 150px; border: none; outline: none; background: transparent;
      color: var(--ink); font: 13px -apple-system, system-ui, sans-serif;
    }
    .pvfind .pvfind-in::placeholder, .pvfind .pvfind-rep-in::placeholder { color: var(--ink-ghost); }
    /* the two word-buttons on the replace row size to their label */
    .pvfind .pvfind-btn.wide {
      width: auto; padding: 0 8px; font: 11px -apple-system, system-ui, sans-serif;
    }
    .pvfind .pvfind-btn[disabled] { opacity: .35; cursor: default; }
    .pvfind .pvfind-btn[disabled]:hover { background: transparent; color: var(--ink-soft); }
    .pvfind .pvfind-count {
      min-width: 30px; text-align: right; color: var(--ink-faint);
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums;
    }
    .pvfind .pvfind-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border: none; border-radius: 6px;
      background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 12px; line-height: 1;
    }
    .pvfind .pvfind-btn:hover { background: var(--elevated); color: var(--ink); }
    /* image preview: contained + centered on a faint checker-free surface */
    .pvrender img.pvimg {
      display: block; max-width: 100%; max-height: 100%; margin: auto;
      position: absolute; inset: 0; object-fit: contain; padding: 16px; box-sizing: border-box;
    }
    /* pdf preview uses the browser's native viewer */
    .pvrender iframe.pvpdf { width: 100%; height: 100%; border: none; background: var(--elevated); }
    /* audio / video players, centered in the pane */
    .pvrender video.pvvideo { position: absolute; inset: 0; max-width: 100%; max-height: 100%; margin: auto; }
    .pvrender audio.pvaudio { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 80%; max-width: 460px; }
    /* csv / tsv rendered as a scrollable table with a sticky header */
    .pvrender .csvwrap { position: absolute; inset: 0; overflow: auto; }
    .pvrender table.csv {
      border-collapse: collapse; width: max-content; min-width: 100%;
      font: 12px/1.5 -apple-system, system-ui, sans-serif; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .pvrender table.csv th, .pvrender table.csv td {
      border: 1px solid var(--edge); padding: 5px 10px; text-align: left;
      white-space: nowrap; vertical-align: top; max-width: 360px;
      overflow: hidden; text-overflow: ellipsis;
    }
    .pvrender table.csv th {
      position: sticky; top: 0; z-index: 1; background: var(--surface);
      font-weight: 600; color: var(--ink-soft);
    }
    .pvrender table.csv tbody tr:nth-child(even) td { background: var(--surface-soft); }

    /* ── interactive data table (Spike table) ────────────────────────────── */
    /* Fills the preview BODY (a flex column), so the grid sits below the panel
       header instead of covering it. --dt-sel is the sticky selection-column
       width; the primary column pins just to its right. */
    #home .hpv-body.hpv-table { padding: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--dt-surface); }
    /* crisp white(ish) table surface + tokens for hover/selection over it */
    .dtwrap {
      --dt-sel: 46px;
      /* hairline separators derived from ink (theme-aware) — no cream bands, no
         vertical dividers; the whole grid lives on one clean --elevated surface */
      --dt-line: color-mix(in srgb, var(--ink) 6.5%, transparent);
      --dt-line-soft: color-mix(in srgb, var(--ink) 4%, transparent);
      /* an elevated card tone: lighter than the chat/Home bg but not stark white
         — mostly --elevated with a hint of --bg, so it reads on-theme in light AND
         dark. Tag pills still tint --elevated so they stay clean on it. */
      --dt-surface: color-mix(in srgb, var(--elevated) 68%, var(--bg));
      --dt-hover: color-mix(in srgb, var(--ink) 3.5%, var(--dt-surface));
      --dt-selected: color-mix(in srgb, var(--accent) 9%, var(--dt-surface));
      background: var(--dt-surface);
      flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    }
    .dt-bar {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      padding: 8px 14px; background: transparent;
    }
    .dt-filter {
      font: 12px/1.4 -apple-system, system-ui, sans-serif; color: var(--ink);
      background: var(--elevated); border: 1px solid var(--edge); border-radius: 7px;
      padding: 5px 9px; width: 200px; outline: none;
    }
    .dt-filter:focus { border-color: var(--accent); }
    .dt-count { font: 11px/1 system-ui, sans-serif; color: var(--ink-faint); }
    .dt-act {
      font: 12px/1 -apple-system, system-ui, sans-serif; color: var(--ink-soft);
      background: var(--elevated); border: 1px solid var(--edge); border-radius: 7px;
      padding: 6px 11px; cursor: pointer; white-space: nowrap; flex: 0 0 auto;
    }
    .dt-act:hover { background: var(--surface); color: var(--ink); }
    .dt-act.primary { background: var(--accent); color: var(--bg); border-color: transparent; }
    .dt-act.primary:hover { filter: brightness(1.06); }
    .dt-act.danger { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 40%, var(--edge)); }
    .dt-act.danger:hover { background: color-mix(in srgb, var(--rose) 14%, transparent); }
    .dt-act:disabled { opacity: .55; cursor: default; }

    .dt-scroll { flex: 1 1 auto; overflow: auto; width: 100%; min-width: 0; }
    table.dt {
      border-collapse: separate; border-spacing: 0; width: 100%;
      font: 12.5px/1.5 -apple-system, system-ui, sans-serif; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    /* NO vertical dividers, ever. Rows carry an ultra-faint hairline; nothing
       else. Everything sits on one white/charcoal --elevated surface. */
    table.dt th, table.dt td {
      border-bottom: 1px solid var(--dt-line-soft);
      text-align: left; vertical-align: middle; background: var(--dt-surface);
    }
    /* NOTE: padding is NOT set here on purpose — a generic `table.dt td` (0,1,2)
       would out-specify per-cell padding rules like .dt-selcell (0,1,0) and win.
       Each cell type sets its own padding below; header th resets to 0 (its label
       .dt-hname carries the padding). */
    .dt-th { padding: 0; }
    .dt-endcap, .dt-endcap-h { padding: 0; }
    /* header row — INVISIBLE: same surface, no divider, no grid lines. Labels
       pinned to the top with room to breathe, bold like section titles. */
    table.dt thead th {
      position: sticky; top: 0; z-index: 2; background: var(--dt-surface);
      border-bottom: none;
      font-weight: 600; color: var(--ink-soft); white-space: nowrap;
    }
    .dt-hicon { opacity: .55; }
    /* header cells MUST stay position:sticky (top:0) — a bare `position:relative`
       here (0,1,0) out-specifies `table.dt thead th` (0,0,3) and would un-stick the
       whole header row on vertical scroll. sticky still gives child abs-positioning
       a containing block, so nothing else needs `relative`. */
    .dt-th { position: sticky; top: 0; }
    .dt-hname {
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 18px 30px 12px 18px; user-select: none; max-width: 340px; font-size: 12.5px;
    }
    .dt-hname:hover { color: var(--ink-soft); }
    .dt-hicon { color: var(--ink-faint); display: inline-flex; align-items: center; }
    .dt-aa { font: 700 11px/1 -apple-system, system-ui, sans-serif; letter-spacing: -.02em; }
    .dt-htext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dt-sort { color: var(--accent); font-size: 9px; width: 9px; }
    .dt-kebab {
      position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; color: var(--ink-faint);
      cursor: pointer; padding: 2px 5px; border-radius: 5px; font-size: 14px; line-height: 1;
      opacity: 0; transition: opacity .12s;
    }
    .dt-th:hover .dt-kebab { opacity: 1; }
    .dt-kebab:hover { background: var(--elevated); color: var(--ink); }
    .dt-rename {
      box-sizing: border-box; font: 600 12.5px/1.4 system-ui, sans-serif; color: var(--ink);
      background: var(--elevated); border: 1px solid var(--accent); border-radius: 6px;
      padding: 6px 9px; margin: 4px 6px; width: 150px; outline: none;
    }

    /* body cells */
    table.dt tbody td { background: var(--dt-surface); }
    table.dt tbody tr:hover td { background: var(--dt-hover); }
    table.dt tbody tr.is-selected td { background: var(--dt-selected); }
    /* no max-width cap: with table width:100% the columns share slack and the
       grid fills the panel (incl. fullscreen); min-width keeps them readable */
    .dt-td { padding: 0 18px; height: 48px; min-width: 100px; max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; color: var(--ink-soft); }
    table.dt.dt-fill { table-layout: auto; }
    /* trailing spacer column: greedy width so real columns keep their size and
       the row backgrounds + separators extend cleanly to the panel edge */
    .dt-endcap { width: 100%; min-width: 0; padding: 0; }
    /* values left-align to match the (left) header labels — no header/data drift */
    .dt-td.dt-number { text-align: left; font-variant-numeric: tabular-nums; }
    .dt-stars { letter-spacing: 1px; font-size: 12px; }
    .dt-td.dt-checkbox { text-align: left; cursor: default; }
    .dt-dash { color: var(--ink-ghost); }
    .dt-celltext { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
    /* editing fills the cell seamlessly — a clean inset accent ring, matched
       padding, no floating bordered box */
    .dt-td.editing { padding: 0; }
    .dt-edit {
      box-sizing: border-box; width: 100%; height: 100%; min-height: 28px; margin: 0;
      font: 12.5px/1.5 -apple-system, system-ui, sans-serif; color: var(--ink);
      background: var(--dt-surface); border: none; border-radius: 6px;
      outline: 2px solid var(--accent); outline-offset: -2px; padding: 0 16px;
    }
    .dt-fval.editing { border-radius: 6px; }
    .dt-edit::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
    select.dt-edit { cursor: pointer; }

    /* selection column (sticky-left) + styled checkbox. Left padding so the row
       numbers / checkbox aren't squished against the panel rail. */
    .dt-selcell {
      width: var(--dt-sel); min-width: var(--dt-sel); text-align: left; padding: 0 6px 0 16px;
      position: sticky; left: 0; z-index: 2; background: var(--dt-surface);
    }
    thead th.dt-selcell { z-index: 4; background: var(--dt-surface); top: 0; }
    tbody tr:hover td.dt-selcell { background: var(--dt-hover); }
    tbody tr.is-selected td.dt-selcell { background: var(--dt-selected); }
    .dt-check { position: relative; display: inline-flex; width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }
    .dt-check input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
    .dt-check-box {
      width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--edge);
      display: inline-flex; align-items: center; justify-content: center; color: var(--bg);
      transition: background .12s, border-color .12s;
    }
    .dt-check-box.on { background: var(--accent); border-color: var(--accent); }
    .dt-check-dash { width: 8px; height: 2px; border-radius: 1px; background: var(--bg); }

    /* primary column (sticky, monogram + emphasized name) */
    .dt-primary { position: sticky; left: var(--dt-sel); z-index: 1; min-width: 210px; }
    thead th.dt-primary { z-index: 3; top: 0; }
    .dt-td.dt-primary { font-weight: 600; color: var(--ink); }
    /* sticky columns rely on their opaque bg to occlude scrolled content — no
       divider line, so the grid stays clean when nothing is scrolled under it */
    .dt-mono {
      display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
      width: 22px; height: 22px; border-radius: 6px; margin-right: 9px; flex: 0 0 auto;
      font: 700 11px/1 system-ui, sans-serif; text-transform: uppercase;
      background: color-mix(in srgb, var(--tag) 20%, var(--elevated));
      color: color-mix(in srgb, var(--tag) 82%, var(--ink));
    }
    .dt-primary-name { vertical-align: middle; }

    /* tag pills (select columns) */
    .dt-tags { display: inline-flex; align-items: center; gap: 6px; overflow: hidden; }
    .dt-tag {
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      padding: 2px 8px; border-radius: 5px; font-size: 12px; line-height: 1.5; font-weight: 500;
      /* clean pastel: tint the WHITE table surface (not the cream app bg, which
         muddies it); text stays close to the real hue for a crisp colored label */
      background: color-mix(in srgb, var(--tag) 17%, var(--elevated));
      color: color-mix(in srgb, var(--tag) 82%, var(--ink));
    }
    .dt-tag-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tag); flex: 0 0 auto; }

    /* url cell → open-external affordance on hover */
    .dt-haslink { position: relative; }
    .dt-linkopen {
      border: none; background: transparent; color: var(--accent); cursor: pointer;
      padding: 2px 4px; margin-left: 4px; border-radius: 4px; vertical-align: middle;
      opacity: 0; transition: opacity .12s;
    }
    .dt-td.dt-haslink:hover .dt-linkopen { opacity: 1; }
    .dt-linkopen:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }

    /* calculations footer (sticky bottom) */
    tfoot td {
      position: sticky; bottom: 0; z-index: 2; background: var(--dt-surface);
      border-top: 1px solid var(--dt-line); border-bottom: none;
      padding: 10px 18px; font-size: 11px; color: var(--ink-faint); white-space: nowrap;
    }
    tfoot td.dt-selcell { z-index: 3; left: 0; }
    tfoot td.dt-primary { z-index: 3; }
    .dt-footnum { color: var(--ink-soft); font-weight: 600; }
    .dt-footlbl { color: var(--ink-faint); }

    .dt-empty { padding: 18px; color: var(--ink-faint); text-align: center; font-style: italic; }
    /* "+" add-row in the footer (same row as the count) */
    .dt-footadd { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: none; background: none; color: var(--ink-faint); cursor: pointer; border-radius: 6px; }
    .dt-footadd:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
    .dt-footadd svg { display: block; }
    /* url/link cells */
    .dt-urltext { color: var(--accent); }

    /* one popover standard — every menu/picker shares this shell + row metrics */
    .dt-menu {
      position: fixed; z-index: 60; min-width: 190px; max-width: 280px; padding: 6px;
      background: var(--elevated); border: 1px solid var(--edge); border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.24); font: 12.5px/1.4 -apple-system, system-ui, sans-serif;
    }
    .dt-mrow { padding: 7px 9px; border-radius: 6px; color: var(--ink); cursor: pointer; min-height: 20px; }
    .dt-mrow:hover { background: var(--surface); }
    .dt-mrow.sel { color: var(--accent); font-weight: 600; }
    .dt-mrow.danger { color: var(--rose); }
    .dt-mrow.danger:hover { background: color-mix(in srgb, var(--rose) 16%, transparent); }
    .dt-mhdr { padding: 8px 9px 3px; color: var(--ink-faint); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .dt-mhdr:first-child { padding-top: 4px; }
    /* select-cell option popover (themed replacement for native <select>) */
    /* cap height + scroll so a long option list never spills past the viewport
       (it used to run under the dock and clip the last options) */
    .dt-selectpop { min-width: 200px; max-height: 56vh; overflow-y: auto; }
    .dt-selopt { display: flex; align-items: center; gap: 8px; }
    .dt-selopt.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .dt-selopt.sel:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .dt-selclear { color: var(--ink-soft); }
    /* add-value input sits INSIDE the popover padding (border-box + full width) */
    .dt-seladd { display: block; width: 100%; margin: 5px 0 1px; }
    /* select-popover option rows: hover reveals a ⋯ that opens the option editor */
    .dt-seloptright { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto; }
    .dt-optmore {
      width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--ink-faint); cursor: pointer; border-radius: 5px;
      opacity: 0; transition: opacity .1s;
    }
    .dt-mrow:hover .dt-optmore, .dt-optrow:hover .dt-optmore { opacity: 1; }
    .dt-optmore:hover { background: var(--surface-soft); color: var(--ink-soft); }
    /* option manager popover — Notion two-screen (list + per-option editor) */
    .dt-optmgr { min-width: 260px; max-height: 62vh; overflow-y: auto; }
    .dt-optlist { display: flex; flex-direction: column; gap: 1px; }
    .dt-optgrp { padding: 8px 6px 3px; color: var(--ink-faint); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .dt-optrow { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 2px; border-radius: 6px; cursor: pointer; }
    .dt-optrow:hover { background: var(--surface); }
    .dt-optgrip {
      display: inline-flex; align-items: center; justify-content: center; width: 16px; flex: 0 0 auto;
      color: var(--ink-ghost); cursor: grab; opacity: 0; transition: opacity .1s;
    }
    .dt-optrow:hover .dt-optgrip { opacity: 1; }
    .dt-optgrip:active { cursor: grabbing; }
    /* drop indicator during drag-reorder */
    .dt-dropline { height: 2px; margin: 1px 6px; border-radius: 2px; background: var(--accent); }
    /* per-option editor screen */
    .dt-optback { color: var(--ink-soft); }
    .dt-opteditname { display: block; width: 100%; margin: 3px 0 6px; }
    /* named color list (swatch + name + check) — editor + board-group menu */
    .dt-collist { display: flex; flex-direction: column; gap: 1px; }
    .dt-colrow { display: flex; align-items: center; gap: 10px; }
    .dt-colsw { width: 18px; height: 18px; border-radius: 5px; flex: 0 0 auto; border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
    .dt-colrow .dt-selcheck { margin-left: auto; }
    .dt-optadd { display: block; width: 100%; margin: 6px 0 1px; }
    /* view settings — per-view property visibility + order */
    .dt-viewset-pop { min-width: 258px; max-height: 62vh; overflow-y: auto; }
    .dt-proplist { display: flex; flex-direction: column; gap: 1px; }
    .dt-propRow { display: flex; align-items: center; gap: 8px; padding: 4px 4px; border-radius: 6px; }
    .dt-propRow:hover { background: var(--surface); }
    .dt-propRow .dt-mi { flex: 0 0 auto; color: var(--ink-faint); display: inline-flex; }
    .dt-propRow .dt-mlabel { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dt-propeye {
      flex: 0 0 auto; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--ink-soft); cursor: pointer; border-radius: 6px;
    }
    .dt-propeye:hover { background: var(--surface-soft); color: var(--ink); }
    .dt-propeye.off { color: var(--ink-ghost); }
    .dt-propeye:disabled { opacity: .4; cursor: default; }
    .dt-propfoot { border-top: 1px solid var(--dt-line-soft); margin-top: 4px; padding-top: 2px; }
    .dt-adopt {
      display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
      padding: 11px 14px; border-bottom: 1px solid var(--edge-soft);
      background: var(--surface-soft); color: var(--ink-soft); font: 12px/1.4 system-ui, sans-serif;
    }

    /* ── toolbar icon buttons (filter / sort / more) ─────────────────────── */
    .dt-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border: 1px solid transparent; border-radius: 7px;
      background: transparent; color: var(--ink-soft); cursor: pointer; padding: 0;
    }
    .dt-iconbtn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
    .dt-iconbtn svg { display: block; }
    .dt-iconbtn.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    /* the universal "New record" create action — reads as the primary control */
    .dt-newrec { color: #fff; background: var(--accent); margin-left: 2px; }
    .dt-newrec:hover { color: #fff; background: var(--accent); filter: brightness(1.08); }
    /* primary "New ▾" split button (accent CTA) */
    .dt-newbtn { display: inline-flex; align-items: stretch; border-radius: 8px; overflow: hidden; }
    .dt-newmain { border: none; background: var(--accent); color: var(--bg); font: 600 12.5px/1 -apple-system, system-ui, sans-serif; padding: 0 15px; height: 30px; border-radius: 8px; cursor: pointer; flex: 0 0 auto; }
    .dt-newmain:hover { filter: brightness(1.07); }
    /* + to add a column, sitting on the table just past the last header cell */
    .dt-endcap-h { text-align: left; }
    .dt-addcolhdr { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin-left: 6px; border: none; background: none; color: var(--ink-faint); cursor: pointer; border-radius: 7px; }
    .dt-addcolhdr:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
    .dt-addcolhdr svg { display: block; }
    .dt-newcaret { border: none; background: var(--accent); color: var(--bg); width: 24px; height: 30px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; border-left: 1px solid color-mix(in srgb, var(--bg) 30%, transparent); }
    .dt-newmain:hover, .dt-newcaret:hover { filter: brightness(1.07); }
    .dt-newcaret svg { display: block; }
    .dt-filterwrap { display: inline-flex; align-items: center; }
    .dt-filterwrap .dt-filter {
      width: 0; padding: 0; border: 1px solid transparent; margin-left: 0;
      opacity: 0; pointer-events: none; transition: width .16s ease, opacity .12s, padding .16s;
    }
    .dt-filterwrap.open .dt-filter {
      width: 190px; padding: 5px 9px; margin-left: 6px; opacity: 1; pointer-events: auto;
      border-color: var(--edge); background: var(--elevated);
    }
    /* funnel count badge when filters are active */
    .dt-funnel { position: relative; }
    .dt-funnel[data-count]:not([data-count=""])::after {
      content: attr(data-count); position: absolute; top: -1px; right: -1px;
      min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px;
      background: var(--accent); color: #fff; font: 700 9px/14px system-ui, sans-serif; text-align: center;
    }

    /* filter chip bar (under the toolbar) */
    .dt-filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 0 14px 8px; flex: 0 0 auto; }
    .dt-fchip {
      display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--dt-line);
      background: var(--elevated); color: var(--ink-soft); border-radius: 7px; padding: 4px 8px;
      font: 12px/1 -apple-system, system-ui, sans-serif; cursor: pointer;
    }
    .dt-fchip:hover { border-color: color-mix(in srgb, var(--ink) 14%, transparent); }
    .dt-fchip-col { color: var(--ink); font-weight: 600; }
    .dt-fchip-op { color: var(--ink-faint); }
    .dt-fchip-val { color: var(--accent); font-weight: 600; }
    .dt-fchip-x { display: inline-flex; color: var(--ink-faint); border-radius: 4px; margin-left: 1px; }
    .dt-fchip-x:hover { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); }
    .dt-fchip-add { color: var(--ink-faint); border-style: dashed; }
    .dt-fchip-add:hover { color: var(--ink); }
    /* active-sort pill — accent-tinted like Notion, arrow + column name */
    .dt-sortchip { background: color-mix(in srgb, var(--accent) 12%, var(--elevated)); border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
    .dt-sortchip:hover { border-color: color-mix(in srgb, var(--accent) 44%, transparent); }
    .dt-sortchip svg { color: var(--accent); }
    .dt-sortchip .dt-fchip-col { color: var(--accent); }

    /* filter builder popover */
    .dt-filtermenu { min-width: 340px; max-width: 460px; padding: 8px; }
    .dt-frow { display: flex; align-items: center; gap: 6px; padding: 3px 2px; }
    .dt-fjoin { flex: 0 0 40px; font-size: 11.5px; color: var(--ink-faint); text-align: right; }
    .dt-fseg {
      display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--dt-line);
      background: var(--elevated); color: var(--ink); border-radius: 6px; padding: 5px 8px; cursor: pointer;
      font: 12.5px/1 -apple-system, system-ui, sans-serif; max-width: 150px;
    }
    .dt-fseg > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dt-fseg svg { flex: 0 0 auto; color: var(--ink-faint); }
    .dt-fseg:hover, .dt-fseg.open { border-color: color-mix(in srgb, var(--accent) 45%, var(--dt-line)); }
    .dt-fval-seg { flex: 1 1 auto; max-width: none; }
    .dt-finput {
      flex: 1 1 auto; min-width: 0; font: 12.5px/1.3 -apple-system, system-ui, sans-serif; color: var(--ink);
      background: var(--elevated); border: 1px solid var(--dt-line); border-radius: 6px; padding: 5px 8px; outline: none;
    }
    .dt-finput:focus { border-color: var(--accent); }
    .dt-fdel { flex: 0 0 auto; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; padding: 4px; border-radius: 5px; display: inline-flex; }
    .dt-fdel:hover { background: color-mix(in srgb, var(--rose) 15%, transparent); color: var(--rose); }
    .dt-fsub { margin: 2px 0 6px 46px; max-height: 220px; overflow: auto; border: 1px solid var(--dt-line-soft); border-radius: 8px; padding: 4px; background: color-mix(in srgb, var(--ink) 2%, var(--elevated)); }
    .dt-fadd { display: flex; align-items: center; gap: 7px; width: 100%; border: none; background: transparent; color: var(--ink-soft); cursor: pointer; padding: 8px 8px 6px; font: 500 12.5px/1 system-ui, sans-serif; border-radius: 7px; text-align: left; }
    .dt-fadd:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
    .dt-fadd svg { color: var(--ink-faint); }
    .dt-faddrow { display: flex; gap: 2px; }
    .dt-faddrow .dt-fadd { width: auto; }
    .dt-faddgroup { color: var(--ink-faint); }
    .dt-fclear { color: var(--ink-faint); padding-top: 2px; }
    /* And/Or conjunction toggle in the lead cell */
    .dt-fconj {
      flex: 0 0 40px; border: 1px solid var(--dt-line); background: var(--elevated); color: var(--accent);
      border-radius: 6px; padding: 4px 0; font: 600 11.5px/1 system-ui, sans-serif; cursor: pointer; text-align: center;
    }
    .dt-fconj:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--dt-line)); }
    /* a nested filter group — a soft bordered well containing its own rows */
    .dt-fgrouprow { align-items: flex-start; }
    .dt-fgroupbox {
      flex: 1 1 auto; min-width: 0; border: 1px solid var(--dt-line); border-radius: 9px;
      padding: 4px; background: color-mix(in srgb, var(--ink) 2.5%, var(--elevated));
    }
    /* collapsed filter pill in the toolbar row ("N rules"), accent-tinted */
    .dt-filterchip { background: color-mix(in srgb, var(--accent) 12%, var(--elevated)); border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
    .dt-filterchip:hover { border-color: color-mix(in srgb, var(--accent) 44%, transparent); }
    .dt-filterchip svg { color: var(--accent); }
    .dt-filterchip .dt-fchip-col { color: var(--accent); }

    /* header select-all is always shown (it IS the top-left affordance) */
    thead th.dt-selcell .dt-check { display: inline-flex; }
    /* column drag-to-reorder */
    .dt-th.col-dragging { opacity: .45; }
    .dt-th.col-over { box-shadow: inset 3px 0 0 var(--accent); }

    /* ── selection lane: row number at rest, checkbox on hover/selected ──── */
    .dt-selcell .dt-check { display: none; }
    .dt-rownum { color: var(--ink-ghost); font-size: 11px; font-variant-numeric: tabular-nums; }
    tr.dt-row:hover .dt-selcell .dt-check,
    tr.dt-row.is-selected .dt-selcell .dt-check { display: inline-flex; }
    tr.dt-row:hover .dt-selcell .dt-rownum,
    tr.dt-row.is-selected .dt-selcell .dt-rownum { display: none; }

    /* ── header sort/kebab as icons ──────────────────────────────────────── */
    .dt-sort { display: inline-flex; align-items: center; color: var(--accent); }
    .dt-sort svg { display: block; }
    .dt-kebab svg { display: block; }
    .dt-kebab { font-size: 0; }

    /* ── menus: leading icon + label rows (Notion-style) ─────────────────── */
    .dt-mrow { display: flex; align-items: center; gap: 9px; }
    .dt-mi { display: inline-flex; align-items: center; justify-content: center; width: 15px; color: var(--ink-faint); flex: 0 0 auto; }
    .dt-mrow:hover .dt-mi { color: var(--ink-soft); }
    .dt-mrow.sel .dt-mi { color: var(--accent); }
    .dt-mrow.danger .dt-mi { color: var(--rose); }
    .dt-mlabel { flex: 1 1 auto; }
    .dt-msep { height: 1px; margin: 5px 6px; background: var(--edge-soft); }
    .dt-selopt .dt-mi { display: none; }
    .dt-sortmenu { min-width: 190px; }

    /* ── date calendar popover ───────────────────────────────────────────── */
    .dt-datepop { min-width: 236px; padding: 8px; }
    .dt-cal-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; }
    .dt-cal-title { font: 600 12.5px/1 system-ui, sans-serif; color: var(--ink); }
    .dt-cal-nav { display: inline-flex; border: none; background: transparent; color: var(--ink-soft); cursor: pointer; padding: 4px; border-radius: 6px; }
    .dt-cal-nav:hover { background: var(--surface); color: var(--ink); }
    .dt-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .dt-cal-dow { text-align: center; font-size: 10px; color: var(--ink-faint); padding: 2px 0 4px; }
    .dt-cal-day {
      aspect-ratio: 1; display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--ink); cursor: pointer;
      border-radius: 7px; font: 12px/1 system-ui, sans-serif;
    }
    .dt-cal-day:hover { background: var(--surface); }
    .dt-cal-day.today { color: var(--accent); font-weight: 700; }
    .dt-cal-day.sel { background: var(--accent); color: var(--bg); font-weight: 600; }
    .dt-cal-foot { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--edge-soft); }
    .dt-cal-ftbtn { flex: 1; border: 1px solid var(--edge); background: var(--elevated); color: var(--ink-soft); border-radius: 6px; padding: 5px; font: 11.5px/1 system-ui, sans-serif; cursor: pointer; }
    .dt-cal-ftbtn:hover { background: var(--surface); color: var(--ink); }

    /* map-pin affordance reuses the link-open slot */
    .dt-mappin svg { display: block; }

    /* place column: pin + text, and the in-app location picker */
    .dt-place { display: inline-flex; align-items: center; gap: 6px; overflow: hidden; max-width: 100%; }
    .dt-placepin { display: inline-flex; color: var(--ink-faint); flex: 0 0 auto; }
    .dt-placepin svg { display: block; }
    .dt-placepop { min-width: 244px; }

    /* ── view bar (Table / Board / Gallery / List / Calendar) ────────────── */
    /* view tabs live INLINE in the single toolbar row (left side), not a band */
    .dt-viewbar { display: flex; align-items: center; gap: 2px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
    .dt-viewtab {
      display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent;
      color: var(--ink-faint); cursor: pointer; padding: 6px 11px; border-radius: 7px;
      font: 13px/1 -apple-system, system-ui, sans-serif;
    }
    .dt-viewtab:hover { color: var(--ink-soft); background: var(--surface-soft); }
    .dt-viewtab.active { color: var(--ink); font-weight: 600; background: var(--surface); }
    .dt-viewtab .dt-vi { display: inline-flex; color: currentColor; opacity: .85; }
    .dt-viewadd { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; border-radius: 6px; }
    .dt-viewadd:hover { background: var(--surface); color: var(--ink); }
    .dt-vrename { width: 120px; margin: 0; }

    /* view sub-header (group-by / date-field pickers, month nav) */
    .dt-viewhead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex: 0 0 auto; }
    .dt-view-board .dt-viewhead, .dt-view-calendar .dt-viewhead { position: sticky; left: 0; }
    .dt-pickbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--edge); background: var(--elevated); color: var(--ink-soft); border-radius: 7px; padding: 5px 9px; font: 12px/1 system-ui, sans-serif; cursor: pointer; }
    .dt-pickbtn:hover { background: var(--surface); color: var(--ink); }
    .dt-picklbl { color: var(--ink-faint); }
    .dt-pickval { color: var(--ink); font-weight: 500; }
    .dt-pickcar { display: inline-flex; color: var(--ink-faint); }

    /* shared card field */
    .dt-field { display: flex; flex-direction: column; gap: 2px; }
    .dt-flabel { font-size: 10.5px; color: var(--ink-faint); font-weight: 500; letter-spacing: .01em; }
    .dt-cardtitle.dt-untitled { color: var(--ink-faint); font-style: italic; font-weight: 500; cursor: text; }
    .dt-fval { height: auto; padding: 2px 0; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: text; border: none; }
    .dt-fval.dt-checkbox, .dt-fval.dt-select { padding: 0; }
    /* card/list fields always read left-aligned, regardless of table cell rules */
    .dt-fval.dt-checkbox, .dt-fval.dt-number { text-align: left; }

    /* Board — on the same almost-white canvas as the table; lanes are a barely-there
       grouping tint, cards lift on white so the columns read without hard boxes. */
    .dt-view-board .dt-scroll, .dt-scroll.dt-view-board { overflow: auto; }
    .dt-board { display: flex; align-items: flex-start; gap: 14px; padding: 10px 16px 28px; min-height: 100%; }
    .dt-lane { flex: 0 0 264px; width: 264px; background: color-mix(in srgb, var(--ink) 2.5%, var(--dt-surface)); border: 1px solid var(--dt-line-soft); border-radius: 12px; padding: 10px 10px 8px; align-self: stretch; min-height: 160px; }
    .dt-lane.over { border-color: color-mix(in srgb, var(--accent) 70%, var(--dt-line)); background: color-mix(in srgb, var(--accent) 9%, var(--dt-surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
    body.dt-dragging .dt-lane { transition: background .1s, border-color .1s; }
    .dt-lanehead { display: flex; align-items: center; gap: 8px; padding: 2px 4px 12px; }
    .dt-lanenone { color: var(--ink-faint); font-size: 12px; font-weight: 600; }
    .dt-lanecount { margin-left: auto; color: var(--ink-faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .dt-lanekebab { border: none; background: transparent; color: var(--ink-faint); cursor: pointer; padding: 2px; border-radius: 5px; display: inline-flex; opacity: 0; transition: opacity .12s; }
    .dt-lane:hover .dt-lanekebab { opacity: 1; }
    .dt-lanekebab:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
    .dt-lanebody { display: flex; flex-direction: column; gap: 8px; }
    .dt-card {
      background: var(--elevated); border: 1px solid var(--dt-line-soft); border-radius: 10px; padding: 12px;
      display: flex; flex-direction: column; gap: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .dt-lane .dt-card { cursor: grab; }
    .dt-card:hover { border-color: var(--dt-line); box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    .dt-card.dragging { opacity: .4; }
    /* The card that follows the cursor while dragging (a clone appended to body). */
    .dt-card-ghost { position: fixed; z-index: 9999; margin: 0; pointer-events: none;
      box-shadow: 0 12px 30px rgba(0,0,0,.22); transform: rotate(2deg) scale(1.02); opacity: .97; }
    body.dt-dragging, body.dt-dragging .dt-lane .dt-card { cursor: grabbing; }
    .dt-cardtitle { font-size: 14.5px; font-weight: 600; color: var(--ink); display: flex; align-items: center; height: auto; padding: 0; white-space: normal; }
    .dt-cardtitle .dt-mono { margin-right: 9px; }
    .dt-card .dt-fval { height: auto; padding: 0; }
    /* "+ New" affordance at the foot of a lane / end of a gallery|list
       (the compact table-footer "+" keeps its own .dt-footadd styling) */
    .dt-addrow:not(.dt-footadd) { display: flex; align-items: center; gap: 7px; width: 100%; border: none; background: transparent;
      color: var(--ink-faint); font: 500 13px/1 system-ui, sans-serif; cursor: pointer; padding: 8px 6px; border-radius: 8px; text-align: left; }
    .dt-addrow:not(.dt-footadd):hover { background: color-mix(in srgb, var(--ink) 4%, transparent); color: var(--ink-soft); }
    .dt-addrow:not(.dt-footadd) svg { flex: 0 0 auto; }
    .dt-lane .dt-addrow { margin-top: 4px; }
    .dt-gallery .dt-addrow, .dt-listview .dt-addrow { margin: 2px 8px; width: auto; }

    /* Gallery */
    .dt-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; padding: 12px 16px 24px; }
    .dt-gallery .dt-card { background: var(--elevated); padding: 14px; gap: 10px; }

    /* List */
    .dt-listview { display: flex; flex-direction: column; padding: 4px 8px 16px; }
    .dt-listrow { display: flex; align-items: center; gap: 16px; padding: 9px 8px; border-bottom: 1px solid var(--dt-line-soft); }
    .dt-listrow:hover { background: var(--dt-hover); }
    .dt-listrow .dt-cardtitle { flex: 0 0 240px; min-width: 0; overflow: hidden; }
    .dt-listmeta { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; min-width: 0; }
    .dt-listmeta .dt-field { flex-direction: row; align-items: center; }

    /* Calendar — clean sheet on the table's almost-white, hairline grid, today
       pilled in the accent, weekends + padding days faintly recessed. */
    .dt-calmonth { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; margin: 4px 16px 20px;
      background: var(--dt-line-soft); border: 1px solid var(--dt-line-soft); border-radius: 12px; overflow: hidden;
      row-gap: 1px; column-gap: 1px; }
    .dt-calmonth .dt-cal-dow { background: var(--dt-surface); padding: 8px 0; font-size: 10.5px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
    .dt-calcell { background: var(--dt-surface); min-height: 108px; padding: 6px 7px; display: flex; flex-direction: column; gap: 3px; position: relative; cursor: pointer; transition: background .1s; }
    .dt-calcell:hover { background: var(--dt-hover); }
    .dt-calcell.empty { background: color-mix(in srgb, var(--ink) 2.5%, var(--dt-surface)); cursor: default; }
    .dt-calcell.weekend { background: color-mix(in srgb, var(--ink) 1.5%, var(--dt-surface)); }
    .dt-calcell.today { background: color-mix(in srgb, var(--accent) 5%, var(--dt-surface)); }
    .dt-calcell.over { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 60%, var(--dt-line)); }
    .dt-caldnum { font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; align-self: flex-start;
      width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
    .dt-calcell.today .dt-caldnum { background: var(--accent); color: #fff; font-weight: 700; }
    .dt-caladd { position: absolute; top: 5px; right: 5px; border: none; background: transparent; color: var(--ink-faint);
      cursor: pointer; padding: 1px; border-radius: 5px; display: inline-flex; opacity: 0; transition: opacity .1s; }
    .dt-calcell:hover .dt-caladd { opacity: 1; }
    .dt-caladd:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
    .dt-calchip { font-size: 11.5px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: color-mix(in srgb, var(--tag) 16%, var(--elevated)); color: color-mix(in srgb, var(--tag) 82%, var(--ink)); cursor: grab; font-weight: 500; }
    .dt-calchip.dragging { opacity: .4; }

    .dt-boardtog.on { background: color-mix(in srgb, var(--accent) 12%, var(--dt-surface)); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, var(--dt-line)); }

    /* new-column popover: name it + pick its type in one step */
    .dt-newcolmenu { min-width: 220px; }
    .dt-newcolname { width: 100%; margin: 2px 0 6px; box-sizing: border-box; font: 13px/1.3 -apple-system, system-ui, sans-serif;
      color: var(--ink); background: var(--elevated); border: 1px solid var(--edge); border-radius: 7px; padding: 6px 9px; outline: none; }
    .dt-newcolname:focus { border-color: var(--accent); }

    /* multiselect option check + empty-note in the option popover */
    .dt-selcheck { margin-left: auto; color: var(--accent); display: inline-flex; }
    .dt-mnote { padding: 6px 10px; color: var(--ink-faint); font-size: 12.5px; }

    /* Obsidian-style wikilinks inside rendered markdown */
    .md a.wikilink {
      color: var(--mauve); text-decoration: none; cursor: pointer;
